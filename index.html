"Meia-noite","n":"Caçador Sombrio","t":"Talento","l":8,"c":2,"x":["Suas capacidades são aprimoradas quando você age nas sombras. Enquanto estiver na penumbra ou na escuridão, você recebe um bônus de +1 na Evasão e tem vantagem em testes de ataque."],"ax":[[]],"ef":[{"k":"ev","v":1,"lbl":"Enquanto estiver na penumbra ou na escuridão, você recebe um bônus de +1 na Evasão e tem vantagem em testes de ataque.","p":0}],"tk":0},{"d":"Meia-noite","n":"Carga Mágica","t":"Feitiço","l":8,"c":1,"x":["Ao sofrer dano mágico, coloque um número de marcadores nesta carta igual ao número de PV marcados. Você pode acumular um número de marcadores igual ao seu atributo de conjuração. Quando acertar um ataque contra um alvo, você pode gastar um número qualquer de marcadores e somar uma quantidade equivalente de **d6** à rolagem de dano."],"ax":[[]],"ef":[],"tk":1},{"d":"Meia-noite","n":"Terror Noturno","t":"Feitiço","l":9,"c":2,"x":["Uma vez por descanso longo, escolha quaisquer alvos muito próximos. Eles passam a ver você como uma horrorosa visão de pesadelo. Os alvos devem ter sucesso em um teste de reação (16) ou ficam temporariamente *Horrorizados*. Enquanto estiverem *Horrorizados*, eles ficam *Vulneráveis*. Roube uma quantidade de Medo do mestre igual ao número de alvos *Horrorizados* (até o máximo de acúmulos de Medo do mestre). Role um número de **d6** igual à quantidade de Medo roubado e cause o resultado deles como dano a cada alvo *Horrorizado*. Em seguida, descarte todo o Medo que roubou."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Tributo do Anoitecer","t":"Talento","l":9,"c":1,"x":["Escolha um alvo distante. Quando você tem sucesso em um teste que não resulta em uma rolagem de dano contra ele, coloque um marcador nesta carta. Ao causar dano contra esse alvo, gaste qualquer quantidade de marcadores e some um número equivalente de **d12** rolagem de dano. Você pode manter o Tributo do Anoitecer apenas sobre uma criatura por vez.","Ao escolher um novo alvo ou fazer um descanso, marcadores não utilizados são perdidos."],"ax":[[],[]],"ef":[],"tk":1},{"d":"Meia-noite","n":"Eclipse","t":"Feitiço","l":10,"c":2,"x":["Faça um **teste de conjuração (16)**. Uma vez por descanso longo, em um sucesso, faça com que toda a área em alcance distante caia em completa escuridão, na qual apenas você e seus aliados podem enxergar. Os testes de ataque contra você ou seus aliados têm desvantagem dentro dessa escuridão.","Além disso, quando você ou um aliado tem um sucesso com Esperança contra um adversário dentro dessa área, o alvo deve marcar 1 Ponto de Fadiga.","Este feitiço dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrar o efeito ou até você sofrer dano grave."],"ax":[[{"k":"c","dif":16},{"k":"u","s":"L"}],[],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Rastreador Talentoso","t":"Talento","l":1,"c":0,"x":["Ao rastrear uma criatura ou grupo de criaturas com base nos sinais da passagem delas, você pode **gastar qualquer quantidade de Pontos de Esperança** e fazer um número equivalente destas perguntas ao mestre:","• Para que direção ele(s) foi(foram)? Há quanto tempo a criatura ou grupo passou por aqui? O que a criatura ou grupo fazia neste lugar? Quantas criaturas havia?","Ao encontrar os alvos rastreados dessa forma, você recebe um bônus de +1 na Evasão contra elas."],"ax":[[],[],[]],"ef":[{"k":"ev","v":1,"lbl":"Ao encontrar os alvos rastreados dessa forma, você recebe um bônus de +1 na Evasão contra elas.","p":2}],"tk":0},{"d":"Sabedoria","n":"Vinha Voraz","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, raízes e vinhas saem do chão, causando **1d8+1** de dano físico e *Imobilizando* o alvo temporariamente.","Além disso, em um sucesso, você pode **gastar 1 Ponto de Esperança** para temporariamente *Imobilizar* um adversário muito próximo do primeiro."],"ax":[[{"k":"d","n":1,"die":8,"fl":1,"tp":"físico","m":null}],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Voz da Natureza","t":"Talento","l":1,"c":0,"x":["Você fala o idioma do mundo natural. Quando quiser falar com as plantas e animais ao seu redor, faça um **teste de Instinto (12)**. Em um sucesso, essas plantas ou animais fornecem a informação que conhecem. Se rolar com Medo, o conhecimento fornecido pode ser limitado ou ter um custo.","Além disso, antes de fazer um teste de conjuração em um ambiente natural, você pode **gastar 1 Ponto de Esperança** para receber um bônus de +2 na rolagem."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Espectro das Trevas","t":"Feitiço","l":10,"c":1,"x":["**Marque 1 Ponto de Fadiga** para tornar-se *Incorpóreo*. Essa condição dura até você à fazer um teste tendo outra criatura como alvo. Enquanto estiver *Incorpóreo*, você é imune a dano físico e pode flutuar e atravessar objetos sólidos. Outras criaturas ainda podem vê-lo nessa forma."],"ax":[[{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Conjurar Enxame","t":"Feitiço","l":2,"c":1,"x":["*Besouros Blindados de Tekaira:* **marque 1 PF** para conjurar um enxame de besouros ao seu redor. Na próxima vez que sofrer dano, reduza a gravidade em um limiar. Você pode **gastar 1 Ponto de Esperança** para manter os besouros conjurados após sofrer dano.","*Vaga-Lumes:* faça um **teste de conjuração** contra todos os adversários próximos. **Gaste 1 Ponto de Esperança** para causar **2d8+3** de dano mágico aos alvos atingidos."],"ax":[[{"k":"f","n":1}],[{"k":"d","n":2,"die":8,"fl":3,"tp":"mágico","m":null},{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Familiar da Natureza","t":"Feitiço","l":2,"c":1,"x":["**Gaste 1 Ponto de Esperança** para invocar um pequeno espírito da natureza ou criatura da floresta. Esse familiar fica ao seu lado até seu próximo descanso, até você conjurar Familiar da Natureza novamente ou até que ele seja alvo de um ataque. Ao **gastar 1 Ponto de Esperança adicional**, você pode invocar um familiar voador. Você pode se comunicar com ele, fazer um teste de conjuração para mandá-lo executar tarefas simples e **marcar 1 PF** para enxergar pelos olhos dele.","Ao causar dano a um adversário corpo a corpo ao seu familiar, some **1d6** à rolagem de dano."],"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Projétil Corrosivo","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, cause **d6+4** de dano mágico usando sua Proficiência. Além disso, **marque 2 ou mais Pontos de Fadiga** para deixá-lo permanentemente *Corroído*. Um alvo *Corroído* sofre uma penalidade de –1 na Dificuldade para cada 2 Pontos de Fadiga que você gastou. Essa condição é cumulativa."],"ax":[[{"k":"d","n":1,"die":6,"fl":4,"tp":"mágico","m":"P"}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Tronco Descomunal","t":"Feitiço","l":3,"c":1,"x":["Uma vez por descanso, você pode conjurar um tronco espesso, retorcido e fácil de escalar em um ponto em alcance próximo. A altura dele pode ser equivalente ao alcance distante.","**Marque 1 Ponto de Fadiga** para usar este feitiço como um ataque. Faça um **teste de conjuração** contra um adversário ou grupo de adversários próximo. O tronco irrompe, lançando os alvos no ar e derrubando-os, causando **d8** de dano físico usando sua Proficiência."],"ax":[[{"k":"u","s":"D"}],[{"k":"d","n":1,"die":8,"fl":0,"tp":"físico","m":"P"},{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Campo Curativo","t":"Feitiço","l":4,"c":2,"x":["Uma vez por descanso longo, você pode conjurar um campo de plantas curativas ao seu redor. Toda a área em alcance próximo irrompe em vida e natureza vibrante, permitindo que você e todos os aliados nessa área recuperem 1 Ponto de Vida.","**Gaste 2 Pontos de Esperança** para curar 2 Pontos de Vida em vez de 1."],"ax":[[{"k":"u","s":"L"}],[{"k":"h","n":2}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Constrição Mortal","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo e escolha uma das seguintes opções:","• Você puxa o alvo para um ponto corpo a corpo ou puxa a si mesmo para um ponto corpo a corpo a ele;","• Você constringe o alvo e o força a marcar 2 Pontos de Fadiga;","• Todos os adversários entre você e o alvo devem ter sucesso em um teste de reação (13) ou são atingidos por vinhas e sofrem **3d6+2** de dano fís.","Em um sucesso, vinhas saem de suas mãos, causando o efeito escolhido e *Imobilizando* o alvo temporariamente."],"ax":[[],[],[],[{"k":"d","n":3,"die":6,"fl":2,"tp":"","m":null}],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Fortaleza Selvagem","t":"Feitiço","l":5,"c":1,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, **gaste 2 Pontos de Esperança** para fazer crescer uma barricada natural em formato de domo na qual você e um aliado podem buscar cobertura. Uma criatura dentro do domo não pode atacar nem ser alvo de ataques. Ataques feitos contra o domo acertam automaticamente. O domo tem 3 PV (coloque marcadores nesta carta para representá-los) e tem 15/30 como seus limiares de dano."],"ax":[[{"k":"c","dif":13},{"k":"h","n":2}]],"ef":[],"tk":1},{"d":"Sabedoria","n":"Pele de Espinhos","t":"Feitiço","l":5,"c":1,"x":["Uma vez por descanso, **gaste 1 Ponto de Esperança** para fazer com que espinhos brotem de todo o seu corpo. Ao fazer isso, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Ao sofrer dano, você pode gastar qualquer quantidade de marcadores e rolar um número equivalente de **d6**. Reduza o dano sofrido em um número igual à soma dos resultados. Se estiver corpo a corpo ao atacante, cause a mesma quantidade de dano a ele. Após um descanso, marcadores não utilizados são perdidos."],"ax":[[{"k":"h","n":1},{"k":"u","s":"D"},{"k":"tk","a":"C"}]],"ef":[],"tk":1},{"d":"Sabedoria","n":"Coletor","t":"Talento","l":6,"c":1,"x":["Como um movimento de repouso adicional que você pode escolher, role **1d6** para descobrir o que você coleta. Colabore com o mestre para descrever esse item e adicione-o ao seu inventário como um consumível. Seu grupo pode carregar no máximo cinco consumíveis coletados por vez. 1. Um alimento único (recupera 2 Pontos de Fadiga); 2. Uma bela relíquia (receba 2 Pontos de Esperança); 3. Uma runa arcana (+2 em um teste de conjuração); 4. Um frasco curativo (recupera 2 PV); 5. Um talismã da sorte (role qualquer dado novamente); 6. Escolha uma das opções acima."],"ax":[[{"k":"gh","n":2},{"k":"rd","n":1,"die":6}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Conjurar Montarias","t":"Feitiço","l":6,"c":0,"x":["**Gaste qualquer quantidade de Pontos de Esperança** para conjurar um número equivalente de montarias (como cavalos, camelos ou elefantes) que você e seus aliados podem usar até seu próximo descanso longo ou até que as montarias sofram dano. As montarias dobram sua velocidade de viagem por terra e, quando em perigo, permitem que você se mova para um ponto em alcance distante sem precisar de teste. Criaturas sobre as montarias sofrem uma penalidade de –2 em testes de ataque e ganham +2 de bônus nas rolagens de dano."],"ax":[[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Aspecto Selvagem","t":"Feitiço","l":7,"c":2,"x":["Uma vez por descanso longo, **marque 1 Ponto de Fadiga** para canalizar a natureza ao seu redor e aprimorar a si mesmo. Descreva como sua aparência muda e, em seguida, coloque **1d6** nesta carta, com o 1 virado para cima.","Enquanto o Dado de Aspecto Selvagem estiver ativo, você soma seu valor a todos seus testes. Após somar seu valor a um teste, aumente o valor do dado em 1. Se o valor do dado for ultrapassar 6, ou se você fizer um descanso, essa forma termina e você deve **marcar 1 Ponto de Fadiga adicional**."],"ax":[[{"k":"f","n":1},{"k":"u","s":"L"}],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Dom da Sabedoria","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Sabedoria, receba os seguintes benefícios:","• Enquanto estiver em um ambiente natural, você ganha um bônus de +2 em testes de conjuração;","• Uma vez por descanso, você pode dobrar sua Agilidade ou Instinto ao fazer um teste que use esse atributo. Você deve fazer isso antes de rolar os dados."],"ax":[[],[],[{"k":"u","s":"D"}]],"ef":[{"k":"sp","v":2,"lbl":"Em ambiente natural: +2 em testes de conjuração.","p":0,"cond":"dom","perm":1}],"tk":0},{"d":"Sabedoria","n":"Barreira Revigorante","t":"Feitiço","l":8,"c":1,"x":["Faça um **teste de conjuração (15)**. Uma vez por descanso, em um sucesso, crie uma barreira temporária de energia protetora que fica Muito Próxima de você. Você e todos os aliados que estão dentro da barreira quando este feitiço é conjurado recuperam **1d4** PV. Enquanto a barreira estiver de pé, você e todos os aliados no interior dela têm resistência a dano físico oriundo do lado de fora.","Quando você se move, a barreira se move com você."],"ax":[[{"k":"c","dif":15},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Espíritos da Floresta","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, **gaste qualquer quantidade de Pontos de Esperança** para criar um número equivalente de espíritos da floresta. Todos surgem em pontos à sua escolha em alcance distante e fornecem os seguintes benefícios:","• Seus aliados recebem um bônus de +3 em testes de ataque contra adversários cac a um espírito;","• Se um aliado marcar 1 Ponto de Armadura enquanto estiver cac a um dos espíritos, ele pode marcar 1 Ponto de Armadura adicional.","Após conceder um benefício ou sofrer qualquer dano, um espírito desaparece."],"ax":[[{"k":"c","dif":13}],[],[],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Santuário Selvagem","t":"Talento","l":9,"c":2,"x":["Após um descanso longo, coloque uma quantidade de marcadores nesta carta igual ao número de cartas do domínio da Sabedoria na sua mão e reserva.","Quando fizer um teste de conjuração, você pode gastar qualquer número de marcadores após o teste para receber um bônus de +1 por marcador.","Ao ter sucesso crítico em um teste de conjuração para um feitiço do domínio da Sabedoria, receba um marcador.","Após o próximo descanso longo, marcadores não utilizados são perdidos."],"ax":[[],[],[],[]],"ef":[],"tk":1},{"d":"Esplendor","n":"Raio Luminoso","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, **gaste 1 Ponto de Esperança** para lançar um raio de luz radiante contra ele, causando **d8+2** de dano mágico usando sua Proficiência. O alvo fica temporariamente *Vulnerável* e emite uma luz intensa até se recuperar dessa condição."],"ax":[[{"k":"d","n":1,"die":8,"fl":2,"tp":"mágico","m":"P"},{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Toque Reparador","t":"Feitiço","l":1,"c":1,"x":["Você toca uma criatura e canaliza magia curativa para fechar seus ferimentos. Quando pode passar alguns minutos se concentrando em quem está ajudando, **gaste 2 Pontos de Esperança** para recuperar 1 PV ou PF do alvo.","Uma vez por descanso longo, ao passar esse momento curativo descobrindo algo novo sobre a criatura ou revelando algo sobre si mesmo a ela, você pode fazê-la recuperar 2 Pontos de Vida ou Pontos de Fadiga, em vez de 1."],"ax":[[{"k":"h","n":2},{"k":"gv","n":1}],[{"k":"gv","n":2},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Soberania Vegetal","t":"Feitiço","l":9,"c":1,"x":["Faça um **teste de conjuração (18)**. Uma vez por descanso longo, em um sucesso, você remodela o mundo natural, alterando a flora em qualquer ponto em alcance distante. Por exemplo, você pode fazer árvores brotarem instantaneamente, criar um caminho através de vegetação densa ou erguer uma muralha de raízes."],"ax":[[{"k":"c","dif":18},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Força da Natureza","t":"Feitiço","l":10,"c":2,"x":["**Marque 1 Ponto de Fadiga** para se transformar em um grande espírito da natureza, recebendo os seguintes benefícios:","• Ao ter sucesso em um teste de ataque ou conjuração, receba +10 de bônus na rolagem de dano;","• Ao causar dano suficiente para derrotar uma criatura Próxima, você a absorve e recupera 1 PA;","• Você não pode ser *Imobilizado*.","Antes de fazer um teste, você deve **gastar 1 Ponto de Esperança**. Se não puder fazer isso, volta à forma normal."],"ax":[[{"k":"f","n":1}],[],[],[],[]],"ef":[],"tk":0},{"d":"Sabedoria","n":"Tempestade","t":"Feitiço","l":10,"c":2,"x":["Escolha um dos tipos de tempestade abaixo e faça um **teste de conjuração** contra todos os alvos distantes. Alvos atingidos sofrem os efeitos até o mestre gastar 1 Ponto de Medo no turno dele para encerrar este feitiço.","• *Nevasca*: causa **2d20+8** de dano mágico e deixa os alvos temporariamente *Vulneráveis.*","• *Furacão*: causa **3d10+10** de dano mágico. Escolha uma direção para a qual o vento sopra. Alvos não podem se mover contra o vento.","• *Tempestade de Areia*: cause **5d6+9** de dano mágico.","• Ataques oriundos de um ponto além do alcance corpo a corpo têm desvantagem."],"ax":[[],[{"k":"d","n":2,"die":20,"fl":8,"tp":"mágico","m":null}],[{"k":"d","n":3,"die":10,"fl":10,"tp":"mágico","m":null}],[{"k":"d","n":5,"die":6,"fl":9,"tp":"mágico","m":null}],[]],"ef":[],"tk":0},{"d":"Esplendor","n":"Validação","t":"Talento","l":1,"c":0,"x":["Uma vez por descanso, após o teste de um aliado, mas antes das consequências ocorrerem, você pode auxiliá-lo com palavras de apoio. Ao fazer isso, seu aliado pode rolar os dados novamente."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Mãos Curativas","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração (13)** tendo como alvo uma criatura corpo a corpo que não seja você. Em um sucesso, **marque 1 Ponto de Fadiga** para recuperar 2 Pontos de Vida ou Pontos de Fadiga do alvo. Se falhar, **marque 1 Ponto de Fadiga** para recuperar 1 PV ou PF do alvo. Você não pode curar o mesmo alvo novamente até seu próximo descanso longo."],"ax":[[{"k":"c","dif":13},{"k":"f","n":1},{"k":"gv","n":2},{"k":"gv","n":1}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Últimas Palavras","t":"Feitiço","l":2,"c":1,"x":["Você pode conceder um momento de vida a um cadáver para conversar com ele. Faça um **teste de conjuração (13)**. Em um sucesso com Esperança, o cadáver responde até três perguntas. Em um sucesso com Medo, o cadáver responde uma pergunta. O cadáver responde com sinceridade, mas não pode fornecer informações que desconhecia enquanto estava vivo. Se falhar, ou após o cadáver terminar de responder às suas perguntas, ele se desfaz em pó."],"ax":[[{"k":"c","dif":13}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Novo Fôlego","t":"Talento","l":3,"c":2,"x":["Uma vez por descanso, ao acertar um ataque contra um adversário, você pode recuperar 1 Ponto de Vida ou 3 Pontos de Fadiga. Em um sucesso com Esperança, você também recupera 1 PV ou 3 PF de um aliado próximo."],"ax":[[{"k":"gv","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Voz da Razão","t":"Talento","l":3,"c":1,"x":["Você fala com poder e autoridade sem igual. Você tem vantagem em testes para acalmar situações violentas ou convencer alguém a seguir sua ordem. Além disso, você demonstra mais firmeza sob pressão. Quando todos seus Pontos de Fadiga estiverem marcados, você ganha um bônus de +1 na Proficiência para rolagens de dano."],"ax":[[]],"ef":[{"k":"pr","v":1,"lbl":"Quando todos seus Pontos de Fadiga estiverem marcados, você ganha um bônus de +1 na Proficiência para rolagens de dano.","p":0}],"tk":0},{"d":"Esplendor","n":"Adivinhação","t":"Feitiço","l":4,"c":1,"x":["Uma vez por descanso longo, **gaste 3 Pontos de Esperança** para se comunicar com as forças do além e fazer uma única pergunta sobre algum evento, lugar, pessoa ou situação no futuro próximo que possa ser respondida com “sim” ou “não”. O tempo presente desaparece por um momento e a resposta surge magicamente diante de você."],"ax":[[{"k":"h","n":3},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Sigilo da Vida","t":"Feitiço","l":4,"c":1,"x":["**Gaste 3 Pontos de Esperança** e escolha um aliado próximo. Ele é marcado por um brilhante sigilo de proteção. Quando esse aliado for fazer um movimento de morte, ele recupera 1 PV em vez disso.","Este efeito termina quando salva o alvo de um movimento de morte, quando você conjura Sigilo da Vida sobre outro alvo ou quando faz um descanso longo."],"ax":[[{"k":"h","n":3}],[]],"ef":[],"tk":0},{"d":"Esplendor","n":"Moldar Material","t":"Feitiço","l":5,"c":1,"x":["**Gaste 1 Ponto de Esperança** para moldar parte de um material natural que esteja tocando (como gelo, madeira ou pedra) à sua vontade. A área do material não pode ser maior que você. Por exemplo, você pode criar uma ferramenta rudimentar ou criar uma porta.","Você só pode afetar o material próximo do ponto que você está tocando."],"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Esplendor","n":"Punição","t":"Feitiço","l":5,"c":2,"x":["Uma vez por descanso, **gaste 3 Pontos de Esperança** para carregar sua Punição. Ao acertar seu próximo ataque com uma arma, dobre o resultado da rolagem de dano. Independentemente do tipo de dano da arma, este ataque causa dano mágico."],"ax":[[{"k":"h","n":3},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Restauração","t":"Feitiço","l":6,"c":2,"x":["Após um descanso longo, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Toque uma criatura e gaste qualquer quantidade de marcadores. Para cada marcador gasto, recupere 2 Pontos de Vida ou Pontos de Fadiga do alvo. Você também pode gastar um marcador desta carta para tocar uma criatura e recuperá-la da condição *Vulnerável* ou curar uma doença física ou mágica (o mestre pode exigir o gasto de mais marcadores, dependendo da potência da doença).","Após um descanso longo, marcadores não utilizados são perdidos."],"ax":[[{"k":"gv","n":2},{"k":"tk","a":"C"}],[]],"ef":[],"tk":1},{"d":"Esplendor","n":"Zona de Proteção","t":"Feitiço","l":6,"c":2,"x":["Faça um **teste de conjuração (16)**. Uma vez por descanso longo, em um sucesso, escolha um ponto em alcance distante e crie uma zona de proteção visível para todos os aliados muito próximos do ponto de origem. Ao fazer isso, coloque **1d6** nesta carta, com o 1 virado para cima. Quando um aliado na zona de proteção sofre dano, reduza esse dano pelo valor do dado. Em seguida, aumente o valor do dado em um. Se o valor do dado for ultrapassar 6, este efeito termina."],"ax":[[{"k":"c","dif":16},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Dom do Esplendor","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Esplendor, receba os seguintes benefícios:","• Um bônus de +3 no seu limiar de dano grave;","• Uma vez por descanso longo, quando o dano sofrido exigir que marque PV, você pode, em vez disso, marcar uma quantidade equivalente de PF ou gastar uma quantidade equivalente de Esperança."],"ax":[[],[],[{"k":"u","s":"L"}]],"ef":[{"k":"tg","v":3,"lbl":"Um bônus de +3 no seu limiar de dano grave;","p":1,"cond":"dom","perm":1}],"tk":0},{"d":"Esplendor","n":"Golpe Curativo","t":"Feitiço","l":7,"c":1,"x":["Ao causar dano a um adversário, você pode **gastar 2 Pontos de Esperança** para recuperar 1 PV de um aliado próximo."],"ax":[[{"k":"gv","n":1}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Aura Defensora","t":"Feitiço","l":8,"c":2,"x":["**Marque 1 Ponto de Fadiga** para conjurar uma aura protetora sobre um alvo muito próximo. Quando o alvo marca 1 Ponto de Armadura, ele reduz a gravidade do ataque em um limiar adicional. Se este feitiço fizer uma criatura que sofreria dano não marcar Pontos de Vida, o efeito termina. Você pode manter a Aura Defensora apenas sobre uma criatura por vez."],"ax":[[{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Fulgor Atordoante","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração** para disparar raios solares contra todos os adversários distantes à sua frente. Em um sucesso, **gaste qualquer quantidade de Pontos de Esperança** e force um número equivalente de alvos atingidos a fazer um teste de reação (14).","Alvos bem-sucedidos sofrem **3d20+3** de dano mágico. Alvos que falharem sofrem **4d20+5** de dano mágico e ficam temporariamente *Atordoados*. Enquanto estiverem *Atordoados*, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem dessa condição."],"ax":[[],[{"k":"d","n":3,"die":20,"fl":3,"tp":"mágico","m":null},{"k":"d","n":4,"die":20,"fl":5,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Aura Esmagadora","t":"Feitiço","l":9,"c":2,"x":["Faça um **teste de conjuração (15)** para fortalecer sua aura com magia. Em um sucesso, **gaste 2 Pontos de Esperança** para tornar sua Presença igual ao seu atributo de conjuração até seu próximo descanso longo.","Enquanto este feitiço estiver ativo, seus adversários devem marcar 1 Ponto de Fadiga ao selecionarem você como alvo de um ataque."],"ax":[[{"k":"c","dif":15},{"k":"h","n":2}],[]],"ef":[],"tk":0},{"d":"Valor","n":"Armadura Corporal","t":"Talento","l":1,"c":0,"x":["Enquanto não equipar uma armadura, você tem Armadura base igual a 3 + sua Força e usa estes limiares de dano base:","• *1º patamar*: 9/19;","• *2º patamar*: 11/24;","• *3º patamar*: 13/31;","• *4º patamar*: 15/38."],"ax":[[],[],[],[],[]],"ef":[{"k":"abody","v":1,"lbl":"Sem armadura equipada: Armadura base 3 + Força e limiares base por patamar (9/19, 11/24, 13/31, 15/38).","p":0,"perm":1}],"tk":0},{"d":"Valor","n":"Imposição","t":"Talento","l":1,"c":0,"x":["Ataque um alvo corpo a corpo com sua arma principal. Em um sucesso, você causa dano e o empurra para um ponto em alcance próximo. Em um sucesso com Esperança, acrescente **1 d6** à rolagem de dano.","Além disso, **gaste 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável*"],"ax":[[],[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Valor","n":"Sou Seu Escudo","t":"Talento","l":1,"c":1,"x":["Quando um aliado muito próximo for sofrer dano, você pode **marcar 1 Ponto de Fadiga** para prostrar-se no caminho e virar o alvo do ataque no lugar dele. Ao sofrer dano desse ataque, você pode marcar um número qualquer de Pontos de Armadura."],"ax":[[]],"ef":[],"tk":0},{"d":"Esplendor","n":"Feixe de Remissão","t":"Feitiço","l":9,"c":2,"x":["Faça um **teste de conjuração (16)**. Em um sucesso, **marque uma quantidade qualquer de PF** para escolher uma linha de aliados em alcance distante como alvo. Você pode recuperar um número de Pontos de Vida, divididos como você quiser entre os alvos, igual à quantidade de PF que marcou."],"ax":[[{"k":"c","dif":16}]],"ef":[],"tk":0},{"d":"Esplendor","n":"Ressurreição","t":"Feitiço","l":10,"c":2,"x":["Faça um **teste de conjuração (20)**. Em um sucesso, faça com que uma criatura morta há no máximo 100 anos volte à vida com todas as suas capacidades. Em seguida, role **1d6**. Se tirar 5 ou menos, coloque esta carta na reserva permanentemente.","Se falhar, você não pode conjurar Ressurreição novamente por uma semana."],"ax":[[{"k":"c","dif":20},{"k":"rd","n":1,"die":6}],[]],"ef":[],"tk":0},{"d":"Esplendor","n":"Revigorar","t":"Feitiço","l":10,"c":3,"x":["Após você ou um aliado próximo usar uma habilidade com limite de uso (como uma vez por descanso ou uma vez por sessão), você pode **gastar uma quantidade qualquer de Pontos de Esperança** e rolar um número equivalente de **d6**. Se tirar 6 em qualquer dado, a habilidade pode ser usada novamente."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Valor","n":"Força Esmagadora","t":"Talento","l":2,"c":1,"x":["Você usa toda sua força física em um combate. Ao acertar um ataque usando uma arma com alcance corpo a corpo, receba um bônus igual à sua Força na rolagem de dano."],"ax":[[]],"ef":[{"k":"dmM","v":1,"lbl":"Ataque com arma corpo a corpo: bônus igual à Força na rolagem de dano.","p":0,"perm":1,"f":"at:1"}],"tk":0},{"d":"Valor","n":"Presença Corajosa","t":"Talento","l":2,"c":0,"x":["Ao fazer um teste de Presença, você pode **gastar 1 Ponto de Esperança** para somar sua Força à rolagem. Além disso, uma vez por descanso, quando for sofrer uma condição, você pode descrever como sua Presença. Corajosa ajuda na situação e impede que você sofra a condição."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Valor","n":"Inspiração Crítica","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso, quando você obtém um sucesso crítico em um ataque, todos os aliados muito próximos podem recuperar 1 PF ou receber 1 Ponto de Esperança."],"ax":[[{"k":"gs","n":1},{"k":"gh","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Valor","n":"Palavras de Conforto","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso longo, quando você consola ou inspira um aliado que falhou em um teste, vocês dois podem recuperar 2 Pontos de Fadiga cada."],"ax":[[{"k":"gs","n":2},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Valor","n":"Bastião","t":"Talento","l":4,"c":2,"x":["Quando um aliado próximo falhar em um teste, você pode **gastar 2 Pontos de Esperança** para permitir que ele role novamente o Dado de Medo ou de Esperança."],"ax":[[]],"ef":[],"tk":0},{"d":"Valor","n":"Incitar","t":"Talento","l":4,"c":1,"x":["Descreva como você provoca um alvo próximo. Em seguida, faça um **teste de Presença** contra ele. Em um sucesso, o alvo deve marcar 1 PF e, na próxima vez que o mestre colocá-lo em foco, ele deve atacar você com desvantagem."],"ax":[[]],"ef":[],"tk":0},{"d":"Valor","n":"Armeiro","t":"Talento","l":5,"c":1,"x":["Você recebe um bônus de +1 na Armadura enquanto estiver usando armadura. Ao escolher Reparar Armadura como movimento de repouso durante um descanso, seus aliados também recuperam 1 Ponto de Armadura."],"ax":[[]],"ef":[{"k":"pa","v":1,"lbl":"+1 na Armadura enquanto estiver usando armadura.","p":0,"perm":1,"cond":"armor"}],"tk":0},{"d":"Valor","n":"Golpe Inspirador","t":"Talento","l":5,"c":1,"x":["Uma vez por descanso, ao ter sucesso crítico em um ataque, você e todos os aliados que possam vê-lo ou ouvi-lo podem recuperar 1 Ponto de Vida ou **1d4** Pontos de Fadiga."],"ax":[[{"k":"gv","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Valor","n":"Altivez","t":"Talento","l":6,"c":2,"x":["Receba um bônus igual à sua Proficiência no seu limiar grave. Ao marcar 1 ou mais PV devido a um ataque, recupere 1 Ponto de Fadiga."],"ax":[[{"k":"gs","n":1}]],"ef":[{"k":"tg","v":1,"lbl":"Bônus igual à sua Proficiência no limiar de dano grave.","p":0,"perm":1,"f":"pr"}],"tk":0},{"d":"Valor","n":"Inevitável","t":"Talento","l":6,"c":1,"x":["Ao falhar em um teste, seu próximo teste é feito com vantagem."],"ax":[[]],"ef":[],"tk":0},{"d":"Valor","n":"Desprezar Fraqueza","t":"Talento","l":7,"c":1,"x":["Quando sofrer dano, você pode **marcar 1 Ponto de Fadiga** para reduzir a gravidade do dano em um limiar. Ao fazer isso, role **1d6**. Se tirar 3 ou menos, coloque esta carta na reserva."],"ax":[[{"k":"rd","n":1,"die":6}]],"ef":[],"tk":0},{"d":"Valor","n":"Dom do Valor","t":"Talento","l":7,"c":1,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Valor, receba os seguintes benefícios:","• Bônus de +1 na Armadura;","• Ao marcar 1 ou mais Pontos de Vida sem marcar Pontos de Armadura, recupere 1 PA."],"ax":[[],[],[{"k":"ga","n":1}]],"ef":[{"k":"pa","v":1,"lbl":"Com 4+ cartas do Valor equipadas: +1 na Armadura.","p":0,"perm":1,"cond":"dom"}],"tk":0},{"d":"Valor","n":"Abalo Sísmico","t":"Talento","l":8,"c":2,"x":["**Gaste 2 Pontos de Esperança** para golpear o solo abaixo de você. Faça um **teste de Força** contra todos os alvos próximos. Alvos atingidos são empurrados para um ponto em alcance distante e devem fazer um teste de reação (17). Quem falhar, sofre **4d10+8** de dano. Quem passar sofre metade do dano."],"ax":[[{"k":"d","n":4,"die":10,"fl":8,"tp":"","m":null},{"k":"h","n":2}]],"ef":[],"tk":0},{"d":"Valor","n":"Testar os Limites","t":"Talento","l":8,"c":1,"x":["Uma vez por descanso longo, **marque 3 Pontos de Fadiga** para testar os limites de seu corpo. Você recebe um bônus de +2 em todos os atributos até seu próximo descanso."],"ax":[[{"k":"f","n":3,"on":[0]},{"k":"u","s":"L"}]],"ef":[{"k":"atall","v":2,"lbl":"+2 em todos os atributos até o próximo descanso.","p":0,"rst":1}],"tk":0},{"d":"Valor","n":"Líder Exemplar","t":"Talento","l":9,"c":3,"x":["Ao causar dano a um adversário, você pode **marcar 1 PF** e descrever como encoraja seus aliados. O próximo personagem que atacar esse adversário pode recuperar 1 Ponto de Fadiga ou receber 1 Ponto de Esperança."],"ax":[[{"k":"gs","n":1},{"k":"gh","n":1}]],"ef":[],"tk":0},{"d":"Valor","n":"Manter Posição","t":"Talento","l":9,"c":1,"x":["Descreva a posição defensiva que você assume e **gaste 1 Ponto de Esperança**. Se um adversário se mover para alcance muito próximo, ele é puxado para o alcance corpo a corpo e fica *Imobilizado*.","Esta condição dura até você se mover ou rolar uma falha com Medo, ou até o mestre gastar 2 Pontos de Medo no turno dele para encerrá-la."],"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Valor","n":"Defesa Irredutível","t":"Talento","l":10,"c":1,"x":["Quando for marcar 1 Ponto de Armadura, role uma quantidade de **d6** igual à sua Proficiência. Se algum tirar 6, reduza a gravidade em um limiar sem marcar 1 Ponto de Armadura."],"ax":[[{"k":"rd","die":6,"m":"P"}]],"ef":[],"tk":0},{"d":"Valor","n":"Invencível","t":"Talento","l":10,"c":4,"x":["Ao marcar seu último Ponto de Vida, em vez de fazer um movimento de morte, você pode recuperar **1d6** Pontos de Vida. Em seguida, esta carta vai para sua reserva."],"ax":[[]],"ef":[],"tk":0},{"d":"Sangue","n":"Espeto de Sangue","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo em alcance próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para causar **d8+2** de dano mágico usando sua Proficiência ao alvo, e o alvo marca 1 Ponto de Fadiga. Se você tiver pelo menos 3 Pontos de Vida marcados, o dado de dano é um **d10**."],"void":1,"ax":[[{"k":"d","n":1,"die":8,"fl":2,"tp":"mágico","m":"P"},{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Sangue","n":"Talismã Vital","t":"Feitiço","l":1,"c":0,"x":["**Marque 1 Ponto de Vida** para conjurar um talismã imbuído com sua essência vital. Quando o portador do talismã sofrer dano grave ou superior, ele pode destruir o talismã e reduzir a gravidade do dano em dois limiares. Caso contrário, o talismã desaparece quando você fizer um descanso ou conjurar este feitiço novamente."],"void":1,"ax":[[{"k":"mv","n":1}]],"ef":[],"tk":0},{"d":"Sangue","n":"Poder pela Dor","t":"Talento","l":1,"c":1,"x":["Quando você marcar 1 Ponto de Vida, coloque um marcador nesta carta. Em um ataque bem-sucedido, você pode gastar qualquer quantidade de marcadores desta carta para receber um bônus de **1d6** de dano no ataque para cada marcador gasto. Esta carta pode conter no máximo um número de marcadores igual ao seu atributo de conjuração. Remova todos os marcadores desta carta quando fizer um descanso longo."],"void":1,"ax":[[]],"ef":[],"tk":1},{"d":"Sangue","n":"Marca do Castigo","t":"Feitiço","l":2,"c":1,"x":["Quando você for bem-sucedido em um teste de ataque contra um alvo, você pode **marcar 1 Ponto de Fadiga** para *Estigmatizá-lo* até fazer um descanso longo ou conjurar este feitiço novamente. Você sempre sabe a direção do alvo *Estigmatizado*. Se o alvo *Estigmatizado* causar dano a você, você pode remover a condição *Estigmatizado* para fazê-lo marcar 2 Pontos de Fadiga."],"void":1,"ax":[[]],"ef":[],"tk":0},{"d":"Sangue","n":"Palpitações","t":"Feitiço","l":2,"c":2,"x":["Quando você ou um aliado fizer um teste de ação para assustar ou intimidar uma criatura em alcance próximo, você pode **gastar 1 Ponto de Esperança** para dar vantagem ao teste. Em um sucesso, o alvo marca 1 Ponto de Fadiga.","Além disso, uma vez por descanso longo, você pode **gastar 1 Ponto de Esperança** para acalmar a si mesmo ou uma criatura voluntária em alcance próximo, fazendo o alvo limpar 2 Pontos de Fadiga."],"void":1,"ax":[[],[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Sangue","n":"Marionete de Sangue","t":"Feitiço","l":3,"c":2,"x":["Faça um **teste de conjuração** contra um adversário em alcance próximo. Em um sucesso, gaste 1 Ponto de Esperança para fazer qualquer uma das seguintes ações, na ordem que escolher:","• Você move o alvo até alcance próximo de sua posição atual. Para mover o alvo para um terreno perigoso, você deve gastar mais 1 Ponto de Esperança.","• O alvo faz um ataque padrão contra outro alvo à sua escolha dentro do alcance do ataque."],"void":1,"ax":[[{"k":"h","n":1}],[],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Sangue Ardente","t":"Feitiço","l":3,"c":3,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, **marque 1 Ponto de Vida** para inflamar o sangue vital de um grupo em alcance distante, fazendo cada alvo marcar 1 Ponto de Vida. Se você tiver pelo menos 3 Pontos de Vida marcados, cada alvo marca 2 Pontos de Vida."],"void":1,"ax":[[{"k":"c","dif":13},{"k":"mv","n":1}]],"ef":[],"tk":0},{"d":"Sangue","n":"Arpão Macabro","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração** contra uma criatura em alcance distante. Em um sucesso, **marque 1 Ponto de Fadiga** para arremessar no alvo um arpão conjurado de sangue mágico, causando **d10** de dano mágico usando sua Proficiência. Então você pode puxar a si mesmo até alcance corpo a corpo do alvo ou puxar o alvo até alcance corpo a corpo de você.","Como alternativa, se você escolher como alvo um objeto solto ou um terreno em alcance distante, faça um **teste de conjuração (13)**. Em um sucesso, você puxa o objeto até você ou se puxa até o terreno."],"void":1,"ax":[[{"k":"d","n":1,"die":10,"fl":0,"tp":"mágico","m":"P"},{"k":"f","n":1}],[{"k":"c","dif":13}]],"ef":[],"tk":0},{"d":"Sangue","n":"Tecer a Carne","t":"Feitiço","l":4,"c":1,"x":["Uma vez por descanso longo, você pode **marcar 1 Ponto de Vida** para estancar, suturar e fortalecer outros com o seu próprio sangue vital. Cada alvo voluntário em alcance muito próximo limpa 1 Ponto de Vida e 1 Ponto de Armadura."],"void":1,"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Sangue","n":"Forma Viscosa","t":"Feitiço","l":5,"c":1,"x":["**Marque 1 Ponto de Fadiga** para colocar nesta carta um número de marcadores igual ao seu atributo de conjuração e se transformar em uma poça de sangue. Remova um marcador cada vez que fizer um teste de ação ou sofrer dano. Você sai desta forma quando remover o último marcador desta carta. Enquanto estiver na forma de sangue, você tem resistência a dano físico e pode deslizar por qualquer espaço que um líquido possa atravessar."],"void":1,"ax":[[{"k":"f","n":1}]],"ef":[],"tk":1},{"d":"Sangue","n":"Parasita da Vontade","t":"Feitiço","l":5,"c":2,"x":["Faça um **teste de conjuração** contra um adversário em alcance próximo. Uma vez por descanso, em um sucesso, **marque 1 Ponto de Vida** para *Infectar* o alvo com um minúsculo verme de sangue mágico.","Testes de Presença contra o alvo *Infectado* têm vantagem. Quando o alvo *Infectado* fizer um teste de ataque, você pode **gastar 1 Ponto de Esperança** para dar desvantagem ao teste. A condição *Infectado* dura até você fazer um descanso ou sacrificar o verme de sangue para fazer o alvo *Infectado* marcar 1 Ponto de Vida."],"void":1,"ax":[[{"k":"mv","n":1},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Laço de Sangue","t":"Feitiço","l":6,"c":1,"x":["Faça um **teste de conjuração** contra um adversário em alcance próximo. Em um sucesso, **marque 1 Ponto de Fadiga** para retardar a vitalidade do alvo. O alvo fica temporariamente *Imobilizado* e *Vulnerável*.","Cada vez que o alvo estiver em foco enquanto qualquer uma dessas condições persistir, ele marca 1 Ponto de Fadiga."],"void":1,"ax":[[{"k":"f","n":1}],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Elo Vital","t":"Feitiço","l":6,"c":0,"x":["Faça um **teste de conjuração (14)**. Uma vez por descanso, em um sucesso, você conjura um elo mágico entre você e um alvo voluntário em alcance próximo, que dura até o fim da cena.","Quando qualquer uma das criaturas ligadas for marcar 1 Ponto de Vida, a outra criatura ligada pode marcar 1 Ponto de Vida no lugar."],"void":1,"ax":[[{"k":"c","dif":14},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Tocado pelo Sangue","t":"Talento","l":7,"c":2,"x":["Enquanto 4 ou mais das cartas de domínio em sua mão forem do domínio Sangue, receba os seguintes benefícios:","• Você ganha 1 Ponto de Esperança quando sofrer dano maior ou superior.","• Quando fizer um teste de conjuração, você pode gastar 1 Ponto de Esperança para receber um bônus igual ao número de Pontos de Vida que você tem marcados."],"void":1,"ax":[[],[],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Golpe Vampírico","t":"Talento","l":7,"c":2,"x":["Quando você causar dano maior ou superior a um adversário em alcance próximo, você pode **marcar 1 Ponto de Fadiga** para limpar 1 Ponto de Vida."],"void":1,"ax":[[]],"ef":[],"tk":0},{"d":"Sangue","n":"Proteção Vital","t":"Feitiço","l":8,"c":1,"x":["Escolha o tipo de dano físico ou mágico e faça um **teste de conjuração (15)**. Em um sucesso, você traça no chão, ao seu redor, um círculo de sangue em alcance muito próximo que concede às criaturas de sua escolha dentro dele resistência àquele tipo de dano.","O círculo dura até você sofrer dano maior ou superior, sair do círculo ou conjurar este feitiço novamente."],"void":1,"ax":[[{"k":"c","dif":15}],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Árvore Sangrenta","t":"Feitiço","l":8,"c":2,"x":["Uma vez por descanso longo, quando um adversário em alcance próximo for derrotado, você pode fazer o corpo dele irromper em uma árvore retorcida e cheia de veias que escorre força vital. Coloque nesta carta um número de marcadores igual ao seu atributo de conjuração.","Um PJ em alcance corpo a corpo da árvore pode gastar um marcador desta carta para sugar força vital da árvore e limpar 1 Ponto de Vida."],"void":1,"ax":[[{"k":"u","s":"L"}],[]],"ef":[],"tk":1},{"d":"Sangue","n":"Onda de Icor","t":"Feitiço","l":9,"c":3,"x":["**Marque 1 Ponto de Vida** para fazer um **teste de conjuração** contra todos os alvos em alcance próximo à sua frente. Em um sucesso, cause **d10** de dano mágico usando o número de Pontos de Vida que você tem marcados no lugar de sua Proficiência. Em uma falha, cause metade do dano."],"void":1,"ax":[[{"k":"d","n":1,"die":10,"fl":0,"tp":"mágico","m":null},{"k":"mv","n":1}]],"ef":[],"tk":0},{"d":"Sangue","n":"Glifo da Hemorragia","t":"Feitiço","l":9,"c":3,"x":["Faça um **teste de conjuração** contra um alvo em alcance próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para marcar o alvo com um glifo mágico que o faz sangrar profusamente. Até o glifo se dissipar, o dano que o alvo sofre aumenta em um limiar.","O glifo se dissipa quando você fizer um descanso, conjurar este feitiço novamente ou o alvo sofrer dano grave ou superior."],"void":1,"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Sangue","n":"Crostas de Adamante","t":"Talento","l":10,"c":1,"x":["Suas feridas se selam em crostas blindadas. Quando você marcar 2 ou mais Pontos de Vida por causa de um ataque, limpe 1 Ponto de Armadura."],"void":1,"ax":[[{"k":"ga","n":1}]],"ef":[],"tk":0},{"d":"Sangue","n":"Banquete Sanguíneo","t":"Feitiço","l":10,"c":2,"x":["Faça um **teste de conjuração** contra um adversário em alcance próximo. Uma vez por descanso, em um sucesso, role um número de **d6** igual ao número de Pontos de Vida que você tem marcados, e você pode marcar 1 Ponto de Vida adicional para rolar novamente qualquer quantidade desses dados. O alvo marca 1 Ponto de Vida para cada resultado 4 ou superior."],"void":1,"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0}],"subs":{"Assassino":[{"n":"Membro dos Executores","desc":"*Seja um membro dos executores para derrubar seus alvos* *com precisão letal.*","a":[{"h":"Atributo de Conjuração","p":["Agilidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Emboscada:* sua “Marca da Morte” usa **d6** em vez de d4.","*Primeiro Golpe:* quando acertar um ataque pela primeira vez na cena, você causa o dobro de dano."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Evasão do Escorpião:* você recebe um bônus de +2 na Evasão contra ataques feitos por uma criatura *Marcada de* *Morte*.","*Golpe Mortal:* ao causar dano grave a uma criatura, você pode **marcar 1 PF** para fazê-la marcar 1 Ponto de Vida adicional."],"ax":[[],[]],"ef":[{"k":"ev","v":2,"lbl":"Evasão do Escorpião: você recebe um bônus de +2 na Evasão contra ataques feitos por uma criatura Marcada de Morte.","p":0}],"tk":0},{"h":"Habilidades de Maestria","p":["*Apunhalar:* sua “Marca da Morte” usa **d8** em vez de d6.","*Golpe Certeiro:* uma vez por descanso longo, ao falhar em um ataque, você pode **gastar 1 Ponto de Esperança** para transformar o ataque em um sucesso."],"ax":[[],[{"k":"u","s":"L"}]],"ef":[],"tk":0}]},{"n":"Membro dos Veneficistas","desc":"*Seja um membro dos veneficistas para debilitar seus alvos* *com venenos punitivos.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Compostos Tóxicos:* **marque 1 PF** para colocar **1d4+1** marcadores nesta carta. Quando acertar um ataque armado, você pode gastar um marcador para envenenar o alvo. Você conhece os seguintes venenos:","• *Erva Sanguessuga:* você causa **1d6** pontos de dano adicional neste ataque.","• *Esporos de Cemitério:* o alvo também marca 1 PF.","• *Pétala Espectral:* o alvo fica temporariamente *Vulnerável*.","No seu próximo descanso longo, marcadores não utilizados são perdidos."],"ax":[[{"k":"f","n":1}],[{"k":"d","n":1,"die":6,"fl":0,"tp":"","m":null}],[],[],[]],"ef":[],"tk":1},{"h":"Habilidades de Especialização","p":["*Compêndio de Venenos:* você passa a conhecer estes venenos:","• *Raiz-górgona:* o alvo fica temporariamente *Imobilizado*.","• *Vinha da Meia-noite:* o alvo sofre desvantagem em testes de ataque até que ele marque 1 PF para se recuperar deste veneno.","*Peçonha Dupla:* ao usar um veneno que você conhece em um alvo *Marcado de Morte*, você pode gastar um marcador adicional para envenenar o alvo com o efeito de um segundo veneno que você conheça."],"ax":[[],[],[{"k":"f","n":1}],[]],"ef":[],"tk":1},{"h":"Habilidades de Maestria","p":["*Bênção da Víbora:* você é imune a venenos e outras toxinas.","*Venomante:* você passa a conhecer estes venenos:","• *Espinha de Cadáver:* o alvo sofre desvantagem em testes de reação até o fim da cena.","• *Folha do Medo:* você causa dano adicional igual ao resultado do seu dado de Medo neste ataque.","• *Semente da Praga:* o alvo sofre –3 em seus limiares de dano até o fim da cena. Este efeito não é cumulativo."],"ax":[[],[],[],[],[]],"ef":[],"tk":0}]}],"Bardo":[{"n":"Beletrista","desc":"*Seja um beletrista para cativar multidões com as palavras.*","a":[{"h":"Atributo de Conjuração","p":["Presença"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Discurso Inspirador:* uma vez por descanso longo, você pode fazer um discurso emocionante e inspirador. Todos os aliados até o alcance distante recuperam 2 Pontos de Fadiga.","*Alma de Poeta:* após fazer um teste para impressionar, persuadir ou ofender alguém, você pode **gastar 1 Ponto de Esperança** para somar **1d4** à rolagem."],"ax":[[{"k":"u","s":"L"}],[]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Eloquente:* suas palavras comoventes elevam o moral. Uma vez por sessão, ao encorajar um aliado, você pode fazer um dos seguintes:","• Ajudá-lo sem gastar Esperança;","• Dar um movimento de repouso adicional para ele usar em seu próximo descanso;","• Permitir que ele encontre uma ferramenta ou objeto mundano de que necessite."],"ax":[[{"k":"u","s":"L"}],[],[],[]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Poesia Épica:* seu Dado de Inspiração aumenta para **d10**. Além disso, ao prestar ajuda, você pode descrever o momento como se estivesse contando o heroísmo dele em uma história. Ao fazer isso, role **1d10** como seu dado de vantagem."],"ax":[[{"k":"rd","n":1,"die":10}]],"ef":[],"tk":0}]},{"n":"Trovador","desc":"*Seja um trovador para tecer canções que fortalecem seus* *aliados.*","a":[{"h":"Atributo de Conjuração","p":["Presença"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Artista Talentoso:* descreva como você se apresenta para as pessoas. Você pode cantar ou tocar cada canção uma vez por descanso longo:","• *Canção Comovente:* você e todos os aliados próximos recebem 1 Ponto de Esperança.","• *Canção Épica:* deixe um alvo próximo temporariamente *Vulnerável*.","• *Canção Relaxante:* você e todos os aliados próximos recuperam 1 Ponto de Vida."],"ax":[[{"k":"u","s":"L"}],[],[],[]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Maestro:* suas canções inspiram coragem naqueles que as ouvem. Ao conceder um Dado de Inspiração a um aliado, ele pode receber 1 Ponto de Esperança ou recuperar 1 PF."],"ax":[[{"k":"gs","n":1},{"k":"gh","n":1}]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Virtuoso:* você está entre os maiores de sua arte e sua perícia não tem precedentes. Cada canção de Artista Talentoso pode ser apresentada duas vezes por descanso longo, em vez de uma."],"ax":[[]],"ef":[],"tk":0}]}],"Lutador":[{"n":"Artista Marcial","desc":"*Seja um artista marcial para usar uma variedade de estilos de* *luta ao eliminar seus inimigos.*","a":[{"h":"Habilidade Fundamental","p":["*Postura Marcial:* você é capaz de canalizar sua determinação interior para assumir posturas marciais que lhe concedem benefícios especiais em combate.","Escolha duas posturas de 1º patamar na ficha de Posturas Marciais (pp. 15 e 183). Sempre que você subir de nível, escolha uma postura adicional de patamar igual ou inferior ao seu."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Canhão Concentrado:* **gaste 1 Ponto de Concentração** para fazer um teste de Instinto contra um adversário distante. Se atingi-lo, cause **d20+3** pontos de dano mágico com sua Proficiência.","*Defesa Apurada:* quando for alvo de um ataque, você pode **gastar 1 Ponto de Concentração** para aumentar sua Evasão contra esse ataque em um valor igual ao seu patamar."],"ax":[[{"k":"d","n":1,"die":20,"fl":3,"tp":"mágico","m":"P"}],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Estado de Fluxo:* você pode **marcar 1 PF**, em vez de gastar 1 Ponto de Concentração, para mudar sua Postura Marcial. Além disso, você pode **gastar 1 Ponto de Concentração**, em vez de marcar 1 PF, para iniciar uma Sequência de Golpes.","*Superar Limites:* uma vez por descanso, você pode realizar uma façanha atlética inacreditável, como correr sobre a água, saltar entre telhados distantes ou escalar um prédio, sem precisar fazer testes. Se fizer isso, você recebe 1 Ponto de Esperança e recupera 1 Ponto de Fadiga."],"ax":[[],[{"k":"gh","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0}]},{"n":"Esmagador","desc":"*Seja um esmagador para pulverizar seus oponentes com* *golpes devastadores.*","a":[{"h":"Habilidades Fundamentais","p":["*Durão:* você recebe um bônus permanente de +3 em seu limiar de dano grave.","*Sobrecarga:* ao acertar um ataque, você pode **gastar 1 Ponto de Esperança** para ou fazer o alvo marcar 1 Ponto de Fadiga ou arremessá-lo para um ponto em alcance próximo."],"ax":[[],[]],"ef":[{"k":"tg","v":3,"lbl":"Durão: você recebe um bônus permanente de +3 em seu limiar de dano grave.","p":0,"perm":1}],"tk":0},{"h":"Habilidades de Especialização","p":["*Cercado:* quando fizer um ataque armado em alcance corpo a corpo, você pode **gastar uma quantidade qualquer de Pontos de Esperança** para atingir um número de criaturas adicionais em alcance corpo a corpo equivalente aos pontos gastos.","*Olho por Olho:* uma vez por descanso, quando um adversário em alcance corpo a corpo fizer você marcar Pontos de Vida, você pode **marcar 1 Ponto de Fadiga** para forçá-lo a marcar a mesma quantidade de PV que você marcou."],"ax":[[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Ainda Não Terminei:* quando sofre dano grave, você recebe 1 Ponto de Esperança ou recupera 1 Ponto de Fadiga.","*Júbilo do Combate:* quando rolar um sucesso crítico em um teste de ataque armado em alcance corpo a corpo, você recebe 1 Ponto de Esperança adicional, recupera 1 PF adicional e recebe um bônus de +1 na Proficiência para a rolagem de dano deste ataque."],"ax":[[{"k":"gh","n":1}],[{"k":"gh","n":1}]],"ef":[{"k":"pr","v":1,"lbl":"Júbilo do Combate: quando rolar um sucesso crítico em um teste de ataque armado em alcance corpo a corpo, você recebe 1 Ponto de Esperança adicional, ","p":1}],"tk":0}]}],"Druida":[{"n":"Protetor dos Elementos","desc":"*Seja um protetor dos elementos para incorporar as forças* *primordiais da natureza.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["• *Encarnação Elemental:* **marque 1 Ponto de Fadiga** para *Canalizar* um dos seguintes elementos até sofrer dano grave ou até seu próximo descanso:","*Água:* quando você causa dano a um adversário corpo a corpo, todos os outros adversários muito próximos devem marcar 1 Ponto de Fadiga.","*Ar:* você pode pairar para receber vantagem em testes de Agilidade.","*Fogo:* quando um adversário corpo a corpo causa dano a você, ele sofre **1d10** pontos de dano mágico. *Terra:* você recebe um bônus igual à sua Proficiência em todos os seus limiares de dano."],"ax":[[{"k":"f","n":1}],[],[],[{"k":"d","n":1,"die":10,"fl":0,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Aura Elemental:* uma vez por descanso, enquanto estiver *Canalizando*, você pode manifestar uma aura correspondente ao seu elemento. Ela afeta alvos próximos até o fim da sua *Canalização*.","• *Água:* quando um adversário causa dano a você, você pode **marcar 1 Ponto de Fadiga** para movê-lo para qualquer ponto muito próximo de onde ele está.","• *Ar:* quando você ou um aliado sofre dano de um ataque oriundo de fora do alcance próximo, reduza esse dano em **– 1d8**.","• *Fogo:* quando um adversário marca 1 ou mais Pontos de Vida, ele também deve marcar 1 Ponto de Fadiga.","• *Terra:* seus aliados recebem um bônus de +1 em Força."],"ax":[[{"k":"u","s":"D"}],[],[],[],[]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Soberania Elemental:* você incorpora ainda mais seu elemento. Enquanto estiver *Canalizando*, você recebe o seguinte benefício:","• *Água:* quando um ataque contra você é bem-sucedido, você pode **marcar 1 Ponto de Fadiga** para deixar o atacante temporariamente *Vulnerável.*","• *Ar:* você recebe um bônus de +1 na Evasão e pode voar.","• *Fogo:* você recebe um bônus de +1 em sua Proficiência para ataques e feitiços que causam dano.","• *Terra:* quando for marcar Pontos de Vida, role **1d6** para cada Ponto de Vida a ser marcado. A cada 6 que você rolar, reduza o número de PV marcados em –1."],"ax":[[],[],[],[],[{"k":"rd","n":1,"die":6}]],"ef":[{"k":"ev","v":1,"lbl":"Ar: você recebe um bônus de +1 na Evasão e pode voar.","p":2},{"k":"pr","v":1,"lbl":"Fogo: você recebe um bônus de +1 em sua Proficiência para ataques e feitiços que causam dano.","p":3}],"tk":0}]},{"n":"Protetor da Renovação","desc":"*Seja um protetor da renovação para curar o grupo com* *poderosos efeitos mágicos.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Serenidade da Natureza:* uma vez por descanso longo, você pode criar um espaço de serenidade natural em alcance próximo. Ao gastar alguns minutos descansando no espaço, recupere PF do grupo (distribuído entre você e seus aliados à sua escolha) em um número igual ao seu Instinto.","*Regeneração:* toque uma criatura e **gaste 3 Pontos de Esperança**. Ela recupera **1d4** Pontos de Vida."],"ax":[[{"k":"u","s":"L"}],[{"k":"h","n":3}]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Presença Curativa:* você pode usar sua Regeneração em criaturas Muito Próximas.","• *Proteção Druídica:* uma vez por descanso long
