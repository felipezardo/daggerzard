.","p":0}],"tk":0},{"h":"Habilidade de Especialização","p":["*Predador Veloz:* quando um adversário *Marcado* ataca você, você recebe um bônus de +2 na Evasão contra esse ataque."],"ax":[[]],"ef":[{"k":"ev","v":2,"lbl":"Predador Veloz: quando um adversário Marcado ataca você, você recebe um bônus de +2 na Evasão contra esse ataque.","p":0}],"tk":0},{"h":"Habilidade de Maestria","p":["*Predador Apex:* antes de fazer um teste de ataque contra um adversário *Marcado*, você pode **gastar 1 Ponto de Esperança**. Em um sucesso, o mestre perde 1 Ponto de Medo."],"ax":[[]],"ef":[],"tk":0}]},{"n":"Treinador","desc":"*Seja um treinador para formar um laço profundo com um* *animal.*","a":[{"h":"Atributo de Conjuração","p":["Agilidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Companheiro Animal:* você tem um companheiro animal à sua escolha (e a critério do mestre). Ele estará ao seu lado a não ser que você ordene o contrário. Use a ficha de companheiro animal. Quando você subir de nível, escolha também uma das opções de aumento de nível na ficha do seu companheiro."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Treinamento Especializado:* escolha uma opção de aumento de nível adicional para seu companheiro animal.","*Unidos na Batalha:* se um adversário está em alcance corpo a corpo de seu companheiro animal e ataca você, você recebe +2 de bônus na Evasão contra esse ataque."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["• *Treinamento Avançado:* escolha duas opções de aumento de nível adicionais para seu companheiro animal.","*Amigo Leal:* uma vez por descanso longo, quando um ataque faria você marcar seu último PV ou seu companheiro marcar o último PF e vocês dois estiverem próximos um do outro, se ficarem em alcance corpo a corpo, você pode sofrer o dano no lugar dele ou ele pode sofrer o dano no seu lugar."],"ax":[[],[{"k":"u","s":"L"}]],"ef":[],"tk":0}]}],"Ladino":[{"n":"Gatuno","desc":"*Seja um gatuno para manipular as sombras e se esgueirar* *pelo ambiente.*","a":[{"h":"Atributo de Conjuração","p":["Acuidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Passo Sombrio:* você pode se movimentar de uma sombra para outra. Ao entrar em uma área de escuridão ou na sombra de outra criatura ou objeto, você pode **marcar 1 PF** para desaparecer de onde está e reaparecer dentro de outra sombra distante. Ao reaparecer, considera-se que você está *Oculto*."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Nuvem de Escuridão:* faça um **teste de conjuração (15)**. Se bem-sucedido, você cria uma nuvem de escuridão temporária que cobre toda a área Próxima. Criaturas no interior da nuvem não podem enxergar o lado de fora, e vice-versa. Considera- se que você está *Oculto* para qualquer adversário cuja linha de visão esteja bloqueada pela nuvem.","*Adrenalina:* enquanto estiver *Vulnerável*, some seu nível às suas rolagens de dano."],"ax":[[{"k":"c","dif":15}],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Sombra Fugaz:* você recebe um bônus permanente de +1 na Evasão. Além disso, pode usar Passo Sombrio para se mover até uma sombra muito distante.","*Desaparecimento:* **marque 1 Ponto de Fadiga** para ficar *Oculto* a qualquer momento. Enquanto estiver *Oculto* devido a esta habilidade, você se recupera automaticamente da condição *Imobilizado*, se estiver com ela. Você permanece *Oculto* desta forma até rolar com Medo ou até seu próximo descanso."],"ax":[[],[{"k":"f","n":1}]],"ef":[{"k":"ev","v":1,"lbl":"Sombra Fugaz: você recebe um bônus permanente de +1 na Evasão.","p":0,"perm":1}],"tk":0}]},{"n":"Mafioso","desc":"*Seja um mafioso para ter uma rede de contatos onde quer* *que vá.*","a":[{"h":"Atributo de Conjuração","p":["Acuidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Conexões:* quando chega a uma cidade ou lugar importante, você conhece alguém lá. Dê um nome a essa conexão, anote como ela pode ser útil e escolha um fato da lista a seguir:","• A conexão me deve um favor, mas econtrá-la será difícil;","• A conexão vai pedir algo em troca;","• A conexão sempre está em apuros;","• Costumávamos ser parceiros. É uma longa história;","• Nossa separação não foi das melhores."],"ax":[[],[],[],[],[],[]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["• *Contatos:* uma vez por sessão, você pode convocar brevemente um contato escuso. Escolha um dos benefícios abaixo e descreva o que fez seu contato vir ajudá-lo:","Ele fornece 1 punhado de ouro, uma ferramenta única ou um objeto mundano necessário para a situação; A ajuda dele fornece um bônus de +3 no resultado de seu Dado de Medo ou Esperança no seu próximo teste; Na próxima vez que você causar dano, ele dispara das sombras, somando **+2d8** à sua rolagem de dano."],"ax":[[{"k":"u","s":"L"}],[]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Reforços Confiáveis:* você pode usar Contatos três vezes por sessão. As seguintes opções são adicionadas à lista de benefícios que você pode escolher quando a usa:","• Quando você marca 1 Ponto de Vida ou mais, ele pode correr em sua defesa, reduzindo o número de PV marcados em –1;","• Quando você faz um teste de Presença em uma conversa, ele pode ajudar, permitindo que você use **1d20** como seu Dado de Esperança."],"ax":[[],[],[]],"ef":[],"tk":0}]}],"Serafim":[{"n":"Portador Divino","desc":"*Seja um portador divino para dominar o campo de batalha* *com uma arma lendária.*","a":[{"h":"Atributo de Conjuração","p":["Força"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Arma Espiritual:* se você tem equipada uma arma com alcance corpo a corpo ou muito próximo, ela pode voar da sua mão para atacar um adversário próximo e então retornar para você. Você pode **marcar 1 PF** para escolher um adversário adicional dentro do alcance como alvo, usando o mesmo teste de ataque.","*Toque Piedoso:* uma vez por descanso longo, toque uma criatura para que ela recupere 2 PV ou 2 PF."],"ax":[[],[{"k":"gv","n":2},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Devoção:* ao rolar seus Dados de Oração, você pode rolar um dado adicional e descartar o menor resultado. Além disso, você pode usar seu Toque Piedoso duas vezes por descanso longo em vez de uma."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Ressonância Sagrada:* ao rolar o dano de sua Arma Espiritual, se dois ou mais dados resultarem no mesmo número, dobre o valor de cada dado com resultado igual. Por exemplo, se você tirar dois 5, eles contam como dois 10."],"ax":[[]],"ef":[],"tk":0}]},{"n":"Sentinela Alada","desc":"*Seja uma sentinela alada para levantar voo e desferir golpes* *aéreos devastadores.*","a":[{"h":"Atributo de Conjuração","p":["Força"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Asas de Luz:* você pode voar e, enquanto estiver voando, pode:","• **Marcar 1 Ponto de Fadiga** para erguer e carregar uma criatura voluntária aproximadamente do seu tamanho ou menor;","• **Gastar 1 Ponto de Esperança** para causar **1d8** de dano adicional em um ataque bem-sucedido."],"ax":[[],[],[{"k":"d","n":1,"die":8,"fl":0,"tp":"","m":null}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Visagem Etérea:* sua feição sobrenatural causa admiração e temor. Enquanto estiver voando, você tem vantagem em testes de Presença. Quando tem um sucesso com Esperança em testes de Presença, em vez de você receber Esperança, você faz o mestre perder 1 Ponto de Medo."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Ascensão:* você recebe um bônus permanente de +4 no seu limiar de dano grave.","*Poder dos Deuses:* enquanto estiver voando, você causa **1d12** em vez de 1d8 de dano adicional com suas Asas de Luz."],"ax":[[],[{"k":"d","n":1,"die":8,"fl":0,"tp":"","m":null}]],"ef":[{"k":"tg","v":4,"lbl":"Ascensão: você recebe um bônus permanente de +4 no seu limiar de dano grave.","p":0,"perm":1}],"tk":0}]}],"Feiticeiro":[{"n":"Elementalista","desc":"*Seja um elementalista para canalizar magia bruta e moldá-la* *na forma de um elemento específico.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Elementalismo:* escolha um dos seguintes elementos na criação de personagem: água, ar, fogo, relâmpago, terra.","Você pode moldar esse elemento para causar efeitos inofensivos. Além disso, ao **gastar 1 Ponto de Esperança** e descrever como seu controle sobre esse elemento ajuda em um teste que você esteja prestes a fazer, você recebe um bônus de +2 nesse teste ou um bônus de +3 na rolagem de dano."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["• *Evasão Natural:* você pode convocar seu elemento para se proteger. Quando sofre um ataque, você pode **marcar 1 Ponto** **de Fadiga** e descrever como usa seu elemento para se defender. Ao fazer isso, role **1d6** e some o resultado à sua Evasão contra esse ataque."],"ax":[[{"k":"rd","n":1,"die":6}]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Transcendência:* uma vez por descanso longo, você pode se transformar em uma manifestação física de seu elemento. Ao fazer isso, descreva sua transformação e escolha dois dos benefícios abaixo para receber até seu próximo descanso:","• Bônus de +4 no seu limiar grave;","• Bônus de +1 em um atributo à sua escolha;","• Bônus de +1 em sua Proficiência;","• Bônus de +2 na sua Evasão."],"ax":[[{"k":"u","s":"L"}],[],[],[],[]],"ef":[{"k":"tg","v":4,"lbl":"Bônus de +4 no seu limiar grave;","p":1},{"k":"pr","v":1,"lbl":"Bônus de +1 em sua Proficiência;","p":3},{"k":"ev","v":2,"lbl":"Bônus de +2 na sua Evasão.","p":4}],"tk":0}]},{"n":"Primordialista","desc":"*Seja um primordialista para estender a versatilidade de seus* *feitiços de maneiras poderosas.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Manipular Magia:* sua herança primordial permite que você altere a própria essência da magia. Após conjurar um feitiço ou atacar com uma arma que causa dano mágico, você pode **marcar 1 Ponto de Fadiga** para fazer um dos seguintes:","• Estender o alcance do ataque ou feitiço em um passo (por exemplo, de muito próximo para próximo);","• Receber um bônus de +2 no resultado do teste;","• Dobrar um dado de dano à sua escolha;","• Acertar um alvo adicional dentro do alcance."],"ax":[[],[],[],[],[]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Auxílio Encantado:* você pode aprimorar a magia alheia com sua essência. Ao ajudar um aliado com um teste de conjuração, você pode rolar **1d8** como seu dado de vantagem. Uma vez por descanso longo, após um aliado fazer um teste de conjuração com sua ajuda, você pode trocar os resultados dos Dados de Dualidade um pelo outro."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Carga Arcana:* você pode reunir energia mágica para aprimorar suas capacidades. Ao sofrer dano mágico, você fica *Carregado*; você também pode **gastar 2 Pontos de Esperança** para ficar *Carregado*. Enquanto estiver *Carregado*, ao acertar um ataque que causa dano mágico, você pode zerar sua *Carga* receber um bônus de +10 em sua rolagem de dano ou um bônus de +3 na Dificuldade de um teste de reação que o feitiço exija do alvo. Você deixa de estar *Carregado* em seu próximo descanso longo."],"ax":[[]],"ef":[],"tk":0}]}],"Ocultista":[{"n":"Servo do Colérico","desc":"*Seja um servo do Colérico para destruir quem age contra* *você.*","a":[{"h":"Atributo de Conjuração","p":["Presença"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Fúria do Patrono:* **gaste 1 PB** para imbuir seus ataques com o poder do seu Patrono, o que dura até você causar dano grave ou até o fim da cena. Ao rolar dano enquanto este efeito estiver ativo, você também rola um número de Dados de Patrono igual ao seu patamar e soma seus resultados ao dano causado.","*Vingança Mortal:* ao marcar qualquer número de PV por conta de um ataque, você pode **gastar 1 Ponto de Benesse** e rolar uma quantidade de Dados de Patrono igual aos PV marcados. Para cada resultado 4 ou maior, o atacante marca 1 PV."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Alcance Ameaçador:* **gaste 1 Ponto de Benesse** para aumentar o alcance de sua arma principal em um passo (de corpo a corpo para muito próximo, de muito próximo para próximo e assim por diante) até, no máximo, alcance muito distante. Este efeito termina quando você acertar um ataque com essa arma.","*Enfraquecer Meus Inimigos:* ao obter sucesso em uma rolagem com Esperança num teste contra um alvo, você pode **gastar uma quantidade qualquer de Pontos de Benesse** para fazer o alvo marcar um número de PF igual aos pontos gastos."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Ataque Apavorante:* **gaste 1 PB** para rolar novamente quaisquer dados de dano. Você pode gastar mais PB para usar esta habilidade várias vezes numa mesma rolagem de dano.","*Cólera Transcendental:* uma vez por descanso, ao sofrer dano, você pode **gastar uma quantidade qualquer de PB** para rolar um número de Dados de Patrono equivalente aos pontos gastos e escolher um número de criaturas próximas igual ao resultado mais alto da rolagem. Cada criatura escolhida marca 1 PV.","**EXEMPLOS DE ESFERAS DE INFLUÊNCIA**","• Na criação de um personagem ocultista, escolha a esfera de influência de seu patrono de acordo com a lista abaixo, ou converse com o mestre para criar alguma outra.","• *Ambição Líderes Segredos Artistas Amor Soldados Caos* *Misericórdia Força Escuridão Travessura Viajantes Morte* *Natureza Trapaceiros Apostadores Protetores Verdade Honra* *Vingança Guerra Justiça Estudiosos Sabedoria*"],"ax":[[],[{"k":"u","s":"D"}],[],[],[]],"ef":[],"tk":0}]},{"n":"Servo do Eterno","desc":"*Seja um servo do Eterno para resistir aos inimigos e escapar* *da morte.*","a":[{"h":"Atributo de Conjuração","p":["Presença"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Abraço Imortal:* uma vez por descanso, **gaste uma quantidade qualquer de Pontos de Benesse** para rolar um número de Dados de Patrono equivalente aos pontos gastos. Para cada resultado 4 ou maior, recupere 1 Ponto de Vida.","*Manto do Patrono:* **gaste 1 Ponto de Benesse** para se envolver com o aspecto apavorante do seu patrono, o que dura até você sofrer dano grave ou até o fim da cena. Enquanto este efeito estiver ativo, você recebe um bônus em seus limiares de dano equivalente ao seu patamar e tem vantagem em testes para intimidar um alvo."],"ax":[[{"k":"gv","n":1},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Súplica Pungente:* quando um adversário fizer um ataque contra você ou contra um aliado muito próximo, você pode **gastar 1 PB** para que o teste seja feito com desvantagem. Em caso de falha, o adversário também marca 1 Ponto de Fadiga.","*Absorver Dano:* uma vez por descanso, você pode **gastar 1 PB** para reduzir o dano recebido à metade."],"ax":[[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Égide Sombria:* uma vez por descanso longo, ao sofrer dano, você pode **gastar 1 PB** em vez de marcar Pontos de Vida.","*Maldição Drenante:* quando um adversário fizer um ataque contra você ou contra um aliado muito próximo, você pode **gastar 1 PB** para *Drenar* o atacante. Ao fazer isso, o adversário marca 1 Ponto de Fadiga e você pode recuperar 1 PF. Enquanto estiver *Drenado*, o alvo usa **d12,** em vez de d20, em seus testes de ataque (inclusive se tiver vantagem ou desvantagem), isso dura até ele falhar em um teste."],"ax":[[{"k":"u","s":"L"}],[{"k":"gs","n":1}]],"ef":[],"tk":0}]}],"Guerreiro":[{"n":"Escolhido da Bravura","desc":"*Seja um escolhido da bravura para se alimentar da força dos* *inimigos.*","a":[{"h":"Habilidades Fundamentais","p":["*Coragem:* ao falhar com Medo, receba 1 Ponto de Esperança.","*Ritual de Batalha:* uma vez por descanso longo, antes de fazer algo muito perigoso ou enfrentar um oponente claramente superior a você, descreva sua preparação para isso. Então, recupere 2 Pontos de Fadiga e receba 2 Pontos de Esperança."],"ax":[[{"k":"gh","n":1}],[{"k":"gs","n":2},{"k":"gh","n":2},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Enfrentar o Desafio:* você se mantém vigilante frente ao perigo crescente. Enquanto tiver 2 PV ou menos desmarcados, você pode usar **1d20** como seu Dado de Esperança."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Camaradagem:* sua bravura inspira seus aliados. Você pode iniciar um teste em dupla adicional por sessão. Além disso, um aliado só precisa gastar 2 Pontos de Esperança para iniciar um teste em dupla com você."],"ax":[[]],"ef":[],"tk":0}]},{"n":"Escolhido da Matança","desc":"*Seja um escolhido da matança para derrubar os adversários* *com uma força imensa.*","a":[{"h":"Habilidade Fundamental","p":["*Matança:* a o rolar com Esperança, você pode colocar **1d6** nesta carta em vez de receber 1 Ponto de Esperança. Dados nesta carta são seus Dados de Matança; você pode possuir um número máximo desses dados igual à sua Proficiência. Ao fazer um teste de ataque ou uma rolagem de dano, você pode gastar um número qualquer de Dados de Matança e somar seus resultados à rolagem. No fim de cada sessão, Dados de Matança não utilizados são perdidos; você ganha 1 Ponto de Esperança por dado perdido desta forma."],"ax":[[{"k":"gh","n":1}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Especialista em Armas:* você pode empunhar várias armas. Quando acerta um ataque, você pode **gastar 1 Ponto de Esperança** para somar um dos dados de dano da sua arma secundária à rolagem de dano. Além disso, uma vez por descanso longo, role novamente quaisquer 1 que rolar nos seus Dados de Matança."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Preparação Marcial:* você pode treinar seu grupo durante descansos. Você, e cada aliado que fizer este movimento de descanso, recebe **1d6** como Dado de Matança. Um personagem com um Dado de Matança pode gastá-lo para somar seu resultado a um teste de ataque ou rolagem de dano."],"ax":[[]],"ef":[],"tk":0}]}],"Bruxo":[{"n":"Sábio da Lua","desc":"*Seja um sábio da lua para incorporar poder celestial e ampliar* *sua magia.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidade Fundamental","p":["*Glamour Noturno:* faça um **teste de conjuração (13)** para assumir uma aparência glamorosa e ficar *Encantador*. Um personagem *Encantador* tem vantagem em testes que se beneficiam de sua aparência ilusória. Além disso, adversários próximos precisam marcar 1 Ponto de Fadiga para atacá-lo.","A menos que você **marque 1 PF** para continuar *Encantador*, a condição termina quando você marcar PV ou causar dano."],"ax":[[{"k":"c","dif":13}],[{"k":"f","n":1}]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Ira da Luz Pálida:* quando uma criatura *Esconjurada* muito distante falhar em um teste de ataque, ela deve marcar 1 PF.","*Raio Lunar:* uma vez por sessão, você pode conjurar uma coluna de luar, iluminando a área próxima até o fim da cena. Enquanto estiver banhado por este luar, você e seus aliados recebem +1 em testes de conjuração e conseguem enxergar através de ilusões."],"ax":[[],[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"h":"Habilidade de Maestria","p":["*Fases da Lua:* no início de cada sessão, role **1d6** e o coloque sobre esta carta. Você recebe o efeito correspondente até o fim da sessão.","**d6 Fase lunar Efeito 1** Nova **Gaste 1 Ponto de Esperança** para negar dano menor **2-3** Crescente +2 em rolagens de dano **4** Cheia +3 nos limiares de dano **5-6** Minguante +1 na Evasão","Uma vez por descanso, você pode **gastar 1 Ponto de Esperança** para aumentar o valor da rolagem em um número. Aumentar um resultado 6 o transforma em um resultado 1."],"ax":[[{"k":"rd","n":1,"die":6}],[{"k":"h","n":1}],[{"k":"u","s":"D"}]],"ef":[{"k":"ev","v":1,"lbl":"d6 Fase lunar Efeito 1 Nova Gaste 1 Ponto de Esperança para negar dano menor 2-3 Crescente +2 em rolagens de dano 4 Cheia +3 nos limiares de dano 5-6 ","p":1},{"k":"t","v":3,"lbl":"d6 Fase lunar Efeito 1 Nova Gaste 1 Ponto de Esperança para negar dano menor 2-3 Crescente +2 em rolagens de dano 4 Cheia +3 nos limiares de dano 5-6 ","p":1},{"k":"dm","v":2,"lbl":"d6 Fase lunar Efeito 1 Nova Gaste 1 Ponto de Esperança para negar dano menor 2-3 Crescente +2 em rolagens de dano 4 Cheia +3 nos limiares de dano 5-6 ","p":1}],"tk":0}]},{"n":"Sábio Rústico","desc":"*Seja um sábio rústico para para fortalecer a si mesmo e ao* *seu grupo por meio de seu ofício.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Ervas Medicinais:* quando você ou um aliado presente na cena recuperar 1 ou mais PV ou PF por meio de algum consumível, você ou o aliado recupera 1 ponto adicional.","*Talismã Encantado:* uma vez por descanso, você pode imbuir um item pequeno com sua essência protetora. **Gaste uma quantidade qualquer de Pontos de Esperança** e coloque um número equivalente de marcadores nesta carta. Quando a pessoa que estiver com o talismã sofrer dano, gaste um marcador para reduzir o número de PV a serem marcados em 1. No seu próximo descanso, marcadores não usados são perdidos."],"ax":[[],[{"k":"u","s":"D"}]],"ef":[],"tk":1},{"h":"Habilidades de Especialização","p":["*Caminhar Entre Mundos:* em um momento tranquilo, faça um **teste de conjuração (13)**. Em um sucesso, uma vez por descanso, você pode **marcar 1 PF** para atravessar o véu entre a vida e a morte e conversar com quaisquer espíritos próximos. Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Remova um marcador cada vez que um espírito responder a uma pergunta. Quando o último marcador for removido, ou no fim da cena, você retorna ao Plano Mortal no mesmo lugar onde estava antes.","*Praga Incômoda:* você tem vantagem em testes de ataque contra criaturas *Esconjuradas*."],"ax":[[{"k":"c","dif":13},{"k":"u","s":"D"}],[]],"ef":[],"tk":1},{"h":"Habilidade de Maestria","p":["*Círculo de Poder:* uma vez por descanso, desenhe um círculo no chão, delineando uma área muito próxima ao seu redor, e coloque um número de marcadores nesta carta igual ao seu atributo de conjuração. Enquanto estiverem dentro desse círculo, você e seus aliados recebem +2 em seus limiares de dano, Evasão e testes de ataque. Remova um marcador cada vez que você ou um aliado dentro do círculo fizer um teste ou evadir um ataque. Esta magia dura até que o último marcador seja removido ou até que você saia do círculo."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":1}]}],"Mago":[{"n":"Discípulo do Conhecimento","desc":"*Seja um discípulo do conhecimento para ter uma profunda* *compreensão do mundo ao seu redor.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["• *Promissor:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Adepto:* quando usar uma Experiência, você pode **marcar 1 PF** em vez de gastar 1 Ponto de Esperança. Se o fizer, dobre seu modificador de Experiência para essa rolagem."],"ax":[[],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Talentoso:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Troca Perfeita:* uma vez por descanso, quando troca uma carta de domínio de sua reserva, você pode reduzir o custo de troca em –1."],"ax":[[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Brilhante:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Bem Vivido:* ao usar uma Experiência, role **1d6**. Se tirar 5 ou mais, você pode usá-la sem gastar Pontos de Esperança."],"ax":[[],[{"k":"rd","n":1,"die":6}]],"ef":[],"tk":0}]},{"n":"Discípulo da Guerra","desc":"*Seja um discípulo da guerra para usar seu treinamento mágico* *de forma agressiva.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Mago de Batalha:* você estudou para se tornar uma força insuperável no campo de batalha. Receba 1 Ponto de Vida adicional.","*Encare o Medo:* ao ter sucesso com Medo em um teste de ataque, você causa **1d10** de dano mágico adicional."],"ax":[[],[{"k":"d","n":1,"die":10,"fl":0,"tp":"mágico","m":null}]],"ef":[{"k":"pv","v":1,"lbl":"Mago de Batalha: você estudou para se tornar uma força insuperável no campo de batalha. Receba 1 Ponto de Vida adicional.","p":0,"perm":1,"anyloc":1}],"tk":0},{"h":"Habilidades de Especialização","p":["*Conjurar Escudo:* você consegue manter uma barreira mágica protetora. Enquanto tiver ao menos 2 Pontos de Esperança,","**ANCESTRALIDADES**","*Ancestralidades representam a ascendência de seu* *personagem e afetam sua aparência física.*","*Esta seção descreve as ancestralidades de Daggerheart e as* *características físicas compartilhadas* *pelos membros de cada uma. Isso posto, você sempre pode* *decidir que seu personagem tem* *características físicas fora do “padrão” ou da “média” da sua* *ancestralidade. Procure inspiração* *nas ilustrações e explore a diversidade das ancestralidades* *ao criar seu personagem.*","Esta seção fornece um panorama das formas físicas variadas das criaturas de Daggerheart. Ao longo do jogo, você encontrará membros de todas as ancestralidades e terá a oportunidade de aprender suas nuances e qualidades exclusivas. Você também perceberá que o termo “pessoa”, no mundo de Daggerheart, é usado para se referir a membros de qualquer ancestralidade, visto que indivíduos de todas elas têm aspectos físicos, personalidades e culturas únicas.","Algumas ancestralidades são descritas com o termo “humanoide”. Isso não significa que elas tenham relação com os “humanos”, a ancestralidade mais reconhecível em","• some sua Proficiência à sua Evasão.","• *Movido por Medo:* o dano mágico adicional de Encare o Medo aumenta para **2d10**."],"ax":[[],[],[],[],[],[],[],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Triunfo do Caos:* ao ter sucesso em um ataque, você pode **marcar 1 Ponto de Fadiga** após a rolagem de dano para forçar o alvo a marcar 1 PV adicional.","*Não Tenha Medo:* o dano mágico adicional de Encare o Medo aumenta para **3d10**."],"ax":[[],[]],"ef":[],"tk":0}]}],"Caçador de Sangue":[{"n":"Ordem do Espectro","desc":"","void":1,"a":[{"h":"Atributo de Conjuração","p":["Agilidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Coragem Sombria:* quando você for bem-sucedido em um teste de ação com Medo, você pode gastar 1 Ponto de Esperança para limpar 1 Ponto de Fadiga.","*Andarilho do Véu:* você pode deslizar brevemente para o reino entre os vivos e os mortos. **Marque 1 Ponto de Fadiga** para se mover até alcance próximo atravessando criaturas e objetos."],"ax":[[],[{"k":"f","n":1}]],"ef":[],"tk":0},{"h":"Habilidade de Especialização","p":["*Espreitador do Véu:* quando você usar sua habilidade Andarilho do Véu, agora pode se mover para um local em alcance distante e tem vantagem no próximo teste de ação que fizer nesta cena."],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Horror Aprimorado:* você não pode ficar *Vulnerável* a menos que todos os seus Pontos de Fadiga estejam marcados.","*Forma Espectral:* uma vez por descanso longo, quando você fosse marcar seu último Ponto de Vida, você pode marcar 1 Ponto de Fadiga e entrar em sua Forma Espectral. Enquanto estiver nessa forma, você pode atravessar matéria física e tem resistência a dano físico. Além disso, quando fosse marcar 1 Ponto de Vida, você marca 1 Ponto de Fadiga no lugar. Você sai dessa forma se seu último Ponto de Fadiga for marcado ou se você limpar 1 Ponto de Vida."],"ax":[[],[{"k":"u","s":"L"}]],"ef":[],"tk":0}]},{"n":"Ordem do Mutante","desc":"","void":1,"a":[{"h":"Atributo de Conjuração","p":["Agilidade"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Mutagênicos:* você emprega toxinas mutagênicas criadas para aprimorar suas habilidades. Quando você terminar um descanso, pode beber uma dessas toxinas para receber seus efeitos, que duram até você terminar seu próximo descanso. Esses efeitos incluem um bônus de +1 em um atributo à sua escolha, uma penalidade de −1 em um atributo diferente à sua escolha e um benefício à sua escolha entre os seguintes:","• *Celeridade.* Se você estiver *Imobilizado* ou *Vulnerável*, pode **marcar 1 Ponto de Fadiga** para encerrar a condição em si mesmo.","• *Resistente.* Sua Pontuação de Armadura aumenta em 2.","• *Sentidos de Caçador.* Você tem vantagem em qualquer teste de ação para rastrear uma criatura e pode enxergar na escuridão completa."],"ax":[[],[],[],[]],"ef":[{"k":"pa","v":2,"lbl":"Resistente: sua Pontuação de Armadura aumenta em 2.","p":3}],"tk":0},{"h":"Habilidades de Especialização","p":["*Mutagênicos Aprimorados:* quando você escolher um benefício de mutagênico, suas opções também incluem o seguinte:","• *Nervos de Aço.* Sempre que você precisar marcar 1 Ponto de Fadiga, pode gastar 2 Pontos de Esperança no lugar.","• *Rapidez.* Sua Evasão aumenta em 1.","• *Pele de Ferro.* Seu limiar de dano grave aumenta em um número igual à sua Proficiência.","*Toxinas Voláteis:* você pode escolher dois benefícios de mutagênico em vez de um. Se fizer isso, **marque 1 Ponto de Vida** que não pode ser limpo até você terminar seu próximo descanso."],"ax":[[],[],[],[],[{"k":"mv","n":1}]],"ef":[{"k":"ev","v":1,"lbl":"Rapidez: sua Evasão aumenta em 1.","p":2},{"k":"tg","v":1,"lbl":"Pele de Ferro: seu limiar de dano grave aumenta em um número igual à sua Proficiência.","p":3,"f":"pr"}],"tk":0},{"h":"Habilidades de Maestria","p":["*Mutagênicos Dominados:* o bônus e a penalidade de atributo que você recebe da habilidade Mutagênicos mudam para +2 e −2, respectivamente. Quando escolher um benefício de mutagênico, suas opções também incluem o seguinte:","• *Sangue Etéreo.* Dentro da sua linha de visão, você pode ver criaturas e objetos invisíveis, e ilusões visuais parecem transparentes para você. Se uma criatura ou um objeto dentro da sua linha de visão tiver sido transformado por magia, você pode ver sua verdadeira forma.","• *Fúria.* Quando fizer um teste de ataque, você pode **marcar 1 Ponto de Fadiga** para receber um bônus no teste igual à sua Proficiência.","• *Carne de Aço.* Seu limiar de dano maior recebe um bônus igual à sua Proficiência."],"ax":[[],[],[],[]],"ef":[{"k":"ak","v":1,"lbl":"Fúria: bônus no teste de ataque igual à sua Proficiência.","p":2,"f":"pr"},{"k":"tm","v":1,"lbl":"Carne de Aço: seu limiar de dano maior recebe um bônus igual à sua Proficiência.","p":3,"f":"pr"}],"tk":0}]},{"n":"Ordem do Licano","desc":"","void":1,"a":[{"h":"Atributo de Conjuração","p":["Força"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Forma Híbrida:* você pode assumir uma Forma Híbrida lupina. **Marque 1 Ponto de Fadiga** para entrar nessa forma até todos os seus Pontos de Fadiga estarem marcados ou a cena terminar. Enquanto estiver na forma, você recebe um bônus de **1d4** em seus testes de ação e rolagens de dano.","*A Fera Interior:* quando você ganhar 1 Ponto de Esperança enquanto estiver na Forma Híbrida, você também marca 1 Ponto de Fadiga."],"ax":[[{"k":"f","n":1,"on":[0]}],[{"k":"gh","n":1}]],"ef":[{"k":"bd","v":4,"lbl":"Forma Híbrida: bônus de 1d4 (1d6 com a Especialização, 1d8 com a Maestria) em testes de ação e rolagens de dano.","p":0,"f":"lyc"}],"tk":0},{"h":"Habilidades de Especialização","p":["*Foco Bestial:* uma vez por descanso, você pode colocar uma carta de domínio na sua reserva e então limpar um número de Pontos de Fadiga igual ao Custo de troca da carta.","*Fortalecimento Feroz:* o dado de bônus da sua Forma Híbrida aumenta para 1d6."],"ax":[[{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Caçador Supremo:* o dado de bônus da sua Forma Híbrida aumenta para 1d8.","*Regeneração:* quando você for bem-sucedido com Esperança enquanto estiver na Forma Híbrida, role 1d4. Se o resultado for maior que seu número atual de Pontos de Vida desmarcados, limpe 1 Ponto de Vida."],"ax":[[],[{"k":"gv","n":1},{"k":"rd","n":1,"die":4}]],"ef":[],"tk":0}]}],"Invocador":[{"n":"Necromancia","desc":"","void":1,"a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Segundo Círculo — Cadáver Cambaleante:* você pode invocar Cadáveres Cambaleantes usando seu Segundo Círculo.","*Fome da Sepultura:* faça um **teste de conjuração** contra um alvo em alcance distante. Em um sucesso, seus Cadáveres Cambaleantes se movem para atacar o alvo, causando 5 de dano físico por Cadáver Cambaleante antes de retornar para você. Um Cadáver Cambaleante então desaparece.","*Colheita Sinistra:* quando um adversário em alcance distante marcar seu último Ponto de Vida, você pode invocar 1 Cadáver Cambaleante sem marcar Pontos de Fadiga."],"ax":[[],[],[]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Terceiro Círculo — Fantasmas:* você pode invocar Fantasmas usando seu Terceiro Círculo.","*Protetores Fantasmagóricos:* enquanto tiver Fantasmas invocados, sua Evasão recebe um bônus de +1, pois eles giram ao seu redor em proteção.","*Terror Espectral:* faça um **teste de conjuração** contra um alvo em alcance distante. Em um sucesso, um dos seus Fantasmas voa até o alvo para assustá-lo, fazendo-o marcar 1 Ponto de Fadiga. Esse Fantasma então desaparece."],"ax":[[],[],[]],"ef":[{"k":"ev","v":1,"lbl":"Protetores Fantasmagóricos: Evasão +1 enquanto tiver Fantasmas invocados.","p":1}],"tk":0},{"h":"Habilidades de Maestria","p":["*Quarto Círculo — Cavaleiro da Morte:* você pode invocar 1 Cavaleiro da Morte por vez usando seu Quarto Círculo.","*Guerreiro Mortal:* quando você for bem-sucedido em um teste de ataque com Esperança, você pode em vez disso ter sucesso com Medo, fazendo seu Cavaleiro da Morte avançar sobre o alvo, adicionar **2d12** ao dano do ataque e então retornar para você.","*Baluarte do Cavaleiro:* quando você sofrer dano grave, o Cavaleiro da Morte marca 1 dos Pontos de Vida no seu lugar e então desaparece."],"ax":[[],[],[]],"ef":[],"tk":0}]},{"n":"Teurgia","desc":"","void":1,"a":[{"h":"Atributo de Conjuração","p":["Conhecimento"],"ax":[[]],"ef":[],"tk":0},{"h":"Habilidades Fundamentais","p":["*Segundo Círculo — Anjo:* você pode invocar Anjos usando seu Segundo Círculo.","*Presença Angelical:* enquanto tiver Anjos invocados, você tem vantagem em testes de Presença para influenciar outros, pois o poder angelical ao seu redor inspira admiração e medo.","*Golpe Esperançoso:* quando você for bem-sucedido com Esperança em um teste de ataque, você pode comandar 1 Anjo para causar **1d10** de dano mágico extra ao alvo. O Anjo então desaparece."],"ax":[[],[],[{"k":"d","n":1,"die":10,"fl":0,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"h":"Habilidades de Especialização","p":["*Terceiro Círculo — Arcanjo:* você pode invocar Arcanjos usando seu Terceiro Círculo.","*Comandante Divino:* enquanto tiver Arcanjos invocados, o dano extra do seu Golpe Esperançoso é **1d12** em vez de 1d10.","*Auxílio Celestial:* você pode comandar 1 Arcanjo para fazer uma das seguintes ações:","• Levar voando você ou um aliado em alcance muito próximo para um local em alcance distante.","• Ajudar um aliado em alcance próximo sem gastar Esperança.","O Arcanjo então desaparece."],"ax":[[],[],[],[],[],[]],"ef":[],"tk":0},{"h":"Habilidades de Maestria","p":["*Quarto Círculo — Manifestação Divina:* você pode invocar 1 Manifestação Divina por vez usando seu Quarto Círculo.","*Esperança Sagrada:* quando você invocar uma Manifestação Divina, coloque três dados de Esperança extras nesta carta. Quando fizer um teste de ação ou de reação, você pode rolar e gastar 1 dado de Esperança desta carta, junto com seu dado de Esperança normal, e usar o dado de Esperança de maior resultado. Quando não restarem dados nesta carta, a Manifestação Divina desaparece."],"ax":[[],[]],"ef":[],"tk":0}]}]},"forms":[{"n":"Animal Doméstico","t":1,"ex":"(Cão, coelho, gato etc.)","ab":["*Companhia:* ao ajudar um aliado, você pode rolar **1d8** como seu dado de vantagem.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Instinto +1 | Evasão +2","atk":"Corpo a corpo (Instinto) d6 de dano fís.","adv":"Vantagem ao escalar, localizar, proteger"},{"n":"Aracnídeo Espreitador","t":1,"ex":"(Aranha-lobo, tarântula etc.)","ab":["*Lança-teia:* você pode criar uma poderosa teia, útil em explorações e em batalhas. Ela é forte o bastante para suportar uma criatura. Você pode *Imobilizar* temporariamente um alvo próximo se passar em um teste de Acuidade contra ele.","*Picada Peçonhenta:* quando acerta um ataque contra um alvo corpo a corpo, você o deixa temporariamente *Envenenado*. Uma criatura *Envenenada* sofre **1d10** de dano físico direto cada vez que age."],"st":"Acuidade +1 | Evasão +2","atk":"Cac (Acuidade) d6+1 de dano fís.","adv":"Vantagem ao atacar, escalar, mover-se furtivamente"},{"n":"Explorador Ágil","t":1,"ex":"(Camundongo, doninha, raposa etc.)","ab":["*Ágil:* seu movimento é silencioso e você pode **gastar 1 Ponto** **de Esperança** para se mover até um ponto distante sem precisar fazer um teste.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Agilidade +1 | Evasão +2","atk":"Corpo a corpo (Agilidade) d4 de dano fís.","adv":"Vantagem em enganar, localizar, mover-se furtivamente"},{"n":"Explorador Aquático","t":1,"ex":"(Enguia, peixe, polvo etc.)","ab":["*Aquático:* você pode respirar e se movimentar naturalmente embaixo d’água.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Agilidade +1 | Evasão +2","atk":"Corpo a corpo (Agilidade) d4 de dano fís.","adv":"Vantagem ao mover-se furtivamente, nadar, orientar-se"},{"n":"Predador de Bando","t":1,"ex":"(Coiote, hiena, lobo etc.)","ab":["*Caça em Bando:* quando você acerta um ataque contra um alvo atingido por um aliado imediatamente antes de você, seu dano aumenta em **+1d8**.","*Golpe Debilitante:* quando você acerta um ataque contra um alvo corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para torná-lo temporariamente *Vulnerável*."],"st":"Força +2 | Evasão +1","atk":"Corpo a corpo (Força) d8+2 de dano fís.","adv":"Vantagem ao atacar, correr, rastrear"},{"n":"Ruminante Arisco","t":1,"ex":"(Cabra, cervo, gazela etc.)","ab":["*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera.","*Presa Arisca:* quando sofre um ataque, você pode **marcar 1** **Ponto de Fadiga** para rolar **1d4** e somar o resultado à sua Evasão contra esse ataque."],"st":"Agilidade +1 | Evasão +3","atk":"Corpo a corpo (Agilidade) d6 de dano fís.","adv":"Vantagem ao correr, mover-se furtivamente, saltar"},{"n":"Carapaça Vigilante","t":2,"ex":"(Pangolim, tartaruga, tatu etc.)","ab":["*Canhão Ricochete:* **marque 1 Ponto de Fadiga** para que um aliado arremesse você contra um adversário. Para fazer isso, o aliado faz um teste de ataque usando Agilidade ou Força (à escolha dele) contra um alvo próximo. Em um sucesso, o adversário sofre **d12+2** de dano físico usando a Proficiência de seu aliado. Você pode **gastar 1 Ponto de Esperança** para escolher outro adversário muito próximo do primeiro como alvo. O segundo alvo sofre metade do dano causado ao primeiro.","*Carapaça Reforçada:* seu exterior sólido concede resistência a dano físico. Além disso, você pode **marcar 1 Ponto de** **Armadura** para se recolher em sua carapaça. Enquanto estiver dentro dela, o dano físico que você sofre é reduzido em um número igual à sua Armadura (após aplicar a resistência), mas você não pode realizar outras ações."],"st":"Força +1 | Evasão +1","atk":"Corpo a corpo (Força) d8+2 de dano fís.","adv":"Vantagem ao cavar, localizar, proteger"},{"n":"Fera Alada","t":2,"ex":"(Coruja, corvo, gavião etc.)","ab":["*Ossos Ocos:* você sofre uma penalidade de –2 nos seus limiares de dano.","*Visão Aérea:* você pode voar à vontade. Uma vez por descanso, e enquanto estiver no ar, você pode perguntar ao mestre algo sobre a paisagem abaixo sem precisar de teste. Na primeira vez em que um personagem fizer um teste para agir em relação a essa informação, ele o faz com vantagem."],"st":"Acuidade +1 | Evasão +3","atk":"Cac (Acuidade) d4+2 de dano fís.","adv":"Vantagem ao enganar, intimidar, localizar"},{"n":"Fera Poderosa","t":2,"ex":"(Alce, touro, urso etc.)","ab":["*Ataque Violento:* quando tira 1 em um dado de dano, você pode rolar **1d10** e somar o resultado à rolagem de dano. Além disso, antes de fazer um teste de ataque, você pode **marcar 1** **Ponto de Fadiga** para receber um bônus de +1 em sua Proficiência para esse ataque.","*Couro Espesso:* você recebe +2 de bônus nos seus limiares de dano."],"st":"Força +3 | Evasão +1","atk":"Corpo a corpo (Força) d10+4 de dano fís.","adv":"Vantagem ao intimidar, orientar-se, proteger"},{"n":"Predador Furtivo","t":2,"ex":"(Guepardo, leão, onça etc.)","ab":["*Abate:* **marque 1 Ponto de Fadiga** para se mover até ficar corpo a corpo a um alvo e fazer um teste de ataque contra ele. Em um sucesso, você recebe +2 em sua Proficiência para esse ataque e o alvo deve marcar 1 Ponto de Fadiga.","*Disparada:* **gaste 1 Ponto de Esperança** para se mover até um ponto em alcance distante sem precisar fazer um teste."],"st":"Instinto +1 | Evasão +3","atk":"Cac (Instinto) d8+6 de dano fís.","adv":"Vantagem ao atacar, escalar, mover-se furtivamente"},{"n":"Serpente Traiçoeira","t":2,"ex":"(Cascavel, naja, víbora etc.)","ab":["*Bote Peçonhento:* faça um ataque contra qualquer número de alvos muito próximos. Em um sucesso, o alvo fica temporariamente *Envenenado*. Uma criatura *Envenenada* sofre **1d10** de dano físico direto a cada vez que age.","*Silvo de alerta:* **marque 1 Ponto de Fadiga** para forçar qualquer número de alvos corpo a corpo a se afastarem até ficarem muito próximos."],"st":"Acuidade +1 | Evasão +2","atk":"muito próximo (Acuidade) d8+4 de dano fís.","adv":"Vantagem ao deslizar, enganar, escalar"},{"n":"Trotador Robusto","t":2,"ex":"(Camelo, cavalo, zebra etc.)","ab":["*Atropelar:* **marque 1 Ponto de Fadiga** para se mover até um ponto em alcance próximo em linha reta e atacar todos os alvos corpo a corpo à linha. Alvos atingidos sofrem **d8+1** de dano físico usando sua Proficiência e ficam temporariamente *Vulneráveis.*","*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta."],"st":"Agilidade +1 | Evasão +2","atk":"Cac (Agilidade) d8+1 de dano fís.","adv":"Vantagem ao correr, orientar-se, saltar"},{"n":"Fera Lendária","t":3,"ex":"(Aprimoradamento de 1º patamar)","ab":["*Evoluído:* escolha uma Forma de Fera de 1º patamar e torne- se uma versão maior e mais poderosa dela. Enquanto estiver nessa forma, você mantém todos os atributos e habilidades da forma original e recebe os seguintes bônus: Bônus de +6 em rolagens de dano; Bônus de +1 no atributo da forma; Bônus de +2 na Evasão."],"st":"","atk":"","adv":""},{"n":"Grande Fera Alada","t":3,"ex":"(Águia-gigante, falcão etc.)","ab":["*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta.","*Visão Aérea:* você pode voar à vontade. Uma vez por descanso, e enquanto estiver no ar, você pode perguntar ao mestre algo sobre a paisagem abaixo sem precisar de teste. Na primeira vez em que um personagem fizer um teste para agir em relação a essa informação, ele o faz com vantagem."],"st":"Acuidade +2 | Evasão +3","atk":"Cac (Acuidade) d8+6 de dano fís.","adv":"Vantagem ao distrair, enganar, localizar"},{"n":"Grande Predador","t":3,"ex":"(Lobo-atroz, tigre-dentes-de-sabre, velociraptor etc.)","ab":["*Ataque Voraz:* quando acerta um ataque em um alvo, você pode **gastar 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável* e receber um bônus de +1 em Proficiência nesse ataque.","*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta."],"st":"Força +2 | Evasão +2","atk":"Corpo a corpo (Força) d12+8 de dano fís.","adv":"Vantagem ao atacar, correr, mover-se furtivamente"},{"n":"Híbrido Lendário","t":3,"ex":"(Esfinge, grifo etc.)","ab":["*Habilidades Híbridas:* **marque 1 Ponto de Fadiga adicional** para se transformar nesta criatura. Escolha duas opções quaisquer de Forma de Fera de 1º a 2º patamar. Escolha um total de quatro vantagens e duas habilidades dessas opções."],"st":"Força +2 | Evasão +3","atk":"Corpo a corpo (Força) d10+8 de dano fís.","adv":""},{"n":"Lagarto Poderoso","t":3,"ex":"(Crocodilo, jacaré, monstro-de-gila etc.)","ab":["*Armadura Física:* você recebe um bônus de +3 em seus limiares de dano.","*Golpe Súbito:* quando acerta um ataque contra um alvo corpo a corpo, você pode **gastar 1 Ponto de Esperança** para segurá-lo com a mandíbula, deixando-o temporariamente *Imobilizado* e *Vulnerável*."],"st":"Instinto +2 | Evasão +1","atk":"Corpo a corpo (Instinto) d10+7 de dano fís.","adv":"Vantagem ao atacar, mover-se furtivamente, rastrear"},{"n":"Predador Aquático","t":3,"ex":"(Golfinho, orca, tubarão etc.)","ab":["*Aquático:* você pode respirar e se movimentar naturalmente embaixo d’água.","*Ataque Voraz:* quando acerta um ataque em um alvo, você pode **gastar 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável* e receber um bônus de +1 em Proficiência nesse ataque."],"st":"Agilidade +2 | Evasão +4","atk":"Cac (Agilidade) d10+6 de dano fís.","adv":"Vantagem ao atacar, nadar, rastrear"},{"n":"Caçador Aéreo Mítico","t":4,"ex":"(Dragão, pterodáctilo, roca, serpe etc.)","ab":["*Ave de Rapina Mortal:* você pode voar à vontade e se mover até um ponto em alcance distante como parte da sua ação. Quando ataca um alvo após se mover em linha reta até ficar corpo a corpo a ele a partir de próximo ou maior, você pode rolar novamente todos os dados de dano com um resultado menor que sua Proficiência.","*Besta de Carga:* você pode carregar até três aliados voluntários com você enquanto se movimenta."],"st":"Acuidade +3 | Evasão +4","atk":"Cac (Acuidade) d10+11 de dano fís.","adv":"Vantagem ao atacar, enganar, localizar, orientar-se"},{"n":"Fera Aquática Épica","t":4,"ex":"(Baleia, lula-gigante etc.)","ab":["*Mestre do Oceano:* você pode respirar e se movimentar naturalmente debaixo d’água. Quando acerta um ataque contra um alvo corpo a corpo, você pode deixá-lo temporariamente *Imobilizado*.","*Robusto:* quando for marcar Ponto de Armadura, role **1d6**. Em um resultado 5 ou mais, reduza a gravidade em um limiar sem marcar PA."],"st":"Agilidade +3 | Evasão +3","atk":"Cac (Agilidade) d10+10 de dano fís.","adv":"Vantagem ao intimidar, localizar, proteger, rastrear"},{"n":"Fera Massiva","t":4,"ex":"(Elefante, mamute, rinoceronte etc.)","ab":["*Besta de Carga:* você pode carregar até quatro aliados voluntários com você enquanto se movimenta.","*Demolir:* **gaste 1 Ponto de Esperança** para se mover até um ponto distante em linha reta e atacar todos os alvos corpo a corpo à linha. Alvos atingidos sofrem **d8+10** de dano físico usando sua Proficiência e ficam temporariamente *Vulneráveis*.","*Impávido:* você recebe um bônus de +2 em seus limiares de dano."],"st":"Força +3 | Evasão +1","atk":"Corpo a corpo (Força) d12+12 de dano fís.","adv":"Vantagem ao correr, intimidar, localizar, proteger"},{"n":"Fera Mítica","t":4,"ex":"(Aprimoramento de 1º ou 2º patamar)","ab":["*Evoluído:* escolha uma Forma de Fera de 1º ou 2° patamar e torne-se uma versão maior e mais poderosa dela. Enquanto estiver nessa forma, você mantém os atributos e habilidades da forma original e recebe os seguintes bônus: Bônus de +9 rolagens de dano; Bônus de +2 no atributo da forma; Bônus de +3 na Evasão; Seu dado de dano aumenta em um passo (d6 para d8, d8 para d10 etc.)."],"st":"","atk":"","adv":""},{"n":"Híbrido Mítico","t":4,"ex":"(Cocatriz, mantícora, quimera etc.)","ab":["*Habilidades Híbridas:* **marque 2 Ponto de Fadiga adicionais** para se transformar nesta criatura. Escolha duas opções quaisquer de Forma de Fera de 1º a 3º patamar. Escolha um total de cinco vantagens e três habilidades dessas opções."],"st":"Força +3 | Evasão +2","atk":"Corpo a corpo (Força) d12+10 de dano fís.","adv":""},{"n":"Lagarto Terrível","t":4,"ex":"(Braquiossauro, tiranossauro etc.)","ab":["*Disparada Massiva:* você pode se mover até um ponto em alcance distante sem precisar fazer uma teste. Você ignora terreno difícil (a critério do mestre) devido ao seu tamanho.","*Golpes Devastadores:* quando causa dano grave em um alvo corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para forçá-lo a marcar 1 PV adicional."],"st":"Força +3 | Evasão +2","atk":"Corpo a corpo (Força) d12+10 de dano fís.","adv":"Vantagem ao atacar, enganar, intimidar, rastrear"}],"rules":["**Evasão:** enquanto estiver transformado, você soma o bônus de Evasão da criatura à sua Evasão normal. Por exemplo, se sua Evasão é 8 e sua Forma de Fera diz “Evasão +2”, sua Evasão nessa forma se torna 10.","**Vantagens:** sua forma faz com que você seja melhor em determinadas ações. Ao fazer um teste ou teste de reação relacionado a um dos verbos listados no grupo criatura, você faz o teste com vantagem. Por exemplo, um Explorador Ágil tem vantagem em testes feitos para se mover furtivamente, localizar objetos e criaturas e atividades relacionadas.","**Habilidades:** cada forma tem habilidades exclusivas. Por exemplo, um Explorador Ágil é ótimo para movimentos rápidos e silenciosos, mas também é Frágil, o que torna você mais propenso a sair da Forma de Fera."],"guide":{"Bardo":{"quote":"Como bardo, você sabe como fazer as pessoas falarem, chamar a atenção para **gastar 2** **Pontos de Esperança** para rolar seu Dado de Esperança novamente.","ax":[],"ef":[],"tk":0},{"h":"Passo Cintilante","t":"uma vez por cena, você pode se teletransportar para um ponto distante que consiga ver.","ax":[{"k":"u","s":"D"}],"ef":[],"tk":0}]},{"n":"Goblin","ab":[{"h":"Passo Firme","t":"você ignora desvantagem em testes de Agilidade.","ax":[],"ef":[],"tk":0},{"h":"Cheiro de Perigo","t":"uma vez por descanso, **marque 1 Ponto de** **Fadiga** para forçar um adversário a fazer novamente um teste de ataque contra você ou um aliado muito próximo.","ax":[{"k":"f","n":1},{"k":"u","s":"D"}],"ef":[],"tk":0}]},{"n":"Pequenino","ab":[{"h":"Talismã da Sorte","t":"no início de cada sessão, todos os membros de seu grupo recebem 1 Ponto de Esperança.","ax":[],"ef":[],"tk":0},{"h":"Senso de Direção","t":"ao rolar 1 no Dado de Esperança, você pode rolá-lo novamente.","ax":[],"ef":[],"tk":0}]},{"n":"Humano","ab":[{"h":"Resiliência","t":"receba 1 Ponto de Fadiga adicional durante a criação de personagem.","ax":[],"ef":[{"k":"st","v":1,"lbl":"receba 1 Ponto de Fadiga adicional durante a criação de personagem.","p":0,"perm":1,"anyloc":1}],"tk":0},{"h":"Adaptabilidade","t":"ao rolar uma falha em um teste que usou uma de suas Experiências, você pode **marcar 1 Ponto de** **Fadiga** para fazer a rolagem novamente.","ax":[],"ef":[],"tk":0}]},{"n":"Infernis","ab":[{"h":"Destemido","t":"quando rolar com Medo, você pode **marcar 2** **Pontos de Fadiga** para rolar com Esperança em vez disso.","ax":[],"ef":[],"tk":0},{"h":"Aspecto Apavorante","t":"você tem vantagem em testes para intimidar criaturas hostis.","ax":[],"ef":[],"tk":0}]},{"n":"Katari","ab":[{"h":"Instinto Felino","t":"ao fazer uma teste de Agilidade, você pode **gastar 2 Pontos de Esperança** para rolar seu Dado de Esperança novamente.","ax":[],"ef":[],"tk":0},{"h":"Garras Retráteis","t":"faça um **teste de Agilidade** para arranhar um alvo corpo a corpo. Em um sucesso, ele fica temporariamente *Vulnerável*.","ax":[],"ef":[],"tk":0}]},{"n":"Orc","ab":[{"h":"Robusto","t":"quando você tem apenas 1 Ponto de Vida restante, ataques contra você têm desvantagem.","ax":[],"ef":[],"tk":0},{"h":"Presas","t":"quando acerta um ataque contra um alvo corpo a corpo, você pode **gastar 1 Ponto de Esperança** para perfurá- lo com suas presas, causando **1d6** de dano adicional.","ax":[{"k":"d","n":1,"die":6,"fl":0,"tp":"","m":null}],"ef":[],"tk":0}]},{"n":"Quacho","ab":[{"h":"Anfíbio","t":"você pode respirar e se movimentar naturalmente debaixo d’água.","ax":[],"ef":[],"tk":0},{"h":"Linguarudo","t":"você pode usar sua língua para agarrar coisas Próximas. **Marque 1 Ponto de Fadiga** para usá-la como uma arma de Acuidade com alcance próximo que causa **d12** de dano físico com sua Proficiência.","ax":[{"k":"d","n":1,"die":12,"fl":0,"tp":"físico","m":"P"},{"k":"f","n":1}],"ef":[],"tk":0}]},{"n":"Símio","ab":[{"h":"Escalador Natural","t":"você tem vantagem em testes de Agilidade envolvendo equilibrar-se e escalar.","ax":[],"ef":[],"tk":0},{"h":"Ágil","t":"você recebe um bônus permanente de +1 na Evasão durante a criação de personagem.","ax":[],"ef":[{"k":"ev","v":1,"lbl":"você recebe um bônus permanente de +1 na Evasão durante a criação de personagem.","p":0,"perm":1}],"tk":0}]}],"com":[{"n":"Desértica","ab":[{"h":"Oásis","t":"quando fizer um descanso curto, você ou um aliado podem rolar novamente um dos dados usados num movimento de repouso e usar o melhor resultado.","ax":[],"ef":[],"tk":0}]},{"n":"Livre","ab":[{"h":"Liberto","t":"uma vez por sessão, quando fizer uma rolagem com Medo, você pode transformar esse teste em uma rolagem com Esperança.","ax":[{"k":"u","s":"L"}],"ef":[],"tk":0}]},{"n":"Glacial","ab":[{"h":"Resistente","t":"ao fazer um descanso, você recupera 1 Ponto de Vida.","ax":[],"ef":[],"tk":0}]},{"n":"Rural","ab":[{"h":"Laços Fortes","t":"uma vez por descanso longo, você pode **gastar** **um número qualquer de Pontos de Esperança** para conceder a um aliado distante o mesmo número de Pontos de Esperança.","ax":[{"k":"u","s":"L"}],"ef":[],"tk":0}]},{"n":"Aristocrática","ab":[{"h":"Privilégio","t":"você tem vantagem em testes para se relacionar com nobres, negociar preços ou se aproveitar de sua reputação para conseguir o que quer.","ax":[],"ef":[],"tk":0}]},{"n":"Erudita","ab":[{"h":"Culto","t":"você tem vantagem em testes que envolvem cultura, história ou política de um lugar ou pessoa importante.","ax":[],"ef":[],"tk":0}]},{"n":"Disciplinada","ab":[{"h":"Princípios","t":"anote três ditados ou valores com os quais você cresceu. Uma vez por descanso, ao descrever como você incorpora um destes princípios na sua ação atual, você pode jogar **1d20** como seu Dado de Esperança.","ax":[{"k":"u","s":"D"}],"ef":[],"tk":0}]},{"n":"Solitária","ab":[{"h":"Família Escolhida","t":"uma vez por descanso, você pode **gastar 1** **Ponto de Esperança** para usar a Experiência de um aliado como se fosse sua. Ao fazer isso, descreva como seu tempo com aquele aliado preparou você para esse momento. Ao se juntar a uma nova comunidade, ou redescobrir sua comunidade antiga, você pode trocar permanentemente esta carta pela da carta da sua nova comunidade. *Quando escolher a comunidade solitária?* *Alguns jogadores podem querer escolher esta comunidade* *porque seus personagens foram expulsos ou partiram de casa* *voluntariamente. Embora tal escolha seja contemplada tanto* *pela mecânica quanto pela narrativa da carta, esta não é a* *única forma de contar esse arco narrativo no jogo.* *Muitas pessoas podem abandonar suas comunidades de* *origem ou alianças, seja por diferença de crenças ou por se* *mudar para outro lugar. Mesmo o desentendimento com entes* *queridos pode fazer alguém seguir com um novo rumo.* *Quando se abandona a cultura na qual foi criado, ela ainda* *permanece com o indivíduo, influenciando a maneira como ele* *interage com o mundo. Se você quiser construir um* *personagem que tenha se afastado das origens, talvez seja* *uma boa ideia usar a carta da comunidade que ele abandonou* *para interpretar como ele é afetado pelo atrito entre sua* *antiga cultura e seu novo modo de vida.* *Se optar por essa abordagem, você pode substituir sua carta* *de comunidade pela da comunidade solitária em um momento* *crucial de crescimento, simbolizando a nova forma como seu* *personagem vê o mundo e sua ruptura com a vida anterior. Se* *esse arco narrativo lhe agrada, converse com o mestre para* *definir como isso pode ser incorporado na campanha, tanto* *mecânica quanto narrativamente.*","ax":[{"k":"u","s":"D"}],"ef":[],"tk":0}]},{"n":"Montanhesa","ab":[{"h":"Firme","t":"você tem vantagem em testes para cruzar abismos e saliências, orientar-se em ambientes inóspitos e usar seus conhecimentos de sobrevivência.","ax":[],"ef":[],"tk":0}]},{"n":"Marítima","ab":[{"h":"Conhecer a Maré","t":"você pode sentir o fluxo da vida. Ao rolar com Medo, coloque 1 marcador na sua carta de comunidade. Você pode acumular um número de marcadores igual ao seu nível. Antes de fazer um teste, gaste um número qualquer desses marcadores para receber um bônus de +1 a cada marcador gasto. No fim de cada sessão, marcadores não utilizados são perdidos.","ax":[],"ef":[],"tk":1}]},{"n":"Fora da Lei","ab":[{"h":"Malandro","t":"você tem vantagem em testes para negociar com criminosos, perceber mentiras ou encontrar um lugar seguro para se esconder.","ax":[],"ef":[],"tk":0}]},{"n":"Subterrânea","ab":[{"h":"Habituado à Penumbra","t":"você tem vantagem em testes para se esconder, investigar ou perceber detalhes em áreas de penumbra ou sombra forte.","ax":[],"ef":[],"tk":0}]},{"n":"Nômade","ab":[{"h":"Mochila de Nômade","t":"adicione uma mochila de nômade ao seu inventário. Uma vez por sessão, você pode **gastar 1 Ponto de** **Esperança** para tirar um item mundano e útil para a situação de dentro dela. Colabore com o mestre ao definir este item.","ax":[{"k":"u","s":"L"}],"ef":[],"tk":0}]},{"n":"Bélica","ab":[{"h":"Semblante Corajoso","t":"uma vez por sessão, quando tiver que marcar 1 PF, você pode **gastar 1 Ponto de Esperança** em vez disso.","ax":[{"k":"u","s":"L"}],"ef":[],"tk":0}]},{"n":"Silvestre","ab":[{"h":"Pés Leves","t":"seu movimento é naturalmente silencioso. Você tem vantagem em testes para se mover sem ser ouvido.","ax":[],"ef":[],"tk":0}]}],"mix":["Famílias no mundo de Daggerheart são tão únicas quanto os povos e culturas que o habitam. A aparência e os talentos de qualquer pessoa podem ser afetados por linhagem, magia, proximidade e diversos outros fatores. Se seu personagem descende de várias ancestralidades e você quiser representar isso mecanicamente, siga os passos abaixo.","**Passo 1: Combinação De Ancestralidades**","Ao escolher uma ancestralidade na criação de personagem, anote como seu personagem se vê na seção “histórico” da ficha. Por exemplo, sua ancestralidade pode ser “goblinorc”, “goblin (com sangue de orc) ” ou qualquer outro termo à sua escolha, como “prole das presas”.","**Passo 2: Habilidades De Ancestralidade**","Escolha, com o mestre, duas habilidades entre as fornecidas pelas ancestralidades do seu personagem. Você deve escolher a primeira habilidade de uma ancestralidade e a segunda da outra. Anote-as em um papel e deixe-o com suas cartas ou próximo à sua ficha de personagem. Por exemplo, se estiver criando um goblin-orc, você pode escolher Passo Firme e Presas, ou Robusto e Cheiro de Perigo. Não é possível escolher Passo Firme e Robusto. Se seu personagem tiver mais de duas ancestralidades, você só pode escolher habilidades de duas, mas pode representar outras ancestralidades por meio da sua aparência ou história."],"tf":[{"n":"Semideus","desc":["Semideuses são mortais que têm sangue divino correndo nas veias. Em geral, recebem seu poder por descendência divina, por terem realizado alguma grande façanha ou pela dádiva de algum deus. Muitos semideuses exibem a aparência de um membro típico da sua ancestralidade mortal, mas todos carregam uma luminosidade sutil e um brilho em seus olhos. São também conhecidos por terem pele perolada ou metálica, e podem crescer em tamanho ou adquirir características físicas relacionadas ao seu poder, quando este se revela. Como têm sangue de algum Deus Diáfano, Deus Esquecido, Novo Deus ou outra divindade, nenhum semideus é igual.","Semideuses carregam consigo uma fagulha de poder divino, mas nem tudo aquilo que eles herdam é uma dádiva. Embora muitas vezes se destaquem em tarefas adequadas às suas habilidades, as expectativas que existem a seu respeito são, frequentemente, muito difíceis de serem atendidas.","**Examinando a Divindade em Daggerheart**","Em *Daggerheart*, personagens podem receber poderes divinos de diferentes maneiras: por meio da ancestralidade, como aetheris ou infernis, descendentes distantes dos Deuses Diáfanos; por meio da comunidade, como um local disciplinado e religioso, inspirado pela fé; por meio da classe, como serafim ou ocultista, que serve a uma entidade sobrenatural; e também por meio de uma transformação, como semideus, que impõe uma penalidade pesada para contrabalançar as bênçãos divinas.","Um jogador pode, por exemplo, criar um aetheris semideus disciplinado ocultista servo do Colérico — assim, cada aspecto do seu personagem ficaria relacionado a uma fonte diferente de divindade."],"ab":[{"h":"Abençoado","t":"você recebe um bônus de +1 em testes comuns, testes de reação e rolagens de dano.","ax":[],"ef":[{"k":"bt","v":1,"dm":1,"lbl":"Você recebe um bônus de +1 em testes comuns, testes de reação e rolagens de dano.","p":0}],"tk":0},{"h":"Fardo da Divindade","t":"ao falhar em um teste, você deve marcar 1 Ponto de Fadiga ou o mestre recebe 1 Ponto de Medo.","ax":[],"ef":[],"tk":0}],"q":["Sua divindade afeta algum aspecto de sua aparência. De que maneira você é diferente dos demais?","Quem lhe concedeu o status de semideus e qual provação você superou para receber essa dádiva?","Seu parentesco divino era motivo de zombaria durante a infância. Por quê?","Por que o fato de você ser um semideus lhe foi ocultado por anos?","Quem guardava este segredo?","Você tem uma obrigação a ser cumprida por conta do sangue imortal que corre em suas veias. Qual?","De que maneira sua divindade se manifestou inicialmente?","Por que isso lhe surpreendeu?"]},{"n":"Fantasma","desc":["Fantasmas são espíritos de pessoas falecidas conectados ao Plano Mortal. Podem ser invocados após a passagem pelo véu da morte por meio de rituais de necromancia, experimentos alquímicos, o desespero de um ente querido… ou, talvez, nunca sequer tenham atravessado esse véu. Aqueles que se depararam com um fim terrível, foram vítimas de uma arma amaldiçoada ou morreram em locais de poder também podem acabar presos no Plano Mortal em vez de seguir adiante.","Por existirem no espaço entre vida e morte, fantasmas são capazes de se deslocar entre o físico e o espectral e, às vezes, atravessar objetos sólidos. Enquanto alguns fantasmas são quase indistinguíveis dos vivos, outros emanam auras espectrais, têm coloração desbotada ou exibem evidências físicas da causa de sua morte. Quando um fantasma se torna incorpóreo — algo que pode ocorrer por vontade própria, por emoções intensas ou sem motivo aparente —, pode ficar semitranslúcido, como uma leve névoa que poderia se dissipar ao vento.","Alguns fantasmas retornam em busca de vingança. Outros, para salvar um ente querido. Outros ainda, para cumprir alguma missão ou descobrir informações ocultas. A motivação para atingir seus objetivos é a força que os permite existir no Plano Mortal. Quando completam esse objetivo, seu trabalho é concluído e eles imediatamente atravessam o véu da morte."],"ab":[{"h":"Assuntos Inacabados","t":"converse com o mestre para decidir o propósito ou desejo que vincula você ao Plano Mortal. Quando tal pendência for encerrada, você atravessa o véu da morte.","ax":[],"ef":[],"tk":0},{"h":"Efêmero","t":"seu corpo oscila entre corpóreo e incorpóreo. Você é resistente a dano físico, sofre o dobro de dano mágico e pode **marcar 2 PF** para temporariamente atravessar um objeto sólido.","ax":[],"ef":[],"tk":0}],"q":["Como você morreu e quais medos isso incutiu em você?","O que trouxe você de volta de além do véu da morte?","Em vida, você amava muito uma pessoa. Por que você precisa reencontrá-la?","O que você precisa realizar agora que retornou ao Plano Mortal?","Como alcançará esse objetivo?","Quem lhe causou um mal na sua vida passada?","Como você planeja lidar com essa pessoa agora que retornou?","Você precisou sacrificar uma coisa importante para retornar ao Plano Mortal. Do que você abriu mão, e a quem você entregou?"]},{"n":"Reanimado","desc":["Reanimados são cadáveres que foram trazidos de volta à vida. Seja através de um feitiço, um ritual sagrado, experimentos arcanos ou outros métodos não naturais, estes mortais retornaram de além do véu da morte como mortos-vivos, agora presos ao seu corpo em decomposição. Quem foi reanimado há pouco tempo pode se assemelhar mais a um membro típico de sua ancestralidade. Contudo, com o passar do tempo, é necessário fazer reparos em seu corpo usando ossos, carne e outros materiais extraídos de cadáveres frescos. Enquanto alguns remendam suas feridas e necroses com agulhas, linhas e ervas, outros usam magia para incorporar esses materiais ao próprio corpo.","Diversas histórias sobre reanimados os descrevem como tendo maior resistência ou, em determinados casos, imunidade a dor. Isso talvez seja verdade para alguns reanimados, mas muitos experimentam um sofrimento prolongado — seja em virtude dos ecos físicos de sua morte, do desconforto de movimentar um corpo em decomposição, da dificuldade em controlar seus membros enxertados ou da angústia mental de ter sido trazido à força da morte para uma segunda vida."],"ab":[{"h":"Cadáver","t":"em um descanso, você só pode recuperar PV se tiver acesso aos restos mortais de uma criatura que tenha morrido recentemente. Descreva como você usa esses materiais na manutenção de seu cadáver.","ax":[],"ef":[],"tk":0},{"h":"Nunca Morre","t":"se falhar no movimento de morte **arriscar tudo**, você pode **marcar 1 Ponto de Vida permanentemente** em troca de obter sucesso. Ao fazer isso, você ainda usa o resultado do Dado de Esperança para recuperar PV e PF. Quando marcar permanentemente o seu último PV dessa forma, você atravessa o véu da morte.","ax":[],"ef":[],"tk":0}],"q":["Como você morreu pela primeira vez, e como essa morte afetou sua visão sobre a vida?","Uma memória da sua vida passada lhe assombra. Qual é e por que você o considera importante?","Você tinha um sonho de vida que agora acredita ser inalcançável. Qual era e por que você acha que ser um reanimado torna impossível realizá-lo?","Como você foi trazido de volta dos mortos e como o processo alterou seu corpo?","Alguém trouxe você de volta da morte. Quem é e como você se sente em relação a ela e ao que ela fez?","Em seu breve período além do véu da morte, você viu algo que mudou você para sempre. O que era?"]},{"n":"Metamorfo","desc":["Metamorfos são seres capazes de alterar sua forma física. Seja por terem nascido com essa habilidade, recebido-a por conta de uma magia ou maldição, ou mesmo através de alguma entidade sobrenatural, metamorfos têm uma relação singular com sua identidade. Uma vez que podem se transformar em qualquer ancestralidade — num momento, vivendo como uma pequena e ágil fada e, no próximo, como uma galapa grande e resistente —, a forma por meio da qual experimentam o mundo pode variar drasticamente de um dia para o outro.","Embora um metamorfo seja tipicamente indistinguível de qualquer outro membro da ancestralidade na qual se transforma, cada metamorfo tem uma característica imutável, independentemente da forma que assumirem, como os olhos, a coloração ou uma marca de nascença única. Eles não conseguem imitar a aparência de uma pessoa específica; apenas se transformam numa versão diferente de si mesmos, em um novo corpo.","Assumir uma nova forma também não permite que tenham, ou utilizem, todas as novas características de imediato — precisam concentrar seus esforços nos aspectos físicos que mais desejam utilizar. Mesmo assim, metamorfos podem precisar de tempo para se ambientar à nova forma, o que pode fazer com que assumam uma aparência ou comportamento estranho até se acostumarem com seu corpo."],"ab":[{"h":"Mudar de Forma","t":"durante um descanso, você pode usar um movimento de repouso para trocar sua ancestralidade atual por outra. Ao fazer isso, descreva como sua aparência muda.","ax":[],"ef":[],"tk":0},{"h":"Superficial","t":"você recebe os benefícios de apenas uma das habilidades de sua ancestralidade atual. Esta habilidade deve ser escolhida no momento em que você assume a nova forma. Para escolher uma habilidade diferente de uma mesma ancestralidade, você precisa usar mais um movimento de repouso.","ax":[],"ef":[],"tk":0}],"q":["Você acredita possuir uma \"forma verdadeira\", mas nunca a viu. Como você acha que ela é, e como você sabe que ela existe?","Qual truque você desenvolveu para poder identificar outros metamorfos?","Alguém que você amava muito abandonou você ao descobrir sua capacidade de mudar de forma. Quem era essa pessoa, e o que aconteceu?","Qual forma você jurou jamais utilizar, e por quê?","Qual ancestralidade você mais utiliza em sua vida?","Por que você passa tanto tempo nessa forma?","Alguém que você conhece sempre é capaz de reconhecer você, independentemente de sua forma. Como essa pessoa explica essa capacidade, e o que essa familiaridade significa para você?"]},{"n":"Vampiro","desc":["Vampiros são mortos-vivos de presas afiadas que se alimentam do sangue dos vivos. Não nascem, são criados — convertidos por outro vampiro, através de uma mordida e da troca de sangue; transformados por meio de um ritual oculto; ou de outros métodos misteriosos. Para se tornar um vampiro, é preciso morrer e retornar como uma entidade sobrenatural. Por isso, vampiros precisam sorver o sangue — a essência da vida — dos outros para sobreviver.","À primeira vista, muitos vampiros são indistinguíveis de membros típicos de sua ancestralidade. Além das presas óbvias, seu vampirismo pode afetá-los de várias maneiras, sejam sutis ou evidentes, com traços como pele pálida, veias visíveis, olhos que brilham no escuro ou, em alguns casos, beleza singular. Dependendo da natureza de sua origem vampírica, indivíduos podem parar de envelhecer no momento de sua transformação, permanecendo exuberantes e poderosos muito após seus semelhantes terem sucumbido à inclemência do tempo. Independentemente de sua aparência, todos os vampiros têm habilidades aprimoradas e que podem causar um fim tenebroso para seus alvos."],"ab":[{"h":"Presas","t":"faça um ataque usando um atributo à sua escolha para morder um alvo em alcance corpo a corpo. Se acertar, cause **d6** pontos de dano físico com sua Proficiência.","ax":[{"k":"d","n":1,"die":6,"fl":0,"tp":"físico","m":"P"}],"ef":[],"tk":0},{"h":"Alimentação","t":"quando acertar um ataque com suas “Presas” contra uma criatura que tem sangue, você pode **marcar 1 PF** para se alimentar. Coloque um número de marcadores nesta carta igual ao número de PV marcados pelo alvo (máximo de 6 marcadores por vez). Antes de um teste qualquer, você pode gastar um marcador para transformar seu Dado de Medo em **d20**. Quando fizer um descanso longo, remova um marcador. Se não houver nenhum marcador sobre esta carta, todos os seus testes são feitos com desvantagem.","ax":[],"ef":[],"tk":1}],"q":["Quem você precisou abandonar ao se tornar um vampiro e por que foi tão difícil?","Certa vez, você matou um inocente para consumir seu sangue. Qual característica daquela pessoa você mais percebe nos outros?","Seu vampirismo tornou você especialmente vulnerável a algo. O quê?","Quem você foi capaz de salvar graças aos seus poderes vampíricos?","O que aconteceu, e como essa pessoa se sente em relação a você?","Como sua sede de sangue afeta você?","O vampiro responsável pela sua transformação ainda tem poder sobre você. Quem ele é e que tarefa deseja que você realize?"]},{"n":"Lobisomem","desc":["Lobisomens são seres que se transformam em lobos grandes e sobrenaturais. Enquanto alguns já nascem como lobisomens, outros adquirem esta transformação graças a uma maldição, a uma infecção causada pela mordida de outro lobisomem ou a outra causa não natural. Até o momento em que se transformam, lobisomens são parecidos com membros típicos de sua ancestralidade. Alguns podem inclusive tomar uma forma que mistura os traços de sua ancestralidade com aspectos lupinos. Há histórias que descrevem lobisomens se transformando de acordo com as fases da lua, embora a experiência de cada indivíduo com tais mudanças varie conforme a causa de sua transformação.","Na forma lupina, lobisomens costumam enfrentar dificuldades para controlar seu instinto caçador e temperamento violento, despendendo autodisciplina e energia — ou fugir e se isolar — para evitar ferir seus entes queridos. Quanto mais tempo e experiência um lobisomem tem com sua condição, maiores as chances dele ter desenvolvido formas de se controlar.","**Jogando com outros licantropos**","Converse com o mestre caso deseje criar um personagem que se transforme em outro tipo de licantropo. Muitos animais, especialmente predadores, podem ser usados facilmente, em vez de lobos, e ainda manter as habilidades \"Forma de Lobo\" e \"Fúria Uivante\"."],"ab":[{"h":"Forma de Lobo","t":"ao marcar 1 PV ou mais, você pode **marcar 1** **PF** para se metamorfosear na Forma de Lobo. Enquanto estiver nesta forma, você recebe **+1d10** em testes de ataque e rolagens de dano. Se receber Pontos de Esperança na Forma de Lobo, você também deve marcar uma quantidade equivalente de PF. Sua Forma de Lobo dura até você entrar em \"Fúria Uivante\" ou até o próximo descanso.","ax":[],"ef":[],"tk":0},{"h":"Fúria Uivante","t":"ao marcar seu último Ponto de Fadiga enquanto estiver na Forma de Lobo, você entra em fúria. Role um número de **d20** igual ao seu patamar e cause pontos de dano físico equivalentes ao resultado em todas as criaturas muito próximas. Depois, abandone sua Forma de Lobo.","ax":[],"ef":[],"tk":0}],"q":["Alguém está caçando você. Quem é essa pessoa e por que ela deseja sua morte?","Do que você tinha medo antes de virar um lobisomem e como seus novos poderes afetaram esse sentimento?","Você escuta seu lobo interior em sua mente, como uma entidade separada. Que mentira ele conta a seu respeito e por que você está começando a acreditar?","O que levou você a matar uma pessoa amada quando estava tomado pela fúria?","Quem amaldiçoou você a se tornar um lobisomem?","Certa vez, você foi convidado a se juntar a uma alcateia de lobisomens. Como você respondeu a isso? estão usando espadas longas”, mas, às vezes, ele pode pedir um teste para determinar a resposta: “está escuro e chovendo, então vamos ver se você consegue saltar a fenda sem problemas. Faça um teste de Agilidade, Dificuldade 11”. Na sua vez, o mestre faz perguntas ao jogadores e se baseia nas respostas para criar a ficção: “como você consegue se esgueirar com tanto cuidado?” acampamento que vocês montaram?” escalar a parede em segurança — o que fez a escalada ser mais fácil do que o esperado?” estas interações criam uma conversa colaborativa com a qual todos podem contribuir de forma significativa ao construir a ficção. Para aqueles que já estão acostumados com RPGs, o ritmo de jogo pode surgir com mais naturalidade, mas, se for uma experiência nova para você, talvez não seja tão natural assim. Os passos a seguir ajudam a delinear o ciclo de jogo que guia todas as sessões. Este ciclo de jogo será descrito em mais detalhes nas próximas páginas."]}],"tfrules":["*Transformações são mudanças específicas ou melhorias para* *os personagens de Daggerheart, no*","*geral obtidas por meio de magia.*","Transformações são uma mudança fundamental no personagem e na forma como ele interage com o mundo. São aspectos opcionais da sua identidade que podem ser concedidos pelo mestre durante a campanha, como parte da narrativa, ou que podem ser uma opção da criação de personagem.","Elas concedem tanto um benefício mecânico quanto uma desvantagem. Receber uma carta de transformação exige que você se comprometa com esse conceito, assumindo um fardo para usufruir do seu benefício. Por isso, recomendamos que você relembre o mestre dos efeitos negativos de sua transformação sempre que eles forem relevantes para todos os envolvidos e para a narrativa da transformação.","Assim como cartas de ancestralidade e de comunidade, cartas de transformação não contam no limite de cartas de domínio da sua mão. Quando seu personagem recebe uma transformação, adicione a carta à sua mão, como parte da herança de seu personagem. Pense em como essa transformação o altera de maneira física e psicológica — se precisar de inspiração, confira as perguntas de cada transformação.","Embora algumas transformações ofereçam poderes expandidos ou implicações narrativas únicas, a menos que seja explicitamente indicado em suas habilidades, nenhuma transformação impede que você sofra dano ou que realize movimentos de morte. Se houver detalhes que você gostaria de incorporar em seu personagem, mas estão além das habilidades de uma carta de transformação, converse com o mestre para ver como eles poderiam se manifestar na narrativa da sua campanha.","Um personagem só pode ter uma transformação.","**Concedendo Transformações**","Mestres devem discutir as transformações com os jogadores antes de incorporá-las à sua campanha, pois afetam a jornada narrativa de um personagem de maneira profunda. O melhor é garantir que este aspecto de jogo contribuirá com a história que os jogadores querem contar e que é algo que eles gostam.","Algumas das transformações apresentadas são fáceis de introduzir numa campanha como parte do desenvolvimento narrativo. Em vampiro ou lobisomem, por exemplo, podem ser obtidas quando um vilão principal da campanha realiza um ataque significativo em alguém. Um personagem que se transforme em reanimado ou fantasma pode ter morrido em um local repleto de magia ou feito uma barganha que alterou sua história em troca de ressurreição. Essas transformações também podem integrar a criação do personagem: ele já pode ter nascido como lobisomem e busca controlar esse aspecto de sua linhagem; ou, talvez, seja o fantasma de alguém que morreu há muito tempo e, agora, assombra o grupo.","Algumas transformações são mais fáceis de incorporar na criação de personagem, como metamorfo ou semideus. Mas elas ainda podem ser introduzidas como uma reviravolta para o personagem durante a campanha. Cabe ao grupo decidir quais transformações estarão disponíveis na criação de personagem e como elas ficam acessíveis durante o jogo — decidam o que funciona melhor para mestre e jogadores, assim como para a história que vocês estão contando juntos."],"hopeText":{"Caçador de Sangue":"Maldição de Sangue: gaste 3 Pontos de Esperança quando um adversário for bem-sucedido em um teste de ataque em alcance próximo para fazê-lo rolar novamente com desvantagem.","Invocador":"Auxílio dos Espíritos: gaste 3 Pontos de Esperança para invocar auxílio sobrenatural. Distribua 2 Pontos de Esperança entre um ou mais outros PJs em alcance distante, e você limpa 1 Ponto de Fadiga."},"voidcls":["Caçador de Sangue","Invocador"],"voidcls_info":"O Void é um conjunto de conteúdo experimental (playtest) do Daggerheart. Esta é a versão de 2026-07-09 e ela pode mudar a qualquer momento. A tradução para o português segue a terminologia do SRD e não é oficial."};

function fichaHTML(d){const k=C[S.cls],a=af(S.arm),g=DB.guide[S.cls];
