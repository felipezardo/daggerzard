<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d9dc;--pg:#fff;--ink:#222;--mut:#666;--dk:#454548;--md:#a9a9ad;--ln:#9a9a9f;--ac:#c9a227;--fr:#7a2b83;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--pg:#232327;--ink:#eee;--mut:#aaa;--dk:#5a5a60;--md:#3a3a3f;--ln:#6a6a70}}
:root[data-theme=dark]{--bg:#17171a;--pg:#232327;--ink:#eee;--mut:#aaa;--dk:#5a5a60;--md:#3a3a3f;--ln:#6a6a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px Barlow,system-ui,sans-serif}
h1,h2,h3,.t{font-family:Montserrat,system-ui,sans-serif;text-transform:uppercase;margin:0}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--dk);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
nav button{background:none;border:0;color:#fff;padding:8px 14px;font:800 12px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:.25s;white-space:nowrap}
nav button:hover{background:#ffffff22}nav button.on{background:#fff;color:#222}
.pg{max-width:1100px;margin:14px auto;padding:0 12px 80px}
.sheet{background:var(--pg);border-radius:10px;box-shadow:0 6px 30px #0003;overflow:hidden}
.hd{display:flex;background:linear-gradient(105deg,var(--dk) 0 34%,var(--md) 34.1%);flex-wrap:wrap}
.hd .ti{padding:16px 22px;color:#fff;min-width:240px;flex:1}.hd .ti h1{font-size:26px;letter-spacing:.02em}.hd .ti small{opacity:.85;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.hd .f{flex:3;display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;padding:10px;min-width:280px}
.lbl{font:800 9px Montserrat,sans-serif;text-transform:uppercase;color:var(--mut);display:block;margin:0 0 2px 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--pg);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #c9a22744}
.at{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px;border-bottom:1px solid var(--ln)}
.atr{text-align:center;position:relative;cursor:pointer;transition:.25s}.atr:hover{transform:translateY(-4px)}
.atr .n{background:var(--dk);color:#fff;font:800 10px Montserrat;text-transform:uppercase;border-radius:4px;padding:4px;display:flex;justify-content:space-between;align-items:center}
.atr .v{font:800 34px Montserrat;border:2px solid var(--dk);border-radius:14px 14px 22px 22px;margin:3px 0;padding:6px;background:var(--pg)}
.atr .m{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}.atr .m.on{background:var(--ac)}
.atr small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
.cols{display:grid;grid-template-columns:1fr 1.4fr}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.col{padding:12px;display:flex;flex-direction:column;gap:12px}
.bx{border:2px solid var(--ln);border-radius:14px;padding:26px 12px 12px;position:relative}
.bx>h3{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);background:var(--pg);border:2px solid var(--ln);border-radius:20px;padding:3px 22px;font-size:12px;white-space:nowrap}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.pip{width:26px;height:20px;border:2px solid var(--dk);border-radius:6px;cursor:pointer;transition:.2s;flex:none}.pip:hover{transform:scale(1.15)}
.pip.on{background:var(--dk);animation:pop .3s}.pip.ex{border-style:dashed;opacity:.55}.pip.h{border-radius:50%;width:26px;height:26px}.pip.h.on{background:var(--ac);border-color:var(--ac)}
.pip.a{border-radius:4px 4px 12px 12px;width:20px;height:24px}
@keyframes pop{50%{transform:scale(1.4)}}@keyframes in{from{opacity:0;transform:translateY(16px)}}
.in{animation:in .5s both}.dm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.dm div{background:var(--dk);color:#fff;border-radius:8px;padding:6px 2px;font:800 11px Montserrat;text-transform:uppercase}.dm b{display:block;font-size:20px}
.btn{background:var(--dk);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:800 11px Montserrat;text-transform:uppercase;cursor:pointer;transition:.2s;flex:none}
.btn:hover{filter:brightness(1.3);transform:translateY(-2px)}.btn.g{background:var(--ac);color:#222}.btn.x{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.card{background:var(--pg);border:2px solid var(--dk);border-radius:14px;padding:12px;transition:.3s;position:relative;animation:in .4s both}.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 12px 24px #0004}
.card .dom{font:800 10px Montserrat;text-transform:uppercase;color:#fff;background:var(--dk);display:inline-block;padding:2px 8px;border-radius:10px}
.card .lv{position:absolute;top:8px;right:10px;font:800 20px Montserrat;color:var(--ac)}
.tag{font-size:12px;color:var(--mut)}
#dr{position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--pg);box-shadow:-8px 0 30px #0005;transform:translateX(105%);transition:.4s;z-index:20;padding:18px;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}#dr.o{transform:none}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;background:var(--ac);border:0;font:800 13px Montserrat;cursor:pointer;box-shadow:0 6px 18px #0006;transition:.3s}#fab:hover{transform:rotate(20deg) scale(1.1)}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}#ov.o{display:flex}
.rs{background:var(--pg);border-radius:18px;padding:22px;text-align:center;max-width:420px;width:100%;animation:in .3s both}
.dc{display:flex;gap:16px;justify-content:center;margin:14px 0}.d{width:92px;height:92px;display:flex;align-items:center;justify-content:center;font:800 36px Montserrat;color:#fff;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.d.h{background:linear-gradient(135deg,#d4a90f,#8d6d00)}.d.f{background:linear-gradient(135deg,var(--fr),#341038)}.d.s{background:#666;width:60px;height:60px;font-size:22px}
.d.roll{animation:tum .12s linear infinite}@keyframes tum{to{transform:rotate(360deg) scale(.9)}}
.big{font:800 46px Montserrat}.out{font:800 15px Montserrat;text-transform:uppercase;letter-spacing:.08em;animation:pop .5s}
.lg{border-top:1px solid var(--ln);padding:8px 0;font-size:13px;animation:in .3s both}
.opt{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--ln);border-radius:10px;margin:6px 0}.opt span{flex:1}
.opt b{min-width:22px;text-align:center}.sm{padding:2px 10px}
.dchip{display:inline-flex;align-items:center;font:800 9px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;border-radius:10px;padding:2px 8px;margin:0 4px 2px 0}.dd{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 0;vertical-align:baseline;box-shadow:0 0 0 2px #ffffff55}.hd .ti{position:relative}.cbar{position:absolute;left:0;right:0;bottom:0;height:4px}
nav button.on{box-shadow:inset 0 -3px 0 var(--c1,#c9a227)}.card .lv{color:var(--dc,var(--ac))}.chc:before{content:"";display:block;height:5px;background:var(--g,var(--ac))}.mcb:before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:4px;border-radius:0 0 4px 4px;background:var(--g)}.bx.mcb{border-color:transparent;box-shadow:0 0 0 2px var(--ln)}
#app.noanim *{animation:none!important}
.thr{display:flex;align-items:flex-start;gap:0}.thc{flex:1;text-align:center}.thc small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.tb{background:var(--dk);color:#fff;padding:9px 4px;border-radius:6px}.tb b{font:800 11px/1.15 Montserrat,sans-serif;text-transform:uppercase}

.vd{display:inline-block;background:linear-gradient(90deg,#7a1f2b,#b3283d);color:#fff;font:800 9px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;border-radius:10px;padding:3px 9px;margin:4px 6px 0 0;cursor:pointer;vertical-align:middle;animation:vdp 2.4s infinite}.vd.sm{padding:2px 7px;margin-left:4px;font-size:8px}@keyframes vdp{0%,100%{box-shadow:0 0 0 0 #b3283d66}50%{box-shadow:0 0 0 6px #b3283d00}}
.hd .ti .vd{display:table}
.vdn{border:1px dashed #b3283d;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13px;background:#b3283d14;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}.entc{border:2px solid var(--dk);border-radius:50% 50% 22px 22px / 30% 30% 22px 22px;padding:8px 6px;text-align:center;transition:.3s}.entc:hover{transform:translateY(-3px)}.entc.off{opacity:.35}.ento{font:800 30px Montserrat,sans-serif}

.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:20px}
.chc{border:2px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--pg);display:flex;flex-direction:column;transition:.3s;animation:in .5s both}
.chc:hover{transform:translateY(-6px);box-shadow:0 14px 30px #0004;border-color:var(--ac)}
.chp{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--dk),#1d1d20);cursor:pointer;overflow:hidden;border-radius:0 0 26px 26px}
.chp img,.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.5s}
.chc:hover .chp img{transform:scale(1.07)}
.chp .pi,.pt .pi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 64px Montserrat;color:#ffffff55}
.chp em{position:absolute;left:0;right:0;bottom:-44px;text-align:center;background:#000b;color:#fff;font:800 12px Montserrat;text-transform:uppercase;padding:10px;transition:.3s;font-style:normal}.chc:hover .chp em{bottom:0}
.chi{padding:12px}.chi h3{font-size:16px;margin:0 0 2px}

.abx{border:1px solid var(--ln);border-radius:12px;padding:12px;transition:.2s}.abx:hover{border-color:var(--ac)}
.swt{width:38px;height:20px;border-radius:12px;border:2px solid var(--dk);background:transparent;position:relative;cursor:pointer;flex:none;transition:.25s;padding:0}.swt:before{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--dk);transition:.25s}.swt.on{background:var(--ac);border-color:var(--ac)}.swt.on:before{left:20px;background:#222}
.eff{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px}.efp{border-top:1px dashed var(--ln);margin-top:8px;padding-top:6px}.off{opacity:.45}.abar{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}.card.vault{border-style:dashed}
.flash{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--dk);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;font-size:14px}.flash.o{opacity:1;transform:translate(-50%,0)}
.fxc{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.fxc span{font-size:11px;background:#c9a22733;border-radius:8px;padding:1px 7px}
#fab{z-index:25!important}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pc{border:2px solid var(--ln);border-radius:12px;padding:10px;cursor:pointer;transition:.2s;animation:in .3s both}.pc:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 6px 16px #0003}.pc.sel{border-color:var(--ac);background:#c9a22722}.pc.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 16px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chip{border:1px solid var(--ln);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;transition:.2s}.chip:hover{border-color:var(--ac)}.chip.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.li{margin:2px 0 2px 16px;position:relative}.li:before{content:"▪";position:absolute;left:-14px}
.bxs{display:inline-flex;gap:3px;flex:none}.bxs i{width:16px;height:16px;border:2px solid var(--dk);border-radius:4px;display:inline-block;transition:.2s}.bxs i.on{background:var(--dk)}
.card.own{opacity:.6}.card.lock{opacity:.5}.lock{opacity:.5}.card p{margin:4px 0;font-size:13px}.card{min-width:0}
.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
</style></head><body>

const DB={"cards":[{"d":"Arcano","n":"Caminhar na Parede","t":"Feitiço","l":1,"c":1,"x":["**Gaste 1 Ponto de Esperança**: uma criatura tocada por você pode escalar paredes e tetos como se estivesse caminhando em terra firme. Esse efeito dura até o fim da cena ou até você conjurar Caminhar na Parede novamente."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Arcano","n":"Caos Liberto","t":"Feitiço","l":1,"c":1,"x":["No início da sessão, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta.","Faça um **teste de conjuração** contra um alvo distante e gaste qualquer número de marcadores para canalizar energia bruta de seu interior e liberá-la contra ele. Em um sucesso, role uma quantidade de **d10** igual ao número de marcadores que gastou e cause o resultado deles como dano mágico ao alvo. **Marque 1 Ponto de Fadiga** para recarregar esta carta com marcadores (até uma quantidade igual ao seu atributo de conjuração).","No fim de cada sessão, marcadores não utilizados são perdidos."],"ax":[[{"k":"tk","a":"C"}],[{"k":"f","n":1}],[]],"ef":[],"tk":1},{"d":"Arcano","n":"Proteção Rúnica","t":"Feitiço","l":1,"c":0,"x":["Você tem um talismã pessoal que pode ser infundido com magia protetora e usado por você ou por um aliado. Descreva o que esse item é e por que ele é importante para você. O portador da proteção pode gastar 1 Ponto de Esperança para reduzir o dano sofrido em **1d8**.","Se tirar 8 nesse dado, o poder da Proteção Rúnica se encerra após reduzir dano neste turno. Ela pode ser recarregada sem custo no seu próximo descanso."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Arcano","n":"Incendiar","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo corpo a corpo. Em um sucesso, o alvo instantaneamente irrompe em chamas, sofre **1d20+3** de dano mágico e fica temporariamente *Em Chamas*.","Quando uma criatura *Em Chamas* age, ela sofre **2d6** de dano mágico adicional se ainda estiver *Em Chamas* no fim da ação dela."],"ax":[[{"k":"d","n":1,"die":20,"fl":3,"tp":"mágico","m":null}],[{"k":"d","n":2,"die":6,"fl":0,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"d":"Arcano","n":"Olho Flutuante","t":"Feitiço","l":2,"c":0,"x":["**Gaste 1 Ponto de Esperança** para criar um pequeno orbe flutuante que você pode mover para um ponto qualquer em alcance muito distante. Enquanto este feitiço estiver ativo, você pode ver pelo orbe como se estivesse onde ele está. Você pode escolher entre usar seus próprios sentidos ou os do orbe como quiser. Se o orbe sofrer dano ou sair do alcance, o feitiço termina.","• *10*"],"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Arcano","n":"Contramágica","t":"Feitiço","l":3,"c":2,"x":["Você pode interromper um efeito mágico em andamento fazendo um teste de reação com seu atributo de conjuração. Em um sucesso, o efeito termina, quaisquer consequências são evitadas e esta carta vai para sua reserva."],"ax":[[]],"ef":[],"tk":0},{"d":"Arcano","n":"Voo","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, coloque um número de marcadores igual à sua Agilidade nesta carta (mínimo de 1). Ao fazer um teste enquanto estiver voando, gaste um marcador desta carta. Após terminar a ação que consumiu o último marcador, você desce para o solo diretamente abaixo de você."],"ax":[[{"k":"c","dif":15}]],"ef":[],"tk":1},{"d":"Arcano","n":"Impacto Defensivo","t":"Feitiço","l":4,"c":2,"x":["Faça um **teste de conjuração** contra todos os alvos corpo a corpo. Alvos atingidos são empurrados para um ponto qualquer em alcance distante e sofrem **d8+3** de dano mágico usando seu atributo de conjuração."],"ax":[[{"k":"d","n":1,"die":8,"fl":3,"tp":"mágico","m":"C"}]],"ef":[],"tk":0},{"d":"Arcano","n":"Translocação","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração (12)**. Em um sucesso, **gaste 1 Ponto de Esperança** para se teleportar a um ponto que você possa ver em alcance distante. Se houver criaturas voluntárias Muito Próximas, **gaste 1 Ponto de Esperança adicional** para cada criatura que quiser levar consigo."],"ax":[[{"k":"c","dif":12},{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Arcano","n":"Corrente de Relâmpagos","t":"Feitiço","l":5,"c":1,"x":["**Marque 2 Pontos de Fadiga** para fazer um **teste de conjuração** e liberar relâmpagos em cadeia contra todos os alvos próximos. Alvos atingidos devem fazer um teste de reação com Dificuldade igual ao resultado de seu teste de conjuração. Se falharem, sofrem **2d8+4** de dano mágico. Adversários adicionais que não tenham sido alvo da Corrente de Relâmpagos e estejam próximos dos alvos que sofreram dano também devem fazer um teste de reação. Se falharem, sofrem **2d8+4** de dano mágico. A corrente continua até não haver mais adversários no alcance."],"ax":[[{"k":"d","n":2,"die":8,"fl":4,"tp":"mágico","m":null},{"k":"f","n":2}]],"ef":[],"tk":0},{"d":"Arcano","n":"Premonição","t":"Feitiço","l":5,"c":2,"x":["Você pode canalizar energia arcana para ter visões do futuro. Uma vez por descanso longo, imediatamente após o mestre apresentar as consequências de um teste que você fez, você pode ignorar esse movimento e suas consequências como se elas não tivessem acontecido e fazer outro movimento no lugar."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Arcano","n":"Fenda Espacial","t":"Feitiço","l":6,"c":2,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, você faz uma marca arcana no solo onde está no momento. Na próxima vez que você conjurar Fenda Espacial, abre-se um portal que fornece passagem segura para o ponto exato onde a marca foi colocada. A fenda permanece aberta até você fechá-la ou até conjurar outro feitiço.","Você pode cancelar o feitiço a qualquer momento para conjurar Fenda Espacial novamente e marcar outro lugar."],"ax":[[{"k":"c","dif":15}],[]],"ef":[],"tk":0},{"d":"Arcano","n":"Telecinese","t":"Feitiço","l":6,"c":0,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, você pode usar sua mente para movê-lo para um ponto qualquer em alcance distante relativo à posição inicial dele. Você também pode arremessá-lo como um ataque, fazendo um teste de conjuração adicional contra o alvo desse ataque. Em um sucesso, você causa **d12+4** de dano físico ao segundo alvo com sua Proficiência. Depois disso, o feitiço acaba."],"ax":[[{"k":"d","n":1,"die":12,"fl":4,"tp":"físico","m":null}]],"ef":[],"tk":0},{"d":"Arcano","n":"Dom Arcano","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio Arcano, receba os seguintes benefícios:","• Bônus de +1 em testes de conjuração;","• Uma vez por descanso, você pode trocar os resultados dos Dados de Esperança e Medo um pelo outro."],"ax":[[],[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Arcano","n":"Ocultação","t":"Feitiço","l":7,"c":2,"x":["Ao ter sucesso em um **teste de conjuração** para conjurar um feitiço diferente, você pode **gastar 1 Ponto de Esperança** para ficar *Oculto*. Enquanto estiver *Oculto*, quando um adversário se movimentar para um lugar de onde normalmente veria você, ele não pode vê-lo se você estiver parado. Ao entrar ou se movimentar dentro da linha de visão de um adversário, ou ao atacar, você deixa de estar *Oculto*."],"ax":[[]],"ef":[],"tk":0},{"d":"Arcano","n":"Aura de Confusão","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, você cria uma camada ilusória sobre seu corpo, que torna difícil distinguir exatamente onde você está. **Marque um número qualquer de Pontos de Fadiga** e crie uma quantidade de camadas igual aos PF marcados. Quando um adversário ataca você, role um número de **d6** igual à quantidade de camadas que tem no momento. Se tirar 5 ou mais em qualquer dado, uma camada da aura é destruída e o ataque falha. Se todos os resultados forem 4 ou menos, você sofre o dano e o feitiço termina."],"ax":[[{"k":"c","dif":14},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Arcano","n":"Reflexo Arcano","t":"Feitiço","l":8,"c":1,"x":["Quando for sofrer dano mágico, você pode **gastar qualquer quantidade de Pontos de Esperança** e rolar um número equivalente de **d6**. Se tirar 6 em qualquer um desses dados, o ataque é refletido e, em vez de causar dano a você, causa dano ao atacante."],"ax":[[]],"ef":[],"tk":0},{"d":"Arcano","n":"Projeção Sensorial","t":"Feitiço","l":9,"c":0,"x":["Uma vez por descanso, faça um **teste de conjuração (15)**. Em um sucesso, você entra numa visão que lhe permite ver e ouvir claramente qualquer lugar onde já esteve anteriormente, como se estivesse lá no momento. Você pode se mover livremente dentro da visão, sem sofrer as restrições físicas de ter um corpo material. Este feitiço não pode ser detectado por meios mágicos ou mundanos. Você sai da visão ao sofrer dano ou ao conjurar outra magia."],"ax":[[{"k":"c","dif":15},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Arcano","n":"Terremoto","t":"Feitiço","l":9,"c":2,"x":["Faça um teste de conjuração (16). Uma vez por descanso, em um sucesso, todos os alvos Muito distantes que não estiverem voando devem fazer um teste de reação (18). Quem falhar sofre **3d10+8** de dano físico e fica temporariamente *Vulnerável*. Quem passar sofre metade do dano.","Além disso, quando você tem sucesso no teste de conjuração, o terreno dentro do alcance muito distante torna-se difícil e as estruturas dentro desse alcance podem ser danificadas ou desmoronar completamente."],"ax":[[{"k":"c","dif":16},{"k":"d","n":3,"die":10,"fl":8,"tp":"físico","m":null},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"d":"Arcano","n":"Ajustar Realidade","t":"Feitiço","l":10,"c":1,"x":["Quando você ou um aliado voluntário faz uma rolagem, você pode **gastar 5 Pontos de Esperança** para mudar o resultado para um à sua escolha — ele deve ser plausível dentro das possibilidades fornecidas pelos dados."],"ax":[[]],"ef":[],"tk":0},{"d":"Arcano","n":"Chuva Arcana","t":"Feitiço","l":10,"c":1,"x":["Faça um **teste de conjuração** contra todos os adversários distantes. **Marque uma quantidade qualquer de Pontos de Fadiga** para fazer chover fragmentos arcanos. Alvos atingidos sofrem **1d20+2** de dano mágico para cada PF marcado."],"ax":[[{"k":"d","n":1,"die":20,"fl":2,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Levante-Se","t":"Talento","l":1,"c":1,"x":["Ao sofrer dano grave, você pode **marcar 1 Ponto de Fadiga** para reduzir a gravidade em um limiar."],"ax":[[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Não o Suficiente","t":"Talento","l":1,"c":1,"x":["Ao rolar dados de dano, você pode rolar novamente quaisquer resultados 1 ou 2."],"ax":[[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Turbilhão","t":"Talento","l":1,"c":0,"x":["Quando acerta um ataque contra um alvo muito próximo, você pode **gastar 1 Ponto de Esperança** para usar este ataque contra todos os outros alvos muito próximos. Todos os adversários adicionais que você acertar ao usar este talento sofrem metade do dano."],"ax":[[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Ataque Imprudente","t":"Talento","l":2,"c":1,"x":["**Marque 1 Ponto de Fadiga** para receber vantagem em um teste de ataque."],"ax":[[{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Fraternidade Marcial","t":"Talento","l":2,"c":1,"x":["Uma vez por descanso longo, ao elogiar ou perguntar algo que alguém faz bem, vocês recebem 3 Pontos de Esperança."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Mexa-Se","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso, quando uma criatura corpo a corpo for causar dano a você, você pode evitar o ataque e sair com segurança do alcance do inimigo."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Versatilidade","t":"Talento","l":3,"c":1,"x":["Em vez de usar o atributo requerido por uma arma equipada, você pode usar um atributo diferente. Ao causar dano, você pode **marcar 1 Ponto de Fadiga** para usar o valor máximo de um de seus dados de dano."],"ax":[[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Armadura Fortificada","t":"Talento","l":4,"c":0,"x":["Você recebe um bônus de +2 nos seus limiares de dano enquanto estiver usando armadura."],"ax":[[]],"ef":[{"k":"t","v":2,"lbl":"+2 nos limiares de dano enquanto estiver usando armadura.","p":0,"perm":1,"cond":"armor"}],"tk":0},{"d":"Lâmina","n":"Concentração Mortal","t":"Talento","l":4,"c":2,"x":["Uma vez por descanso, você pode se concentrar totalmente em um alvo à sua escolha, recebendo um bônus de +1 em sua Proficiência. Esse bônus dura até você derrotar o alvo, atacar outra criatura ou a batalha terminar."],"ax":[[{"k":"u","s":"D"}]],"ef":[{"k":"pr","v":1,"lbl":"Uma vez por descanso, você pode se concentrar totalmente em um alvo à sua escolha, recebendo um bônus de +1 em sua Proficiência.","p":0}],"tk":0},{"d":"Lâmina","n":"Vantagem do Campeão","t":"Talento","l":5,"c":1,"x":["Ao ter sucesso crítico em um ataque, você pode **gastar até 3 Pontos de Esperança** e escolher uma das opções a seguir para cada Ponto de Esperança gasto dessa forma:","• Você recupera 1 Ponto de Vida;","• Você recupera 1 Ponto de Armadura;","• O alvo deve marcar 1 PV adicional.","Você não pode escolher a mesma opção mais de uma vez."],"ax":[[],[],[],[],[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Vitalidade","t":"Talento","l":5,"c":0,"x":["Ao escolher esta carta, receba dois destes benefícios permanentemente:","• 1 PF adicional;","• 1 PV adicional;","• Bônus de +2 em seus limiares de dano.","Em seguida, coloque esta carta na sua reserva permanentemente."],"ax":[[],[],[],[],[]],"ef":[{"k":"st","v":1,"lbl":"+1 PF adicional (permanente).","p":1,"anyloc":1},{"k":"pv","v":1,"lbl":"+1 PV adicional (permanente).","p":1,"anyloc":1},{"k":"t","v":2,"lbl":"+2 nos limiares de dano (permanente).","p":1,"anyloc":1}],"tk":0},{"d":"Lâmina","n":"Calejado pela Batalha","t":"Talento","l":6,"c":2,"x":["Uma vez por descanso longo, quando for fazer um movimento de morte, você pode **gastar 1 Ponto de Esperança** para, em vez disso, recuperar 1 PV."],"ax":[[{"k":"gv","n":1},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Fúria","t":"Talento","l":6,"c":1,"x":["Antes de fazer um ataque, você pode **marcar 1 Ponto de Fadiga** para receber um bônus igual ao dobro de sua Força na rolagem de dano. Você pode ativar este talento duas vezes por ataque."],"ax":[[]],"ef":[{"k":"dm","v":1,"lbl":"Fúria: bônus igual ao dobro da Força na rolagem de dano.","p":0,"f":"at:1x2"}],"tk":0},{"d":"Lâmina","n":"Dom da Lâmina","t":"Talento","l":7,"c":1,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Lâmina, receba os seguintes benefícios:","• Bônus de +2 em testes de ataque;","• Bônus de +4 no seu limiar de dano grave."],"ax":[[],[],[]],"ef":[{"k":"ak","v":2,"lbl":"Bônus de +2 em testes de ataque;","p":1,"cond":"dom","perm":1},{"k":"tg","v":4,"lbl":"Bônus de +4 no seu limiar de dano grave.","p":2,"cond":"dom","perm":1}],"tk":0},{"d":"Lâmina","n":"Golpe de Raspão","t":"Talento","l":7,"c":1,"x":["Quando erra um ataque, você pode **marcar 1 Ponto de Fadiga** para causar o dano da arma usando metade de sua Proficiência."],"ax":[[{"k":"dw","m":"H"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Grito de Guerra","t":"Talento","l":8,"c":2,"x":["Uma vez por descanso longo, enquanto se lança rumo ao perigo, você pode emitir um grito de guerra que inspira seus aliados. Cada aliado capaz de ouvilo recupera 1 Ponto de Fadiga e ganha 1 Ponto de Esperança. Além disso, seus aliados fazem testes de ataque com vantagem até que você ou algum aliado role uma falha com Medo."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Frenesi","t":"Talento","l":8,"c":3,"x":["Uma vez por descanso longo, você pode entrar *Em Frenesi* até que não haja mais adversários na sua linha de visão.","Enquanto estiver *Em Frenesi*, você não pode usar PA, ganha um bônus de +10 em rolagens de dano e um bônus de +8 no seu limiar de dano grave."],"ax":[[{"k":"u","s":"L"}],[]],"ef":[{"k":"dm","v":10,"lbl":"Em Frenesi: +10 em rolagens de dano e +8 no limiar de dano grave; você não pode usar PA.","p":0,"tg":8}],"tk":0},{"d":"Lâmina","n":"Golpe da Morte","t":"Talento","l":9,"c":3,"x":["Uma vez por descanso longo, **gaste 1 Ponto de Esperança** para fazer um teste de ataque. O mestre informa contra quais alvos no alcance da arma o teste teria sucesso. Escolha um desses alvos e force- o a marcar 5 PV."],"ax":[[{"k":"h","n":1},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Lâmina","n":"Guerra e Glória","t":"Talento","l":9,"c":2,"x":["Em um sucesso crítico ao atacar com uma arma, receba 1 Ponto de Esperança adicional ou recupere 1 Ponto de Fadiga adicional.","Além disso, ao causar dano suficiente para derrotar um inimigo, receba 1 Ponto de Esperança ou recupere 1 PF."],"ax":[[{"k":"gs","n":1},{"k":"gh","n":1}],[{"k":"gs","n":1},{"k":"gh","n":1}]],"ef":[],"tk":0},{"d":"Falange","n":"Intocável","t":"Talento","l":1,"c":1,"x":["Receba um bônus na Evasão igual à metade da sua Agilidade."],"ax":[[]],"ef":[{"k":"ev","v":1,"lbl":"Receba um bônus na Evasão igual à metade da sua Agilidade.","p":0,"f":"agH","perm":1}],"tk":0},{"d":"Falange","n":"Movimento Ligeiro","t":"Talento","l":1,"c":0,"x":["Uma vez por descanso, **marque 1 PF** para se deslocar para qualquer lugar em alcance distante sem precisar de um teste de Agilidade.","Se terminar esse movimento em alcance corpo a corpo de um adversário e imediatamente atacá-lo, você ganha um bônus de +1 no teste de ataque."],"ax":[[{"k":"f","n":1},{"k":"u","s":"D"}],[]],"ef":[{"k":"ak","v":1,"lbl":"Se terminar esse movimento em alcance corpo a corpo de um adversário e imediatamente atacá-lo, você ganha um bônus de +1 no teste de ataque.","p":1}],"tk":0},{"d":"Falange","n":"Um Passo à Frente","t":"Talento","l":1,"c":1,"x":["Quando você é alvo de um ataque originado de um ponto fora de alcance corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para rolar **1d4** e receber um bônus igual ao resultado na sua Evasão contra este ataque."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Aproximação Estratégica","t":"Talento","l":2,"c":1,"x":["Após um descanso longo, coloque um número de marcadores igual ao seu Conhecimento nesta carta (mínimo de 1). Na primeira vez que você se mover para ficar próximo de um adversário e atacá-lo, você pode gastar um marcador para escolher uma das opções abaixo:","• Você faz o ataque com vantagem;","• Você recupera 1 Ponto de Fadiga de um aliado cac ao adversário;","• Você soma **1d8** à rolagem de dano. Após um descanso longo, marcadores não utilizados são perdidos."],"ax":[[{"k":"tk","a":5}],[],[],[]],"ef":[],"tk":1},{"d":"Lâmina","n":"Monstro de Batalha","t":"Talento","l":10,"c":0,"x":["Ao acertar um ataque contra um adversário, em vez de rolar o dano, você pode **marcar 4 Pontos de Fadiga** para forçar o alvo a marcar um número de PV igual ao número de PV que você tem marcados no momento."],"ax":[[]],"ef":[],"tk":0},{"d":"Lâmina","n":"Massacrar","t":"Talento","l":10,"c":3,"x":["Ao acertar um ataque com sua arma, você nunca causa dano abaixo do limiar de dano maior do alvo (ele sempre marca no mínimo 2 Pontos de Vida).","Além disso, quando uma criatura no alcance da sua arma causa dano a um aliado com um ataque que não tem você como alvo, você pode **marcar 1 PF** para forçá-la a fazer um teste de reação (15). Se falhar, o alvo deve marcar 1 Ponto de Vida."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Falange","n":"Ferocidade","t":"Talento","l":2,"c":2,"x":["Ao fazer com que um adversário marque 1 ou mais Pontos de Vida, você pode **gastar 2 Pontos de Esperança** para aumentar sua Evasão em um número igual à quantidade de PV que ele marcou. Esse bônus dura até o término do próximo ataque feito contra você."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Resistir","t":"Talento","l":3,"c":1,"x":["Ao marcar 1 Ponto de Armadura para reduzir o dano sofrido, você pode **marcar 1 Ponto de Fadiga** para marcar 1 Ponto de Armadura adicional."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Táticas","t":"Talento","l":3,"c":1,"x":["Ao prestar ajuda a um aliado, você pode **gastar 1 Ponto de Esperança** para somar uma de suas Experiências à rolagem, junto ao seu dado de vantagem.","Ao fazer um teste em dupla, você pode usar **1d20** como seu Dado de Esperança."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Falange","n":"Impulso","t":"Talento","l":4,"c":1,"x":["**Marque 1 Ponto de Fadiga** para usar um aliado próximo voluntário como impulso para se lançar no ar e fazer um ataque aéreo contra um alvo distante.","Você tem vantagem no ataque, soma **1d10** à rolagem de dano e termina seu movimento corpo a corpo ao alvo."],"ax":[[{"k":"f","n":1}],[]],"ef":[],"tk":0},{"d":"Falange","n":"Redirecionar","t":"Talento","l":4,"c":1,"x":["Quando um ataque originado de um ponto além do alcance corpo a corpo falha contra você, role um número de **d6** igual à sua Proficiência. Se tirar 6 em qualquer dado, você pode **marcar 1 Ponto de Fadiga** para redirecionar o ataque, fazendo-o causar dano a um adversário muito próximo."],"ax":[[{"k":"rd","die":6,"m":"P"}]],"ef":[],"tk":0},{"d":"Falange","n":"Conhece Teu Inimigo","t":"Talento","l":5,"c":1,"x":["Enquanto estiver observando uma criatura, você pode fazer um **teste de Instinto** contra ela. Em um sucesso, **gaste 1 Ponto de Esperança** e pergunte ao mestre uma das seguintes informações a respeito dela:","• PV e PF restantes;","• Dificuldade e limiares de dano;","• Táticas e dados de dano padrão;","• Habilidades e Experiências.","Além disso, em um sucesso, você pode **marcar 1 PF** para fazer o mestre perder 1 Ponto de Medo."],"ax":[[{"k":"h","n":1}],[],[],[],[],[]],"ef":[],"tk":0},{"d":"Falange","n":"Golpe Pessoal","t":"Talento","l":5,"c":1,"x":["Você tem um golpe icônico de combate. Descreva-o e dê um nome a ele. Uma vez por descanso, ao utilizá-lo como parte de uma ação, você pode rolar **1d20** como seu Dado de Esperança. Em um sucesso, recupere 1 Ponto de Fadiga."],"ax":[[{"k":"gs","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Falange","n":"Contra-Ataque Rápido","t":"Talento","l":6,"c":0,"x":["Quando um ataque originado de um ponto em alcance corpo a corpo falha contra você, você pode **marcar 1 Ponto** **de Fadiga** e aproveitar a oportunidade para causar o dano de uma de suas armas ativas ao atacante."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Recuperação","t":"Talento","l":6,"c":1,"x":["Durante um descanso curto, você pode escolher um movimento de repouso de descanso longo. Você pode **gastar 1 Ponto de Esperança** para permitir que um aliado também faça isso."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Dom da Falange","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Falange, receba os seguintes benefícios:","• Bônus de +1 na Agilidade;","• Uma vez por descanso, você pode **gastar 3 Pontos de Esperança** para fazer com que um ataque bem-sucedido contra você falhe."],"ax":[[],[],[{"k":"u","s":"D"}]],"ef":[{"k":"at","v":1,"lbl":"Bônus de +1 na Agilidade;","p":1,"i":0,"cond":"dom","perm":1}],"tk":0},{"d":"Falange","n":"Acuidade Cruel","t":"Talento","l":7,"c":1,"x":["Ao acertar um ataque com uma arma, receba um bônus igual à sua Acuidade ou Agilidade na rolagem de dano."],"ax":[[]],"ef":[{"k":"dm","v":1,"lbl":"Ao acertar com uma arma: bônus igual à Acuidade ou Agilidade (a maior) no dano.","p":0,"perm":1,"f":"max02"}],"tk":0},{"d":"Falange","n":"Amontoar","t":"Talento","l":8,"c":1,"x":["Faça um teste de Agilidade contra todos os alvos próximos. **Gaste 1 Ponto de Esperança** para mover os alvos que você acerta, bem como quaisquer aliados próximos voluntários, para outro ponto em alcance próximo."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Falange","n":"Golpe Debilitante","t":"Talento","l":8,"c":3,"x":["Ao acertar um ataque, você pode **marcar 1 PF** para fazer com que o próximo ataque bem-sucedido contra o mesmo alvo cause **2d12** de dano adicional."],"ax":[[{"k":"d","n":2,"die":12,"fl":0,"tp":"","m":null}]],"ef":[],"tk":0},{"d":"Falange","n":"Quase Lá","t":"Talento","l":9,"c":1,"x":["Se tiver 2 PV ou menos desmarcados, você não sofre dano menor."],"ax":[[]],"ef":[],"tk":0},{"d":"Falange","n":"Ataque Fragmentado","t":"Talento","l":9,"c":3,"x":["**Gaste 1 Ponto de Esperança** e faça um ataque contra todos os adversários no alcance de sua arma. Uma vez por descanso longo, em um sucesso contra qualquer um dos alvos, some todo o dano causado e em seguida o redistribua como quiser entre os alvos atingidos. Antes de causar dano a um alvo, role um dado de dano adicional e some o resultado dele ao dano que causar ao alvo."],"ax":[[{"k":"h","n":1},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Falange","n":"Passo Célere","t":"Talento","l":10,"c":2,"x":["Quando um ataque falha contra você, recupere 1 Ponto de Fadiga. Se não puder recuperar PF, receba 1 Ponto de Esperança."],"ax":[[{"k":"gs","n":1},{"k":"gh","n":1}]],"ef":[],"tk":0},{"d":"Falange","n":"Trajeto Mortal","t":"Talento","l":10,"c":1,"x":["**Gaste 3 Pontos de Esperança** para percorrer o campo de batalha em linha reta até um ponto em alcance distante, fazendo um ataque contra todos os adversários no alcance da sua arma ao longo do caminho percorrido. Escolha a ordem na qual o dano é causado aos alvos atingidos. Para o primeiro alvo, role o dano de sua arma com +1 de bônus na Proficiência. Depois disso, remova um dado do teste de dano e cause o dano restante ao próximo alvo. Continue removendo um dado para cada alvo subsequente até que não tenha mais dados de dano ou adversários. Você não pode escolher o mesmo alvo mais de uma vez por ataque."],"ax":[[{"k":"h","n":3}]],"ef":[{"k":"pr","v":1,"lbl":"Para o primeiro alvo, role o dano de sua arma com +1 de bônus na Proficiência.","p":0}],"tk":0},{"d":"Códice","n":"Livro de Ava","t":"Grimório","l":1,"c":2,"x":["*Propelir:* faça um **teste de conjuração** contra um alvo corpo a corpo. Em um sucesso, ele é empurrado para um ponto em alcance distante e sofre **d10+2** de dano mágico com sua Proficiência.","*Armadura de Tava:* **gaste 1 Ponto de Esperança** para conceder um bônus de +1 na Armadura a um alvo que você possa tocar. Esse bônus dura até o próximo descanso do alvo ou até que você conjure Armadura de Tava novamente.","*Estaca de Gelo:* faça um **teste de conjuração (12)** para invocar um grande espinho de gelo em alcance distante. Se usá-lo como arma, em vez disso, faça o teste de conjuração contra a Dificuldade do alvo. Em um sucesso, você causa **d6** de dano físico usando sua Proficiência."],"ax":[[{"k":"d","n":1,"die":10,"fl":2,"tp":"mágico","m":"P"}],[{"k":"h","n":1}],[{"k":"c","dif":12},{"k":"d","n":1,"die":6,"fl":0,"tp":"físico","m":"P"}]],"ef":[{"k":"pa","v":1,"lbl":"Armadura de Tava: gaste 1 Ponto de Esperança para conceder um bônus de +1 na Armadura a um alvo que você possa tocar.","p":1}],"tk":0},{"d":"Códice","n":"Livro de Illiat","t":"Grimório","l":1,"c":2,"x":["*Sonolência:* faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, ele fica *Adormecido* até sofrer dano ou até o mestre gastar 1 Ponto de Medo no turno dele para encerrar a condição.","*Saraivada Arcana:* uma vez por descanso, **gaste qualquer quantidade de Pontos de Esperança** para atirar projéteis mágicos que acertam um alvo próximo à sua escolha. Role um número de **d6** igual à quantidade de Pontos de Esperança gasta e cause o resultado deles como dano mágico ao alvo.","*Telepatia:* **gaste 1 Ponto de Esperança** para criar uma linha de comunicação mental com um alvo que você possa ver. Essa conexão dura até seu próximo descanso ou até você conjurar Telepatia novamente."],"ax":[[],[{"k":"u","s":"D"}],[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Tyfar","t":"Grimório","l":1,"c":2,"x":["*Chama Selvagem:* faça um **teste de conjuração** contra até três adversários corpo a corpo. Chamas irrompem de sua mão. Alvos atingidos sofrem **2d6** de dano mágico e marcam 1 Ponto de Fadiga.","*Mão Arcana:* você conjura uma mão mágica idêntica à sua em força e tamanho num ponto em alcance distante.","*Névoa Misteriosa:* faça um **teste de conjuração (13)** para conjurar uma névoa densa que fica em uma área estática dentro do alcance muito próximo. A neblina deixa essa área e tudo o que há nela fortemente obscurecido."],"ax":[[{"k":"d","n":2,"die":6,"fl":0,"tp":"mágico","m":null}],[],[{"k":"c","dif":13}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Sitil","t":"Grimório","l":2,"c":2,"x":["*Ajustar Aparência:* você muda magicamente sua aparência e vestimentas para evitar ser reconhecido.","*Paralelos:* **gaste 2 Pontos de Esperança** para conjurar este feitiço sobre si mesmo ou sobre um aliado próximo. Na próxima vez que o alvo fizer um ataque, ele pode acertar um alvo adicional dentro do alcance contra o qual seu teste de ataque seria bem-sucedido. Você pode manter este feitiço ativo sobre uma única criatura por vez.","*Ilusão:* faça um **teste de conjuração (14)**. Em um sucesso, você cria uma ilusão visual temporária em um ponto em alcance próximo. Ela não pode ultrapassar seu tamanho e dura enquanto você olhar para ela. A ilusão não levanta suspeitas até um observador estar corpo a corpo dela."],"ax":[[],[{"k":"h","n":2}],[{"k":"c","dif":14}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Vagras","t":"Grimório","l":2,"c":2,"x":["*Portal Arcano:* se não houver adversários corpo a corpo, faça um **teste de conjuração (13)**. Em um sucesso, **gaste 1 Ponto de Esperança** para criar um portal de onde você está para outro ponto que você possa ver em alcance distante. Ele se fecha depois que uma criatura passar por ele.","*Revelar:* faça um **teste de conjuração**. Se houver algo escondido por magia em alcance próximo, ela é revelada. *Tranca Rúnica:* faça um **teste de conjuração (15)** sobre um objeto que esteja tocando e que possa fechar (como um baú, cadeado, caixa ou fechadura). Uma vez por descanso, em um sucesso, você pode trancar o objeto de modo que ele só possa ser aberto por criaturas designadas por você. Este feitiço pode ser quebrado em uma hora por uma pessoa com acesso à magia."],"ax":[[{"k":"c","dif":13},{"k":"h","n":1}],[{"k":"c","dif":15},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Korvax","t":"Grimório","l":3,"c":2,"x":["*Círculo Rúnico:* **marque 1 Ponto de Fadiga** para criar um círculo mágico temporário abaixo de onde você está. Todos os adversários que entrarem ou estiverem em alcance cac sofrem **2d12+4** de dano mágico e são empurrados para um ponto em alcance muito próximo.","*Lapso:* **gaste 1 Ponto de Esperança** para forçar um alvo corpo a corpo a fazer um teste de reação (15). Se falhar, ele esquece o último minuto de conversa com você.","*Levitação:* faça um **teste de conjuração** para suspender temporariamente no ar um alvo que você possa ver e movê-lo para um ponto em alcance próximo relativo à posição original dele."],"ax":[[{"k":"d","n":2,"die":12,"fl":4,"tp":"mágico","m":null},{"k":"f","n":1}],[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Norai","t":"Grimório","l":3,"c":2,"x":["*Amarração Mística:* faça um **teste de conjuração** contra um alvo distante. Em um sucesso, ele fica temporariamente *Imobilizado* e deve marcar 1 Ponto de Fadiga. Se tiver uma criatura que esteja voando como alvo, este feitiço faz com que ela aterrisse e fique temporariamente *Imobilizada*.","*Bola de Fogo:* faça um **teste de conjuração** contra um alvo muito distante. Em um sucesso, lance uma esfera de fogo que explode ao se chocar contra ele. O alvo e todas as criaturas Muito Próximas dele devem fazer um teste de reação (13). Alvos que falharem sofrem **d20+5** de dano mágico com sua Proficiência. Alvos bem-sucedidos sofrem metade do dano."],"ax":[[],[{"k":"d","n":1,"die":20,"fl":5,"tp":"mágico","m":"P"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Ecsota","t":"Grimório","l":4,"c":3,"x":["*Criar Construto:* **gaste 1 Ponto de Esperança** para escolher um grupo de objetos ao seu redor e, a partir deles, crie um construto animado que obedece comandos básicos. Faça um **teste de conjuração** para mandá-lo agir. Quando necessário, ele compartilha sua Evasão e atributos, e os ataques dele causam **2d10+3** de dano físico. Você pode manter apenas um construto por vez, e ele se desfaz ao sofrer qualquer quantidade de dano.","*Repudiar:* você pode interromper um efeito mágico em andamento. Faça um teste de conjuração usando seu atributo de conjuração. Se passar, uma vez por descanso, o efeito cessa e quaisquer consequências são evitadas."],"ax":[[{"k":"d","n":2,"die":10,"fl":3,"tp":"físico","m":null},{"k":"h","n":1}],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Grynn","t":"Grimório","l":4,"c":2,"x":["*Deflexão:* uma vez por descanso longo, **gaste 1 Ponto de Esperança** para negar o dano de um ataque que tenha você ou um aliado muito próximo como alvo.","*Muralha de Fogo:* faça um **teste de conjuração (15)**. Em um sucesso, crie uma muralha de fogo mágico entre dois pontos em alcance distante. Todas as criaturas no caminho dela devem escolher ficar em um dos lados, e tudo o que atravessá-la depois disso sofre **4d10+3** de dano mágico. *Tranca Temporal:* escolha um objeto distante como alvo. Esse objeto para no tempo e espaço exatamente onde está até o seu próximo descanso. Se uma criatura tentar movê-lo, faça um **teste de conjuração** contra ela para sustentar este feitiço."],"ax":[[{"k":"h","n":1},{"k":"u","s":"L"}],[{"k":"c","dif":15},{"k":"d","n":4,"die":10,"fl":3,"tp":"mágico","m":null}]],"ef":[],"tk":0},{"d":"Códice","n":"Muralha","t":"Feitiço","l":5,"c":2,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, **gaste 1 Ponto de Esperança** uma vez por descanso para criar uma parede mágica temporária entre dois pontos em alcance distante. Ela pode ter até 15m de altura e se formar em qualquer ângulo. Criaturas ou objetos no caminho dela são desviados para um dos lados à sua escolha. A muralha perdura até seu próximo descanso ou até você conjurar Muralha novamente."],"ax":[[{"k":"c","dif":15},{"k":"h","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Códice","n":"Teleporte","t":"Feitiço","l":5,"c":2,"x":["Uma vez por descanso longo, você pode instantaneamente teleportar a si mesmo e qualquer número de alvos próximos voluntários para um lugar onde você já esteve anteriormente. Escolha uma das opções a seguir e faça um **teste de conjuração (16)**:","• Se conhece o lugar muito bem, receba +3 de bônus;","• Se visitou o lugar com alguma frequência, receba +1 de bônus;","• Se não visitou o lugar com frequência, você não ganha um modificador;","• Se visitou o lugar apenas uma vez, sofra uma penalidade de – 2.","Em um sucesso, você aparece no lugar pretendido. Se falhar, você aparece em um lugar diferente do pretendido. O grau da falha determina quão longe você aparece."],"ax":[[{"k":"c","dif":16},{"k":"u","s":"L"}],[],[],[],[],[]],"ef":[],"tk":0},{"d":"Códice","n":"Banir","t":"Feitiço","l":6,"c":0,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, role um número de **d20** igual ao seu atributo de conjuração. O alvo deve fazer um teste de reação com Dificuldade igual ao seu resultado mais alto. Em um sucesso, o alvo marca 1 Ponto de Fadiga, mas não é banido. Uma vez por descanso, se falhar, ele é banido deste reino.","Quando os personagens rolarem com Medo, a Dificuldade sofre uma penalidade de –1 e o alvo faz outro teste de reação. Em um sucesso, ele volta do banimento."],"ax":[[{"k":"u","s":"D"},{"k":"rd","die":20,"m":"C"}],[]],"ef":[],"tk":0},{"d":"Códice","n":"Sigilo da Retaliação","t":"Feitiço","l":6,"c":2,"x":["Marque um adversário próximo com um Sigilo da Retaliação. O mestre ganha 1 Ponto de Medo. Quando o adversário marcado causar dano a você ou aos seus aliados, coloque **1d8** nesta carta. Você pode acumular um número de **d8** igual ao seu nível. Ao atacar o adversário marcado com sucesso, role os dados que estão nesta carta e some o total à sua rolagem de dano; em seguida, retire os dados. Este efeito termina quando o adversário marcado é derrotado ou quando você conjura Sigilo da Retaliação novamente."],"ax":[[]],"ef":[],"tk":0},{"d":"Códice","n":"Dom do Códice","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Códice, receba os seguintes benefícios:","• Você pode **marcar 1 Ponto de Fadiga** para somar sua Proficiência a um teste de conjuração;","• Uma vez por descanso, substitua esta carta por qualquer carta em sua reserva sem pagar o custo de troca."],"ax":[[],[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Homet","t":"Grimório","l":7,"c":0,"x":["*Atravessar:* faça um **teste de conjuração (13)**. Uma vez por descanso, em um sucesso, você e todas as criaturas que o estejam tocando podem atravessar uma parede ou porta Próxima. O efeito termina quando todos estiverem do outro lado.","*Portal Planar:* faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, abra um portal para uma localidade que você já tenha visitado em outra dimensão ou plano de existência. Esse portal perdura até seu próximo descanso."],"ax":[[{"k":"c","dif":13},{"k":"u","s":"D"}],[{"k":"c","dif":14},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Vyola","t":"Grimório","l":8,"c":2,"x":["*Clareza Compartilhada:* uma vez por descanso longo, **gaste 1 Ponto de Esperança** para escolher duas criaturas voluntárias. Quando uma delas for marcar PF, ela pode escolher qual das duas irá marcar. Este feitiço dura até o próximo descanso dos alvos.","*Sondar Memórias:* faça um **teste de conjuração** contra um alvo distante. Em um sucesso, espione a mente do alvo e faça uma pergunta ao mestre. O mestre descreve as memórias do alvo que estejam relacionadas à resposta."],"ax":[[{"k":"h","n":1},{"k":"u","s":"L"}],[]],"ef":[],"tk":0},{"d":"Códice","n":"Refúgio Seguro","t":"Feitiço","l":8,"c":3,"x":["Quando tem alguns minutos de calma para se concentrar, você pode **gastar 2 Pontos de Esperança** para invocar seu Refúgio Seguro: um grande abrigo interdimensional onde você e seus aliados podem ficar. Ao fazer isso, uma porta mágica aparece em algum lugar em alcance próximo. Apenas criaturas designadas por você podem entrar. Após entrar, você pode deixar a entrada invisível. Qualquer pessoa no interior do refúgio pode sair a hora que quiser. Depois que você sair, a porta de entrada deve ser invocada novamente.","Ao fazer um descanso em seu Refúgio Seguro, você pode escolher um movimento de repouso adicional."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Pavor","n":"Golpe Debilitante","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em caso de sucesso:","• Se rolar com Esperança, cause **d6+1** de dano mágico com sua Proficiência. Se rolar com Medo, cause **d10+1** de dano mágico com sua Proficiência.","• O próximo ataque bem-sucedido do alvo causa metade do dano.","Em caso de falha, você deve gastar 1 Ponto de Esperança ou marcar 1 PF."],"ax":[[],[{"k":"d","n":1,"die":6,"fl":1,"tp":"mágico","m":"P"},{"k":"d","n":1,"die":10,"fl":1,"tp":"mágico","m":"P"}],[],[]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Ronin","t":"Grimório","l":9,"c":4,"x":["*Enervação Eterna:* uma vez por descanso longo, faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, ele fica permanentemente *Vulnerável*. O alvo não pode se recuperar dessa condição por quaisquer meios.","*Transformação:* faça um **teste de conjuração (15)**. Em um sucesso, transforme-se em um objeto inanimado que não exceda o dobro de seu tamanho normal. Você pode permanecer nessa forma até sofrer dano."],"ax":[[{"k":"u","s":"L"}],[{"k":"c","dif":15}]],"ef":[],"tk":0},{"d":"Códice","n":"Onda Desintegradora","t":"Feitiço","l":9,"c":4,"x":["Faça um **teste de conjuração (18)**. Uma vez por descanso longo, em um sucesso, o mestre lhe informa quais adversários distantes têm Dificuldade 18 ou menor. **Marque 1 Ponto de Fadiga** para cada alvo que quiser atingir com este feitiço. O alvo morre e não pode voltar à vida por quaisquer meios."],"ax":[[{"k":"c","dif":18},{"k":"f","n":1},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Códice","n":"Livro de Yarrow","t":"Grimório","l":10,"c":2,"x":["*Imunidade Mágica:* **gaste 5 Pontos de Esperança** para ficar imune a dano mágico até seu próximo descanso. *Manipulação Temporal:* faça um **teste de conjuração (18)**. Em um sucesso, o tempo desacelera temporariamente até parar para todos que estiverem em alcance distante, com exceção de você. Ele volta ao normal na próxima vez que você fizer um teste que tenha outra criatura como alvo."],"ax":[[{"k":"c","dif":18},{"k":"h","n":5}]],"ef":[],"tk":0},{"d":"Códice","n":"União Transcendental","t":"Feitiço","l":10,"c":1,"x":["Uma vez por descanso longo, **gaste 5 Pontos de Esperança** para conjurar este feitiço sobre duas ou mais criaturas voluntárias. Até seu próximo descanso, quando uma criatura conectada por essa união for marcar Pontos de Vida ou Pontos de Fadiga, as criaturas conectadas podem escolher qual delas marcará."],"ax":[[{"k":"h","n":5},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Pavor","n":"Véu Umbral","t":"Feitiço","l":1,"c":1,"x":["Uma vez por descanso, você pode **marcar 1 PF** para se envolver em energia sombria. Ao fazer isso, coloque um número de marcadores nesta carta igual ao número de Pontos de Medo que o mestre tem no momento. Após ser alvo de um teste de ataque, você pode gastar qualquer número de marcadores para aplicar uma penalidade ao resultado igual a –1 para cada marcador gasto.","No fim da cena, marcadores não utilizados são perdidos."],"ax":[[{"k":"u","s":"D"}],[]],"ef":[],"tk":1},{"d":"Pavor","n":"Voz do Pavor","t":"Feitiço","l":1,"c":0,"x":["Você pode falar magicamente com uma criatura que você possa ver, atormentando-a com suas palavras. Faça um **teste de conjuração** contra ela. Em um sucesso, ela deve marcar 1 PF e congela de terror, ficando temporariamente *Imobilizada*."],"ax":[[]],"ef":[],"tk":0},{"d":"Pavor","n":"Retribuição Sinistra","t":"Feitiço","l":2,"c":2,"x":["Quando um aliado próximo sofrer dano de um alvo que você possa ver, você pode fazer um teste de reação contra o alvo usando seu atributo de conjuração. Se acertar, **marque 1 PF** para causar **d6** de dano mágico com sua Proficiência."],"ax":[[{"k":"d","n":1,"die":6,"fl":0,"tp":"mágico","m":"P"},{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Pavor","n":"Sorver Essência","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Uma vez por descanso longo, em um sucesso, o alvo sofre **d12+4** de dano mágico com sua Proficiência. Em um sucesso com Medo, sua Proficiência para esta rolagem de dano recebe +1. Você recupera um número de Pontos de Vida igual aos PV marcados pelo alvo deste ataque."],"ax":[[{"k":"d","n":1,"die":12,"fl":4,"tp":"mágico","m":"P"},{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Pavor","n":"Aterrorizar","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, o alvo marca **1d4** PF e você pode fazê-lo fugir uma categoria de alcance para longe de você (como de muito próximo para próximo, de próximo para distante e assim por diante). Em um sucesso com Medo, o alvo também fica temporariamente *Vulnerável*."],"ax":[[]],"ef":[],"tk":0},{"d":"Pavor","n":"Trauma Compartilhado","t":"Feitiço","l":3,"c":1,"x":["Você pode transferir o sofrimento de uma criatura para outra. Uma vez por descanso, marque qualquer número de PV de uma criatura voluntária em alcance corpo a corpo para recuperar uma quantidade equivalente de PV de outra criatura voluntária em alcance corpo a corpo."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Pavor","n":"Conjurar o Horror","t":"Feitiço","l":4,"c":2,"x":["**Marque 1 PF** para invocar uma criatura de outro mundo. Ela causa **d8+1** de dano mágico com seu atributo de conjuração a um alvo distante. Se o alvo marcar qualquer número de PV por este ataque, ele precisa passar num **teste de reação (12)** para se fortalecer contra o horror ou é obrigado a marcar a mesma quantidade de PF. Após fazer o ataque, a criatura desaparece."],"ax":[[{"k":"d","n":1,"die":8,"fl":1,"tp":"mágico","m":"C"},{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Pavor","n":"Correntes de Aflição","t":"Feitiço","l":4,"c":2,"x":["**Marque 2 PF** para temporariamente *Acorrentar* um alvo próximo. Quando uma criatura *Acorrentada* causa dano, o alvo do ataque dela marca 1 PV a menos do que normalmente marcaria. Você não pode manter mais de uma criatura *Acorrentada* por vez."],"ax":[[{"k":"f","n":2}]],"ef":[],"tk":0},{"d":"Pavor","n":"Golpe Atroz","t":"Feitiço","l":5,"c":2,"x":["Quando um alvo marca qualquer número de PV por conta de um ataque que você fez, você pode **gastar 1 Ponto de Esperança** para drenar o poder dele. O mestre perde 1 Ponto de Medo."],"ax":[[]],"ef":[],"tk":0},{"d":"Pavor","n":"Névoa Espectral","t":"Feitiço","l":5,"c":0,"x":["**Gaste 2 Pontos de Esperança** para conjurar uma névoa misteriosa que torna você e aliados próximos à sua escolha momentaneamente incorpóreos. Enquanto uma criatura estiver incorpórea, ela pode se mover através de objetos sólidos e é imune a dano físico. Ela se torna corpórea novamente após atravessar um objeto sólido ou fazer um teste. Do contrário, este efeito dura até o fim da cena."],"ax":[[{"k":"h","n":2}]],"ef":[],"tk":0},{"d":"Pavor","n":"Fogo Negro","t":"Feitiço","l":6,"c":2,"x":["**Gaste qualquer número de Pontos de Esperança** para atingir uma quantidade de adversários próximos equivalente aos pontos gastos. Cada alvo deve fazer um **teste de reação (15)**. Quem falhar sofre **d8+6** de dano mágico com seu atributo de conjuração conforme é envolto em fogo negro. Quem passar sofre metade do dano."],"ax":[[{"k":"d","n":1,"die":8,"fl":6,"tp":"mágico","m":"C"}]],"ef":[],"tk":0},{"d":"Pavor","n":"Susto Repentino","t":"Feitiço","l":6,"c":1,"x":["Ao causar dano mágico a um alvo, você pode **marcar 1 PF** para se teletransportar ao alcance corpo a corpo do alvo. Ao fazer isso, ele fica *Vulnerável* até marcar 1 ou mais PV."],"ax":[[]],"ef":[],"tk":0},{"d":"Pavor","n":"Dom do Pavor","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Pavor, receba os seguintes benefícios:","• Ao obter um sucesso com Medo, você pode **marcar 2 PF** para impedir o mestre de receber 1 Ponto de Medo.","• Uma vez por descanso, ao fazer um teste, você pode receber um bônus igual ao número de Pontos de Medo que o mestre possui."],"ax":[[],[],[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Pavor","n":"Muralha Faminta","t":"Feitiço","l":7,"c":2,"x":["Faça um **teste de conjuração (10)**. Em um sucesso, você pode **gastar 1 Ponto de Esperança** para criar uma muralha visível de energia necrótica entre dois pontos em alcance distante. A muralha dura até você marcar 1 PV ou conjurar esta magia novamente. Uma criatura que atravesse a muralha (ou que esteja dentro dela quando surgir) deve marcar 2 Pontos de Fadiga."],"ax":[[{"k":"c","dif":10}]],"ef":[],"tk":0},{"d":"Pavor","n":"Carne Macabra","t":"Feitiço","l":8,"c":1,"x":["Receba +1 em seus limiares de dano para cada PF que você tem marcado.","Além disso, ao rolar com Medo, você pode **gastar 2 Pontos de Esperança** para recuperar 1 Ponto de Armadura."],"ax":[[],[{"k":"ga","n":1}]],"ef":[{"k":"t","v":1,"lbl":"+1 nos limiares de dano para cada PF marcado.","p":0,"perm":1,"f":"st"}],"tk":0},{"d":"Pavor","n":"Exército Sombrio","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, você pode invocar ínferos ao seu redor e que se movem com você. Coloque 8 marcadores nesta carta. Ao causar dano a um alvo muito próximo, você pode gastar qualquer número de marcadores, adicionando **1d8** à rolagem de dano para cada marcador gasto dessa forma. Além disso, ao sofrer dano, você pode gastar qualquer número de marcadores, reduzindo o dano em **1d8** para cada marcador gasto dessa forma. Cada vez que você gasta um marcador, um ínfero age em seu benefício e então desaparece. No próximo descanso longo, marcadores não utilizados são perdidos."],"ax":[[{"k":"c","dif":14},{"k":"u","s":"L"}]],"ef":[],"tk":1},{"d":"Pavor","n":"Danação","t":"Feitiço","l":9,"c":2,"x":["Faça um teste de conjuração contra um alvo distante. Em um sucesso, **marque qualquer número de PF** para rolar um número de **d20** equivalente aos pontos marcados, causando dano mágico igual à soma dos resultados. Se este ataque derrotar o alvo, todos os adversários distantes dele devem marcar 1 Ponto de Fadiga."],"ax":[[]],"ef":[],"tk":0},{"d":"Graça","n":"Dissimulação","t":"Talento","l":1,"c":0,"x":["**Gaste 1 Ponto de Esperança** para receber vantagem em um teste para enganar ou fazer alguém acreditar em uma mentira que você contar."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Graça","n":"Enfeitiçar","t":"Feitiço","l":1,"c":0,"x":["Faça um teste de conjuração contra um alvo próximo. Em um sucesso, ele fica temporariamente *Enfeitiçado*. Enquanto estiver *Enfeitiçado*, a atenção do alvo se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. Uma vez por descanso, você pode **marcar 1 Ponto de Fadiga** para forçar o alvo *Enfeitiçado* a marcar 1 PF também."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Graça","n":"Palavras Inspiradoras","t":"Talento","l":1,"c":1,"x":["Suas palavras são imbuídas de poder. Após um descanso longo, coloque um número de marcadores igual à sua Presença nesta carta. Ao falar com um aliado, você pode gastar um marcador desta carta para dar a ele um benefício dentre os seguintes:","• Seu aliado recupera 1 PF;","• Seu aliado recupera 1 PV;","• Seu aliado recebe 1 Ponto de Esperança.","Após um descanso longo, marcadores não utilizados são perdidos."],"ax":[[],[],[],[{"k":"gh","n":1}],[]],"ef":[],"tk":1},{"d":"Pavor","n":"Saborear a Angústia","t":"Feitiço","l":9,"c":1,"x":["Quando um adversário próximo sofre dano grave, você pode recuperar 1 PF."],"ax":[[{"k":"gs","n":1}]],"ef":[],"tk":0},{"d":"Pavor","n":"Avatar do Terror","t":"Feitiço","l":10,"c":2,"x":["**Marque 1 PF** para se transformar em uma criatura alimentada pelo medo. Enquanto estiver nessa forma, você recebe **+1d6** em suas rolagens de dano para cada Ponto de Medo que o mestre possui. Além disso, você recebe 1 Ponto de Esperança sempre que o mestre gasta 1 Ponto de Medo para pôr em foco um adversário muito próximo.","Antes de fazer qualquer teste, você deve gastar 1 Ponto de Esperança. Se não puder fazer isso, você retorna à sua forma normal."],"ax":[[{"k":"f","n":1},{"k":"gh","n":1}],[]],"ef":[],"tk":0},{"d":"Pavor","n":"Invocar o Tormento","t":"Feitiço","l":10,"c":2,"x":["Você causa o dobro de dano a alvos que estejam com todos os PF marcados. Além disso, quando um adversário próximo é derrotado com todos os PF marcados, você recebe 1 Ponto de Esperança."],"ax":[[{"k":"gh","n":1}]],"ef":[],"tk":0},{"d":"Graça","n":"Insolência","t":"Talento","l":2,"c":2,"x":["Ao insultar ou provocar um alvo distante, faça um **teste de Presença** contra ele. Uma vez por descanso, em um sucesso, role um número de **d4** igual à sua Proficiência. O alvo deve marcar um número de Pontos de Fadiga igual ao maior resultado obtido."],"ax":[[{"k":"u","s":"D"},{"k":"rd","die":4,"m":"P"}]],"ef":[],"tk":0},{"d":"Graça","n":"Não Minta para Mim","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, ele não pode mentir para você enquanto estiver em alcance próximo, porém não é obrigado a falar. Se você fizer uma pergunta e ele se recusar a responder, ele deve marcar 1 Ponto de Fadiga e o efeito termina. O alvo em geral não está ciente de que este feitiço foi conjurado sobre ele até que fale uma verdade contra sua vontade."],"ax":[[]],"ef":[],"tk":0},{"d":"Graça","n":"Invisibilidade","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (10)**. Em um sucesso, **marque 1 Ponto de Fadiga** e deixe você ou um aliado corpo a corpo *Invisível*. Uma criatura *Invisível* só pode ser vista por meios mágicos e testes de ataque contra ela são feitos com desvantagem. Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando a criatura *Invisível* faz uma ação, gaste um marcador desta carta. Após o término da ação que consumiu o último marcador, o efeito termina.","Você pode manter apenas uma criatura sob efeito de Invisibilidade por vez."],"ax":[[{"k":"c","dif":10},{"k":"f","n":1}],[]],"ef":[],"tk":1},{"d":"Graça","n":"Lampejo Hipnótico","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra todos os adversários próximos na sua frente. Uma vez por descanso, em um sucesso, crie lampejos ilusórios de cores e luzes que deixam os alvos atingidos temporariamente *Atordoados* e os força a marcar 1 PF. Enquanto estiverem *Atordoados*, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem desta condição."],"ax":[[{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Graça","n":"Espionar","t":"Feitiço","l":4,"c":1,"x":["Escolha um alvo muito distante. Você pode ver e ouvir pelos olhos e ouvidos dele. Você pode escolher entre usar seus próprios sentidos ou os do alvo à vontade até seu próximo descanso ou até você conjurar outro feitiço."],"ax":[[]],"ef":[],"tk":0},{"d":"Graça","n":"Palavras Tranquilizantes","t":"Talento","l":4,"c":1,"x":["Durante um descanso curto, ao passar um tempo amparando outro personagem por meio do movimento de repouso Tratar Ferimentos, recupere 1 Ponto de Vida adicional desse personagem. Ao fazer isso, você também recupera 2 Pontos de Vida."],"ax":[[{"k":"gv","n":1}]],"ef":[],"tk":0},{"d":"Graça","n":"Palavras de Discórdia","t":"Feitiço","l":5,"c":1,"x":["Sussurre palavras de discórdia para um adversário corpo a corpo e faça um **teste de conjuração (13)**. Em um sucesso, o alvo deve marcar 1 Ponto de Fadiga e atacar outro adversário em vez de você ou seus aliados.","Após concluir o ataque, o alvo percebe o que aconteceu. Na próxima vez que conjurar Palavras de Discórdia sobre ele, você sofre uma penalidade de –5 no teste de conjuração."],"ax":[[{"k":"c","dif":13}],[]],"ef":[],"tk":0},{"d":"Graça","n":"Sondar Pensamentos","t":"Feitiço","l":5,"c":2,"x":["Você pode espionar a mente dos outros. **Gaste 1 Ponto de Esperança** para ler pensamentos vagos e superficiais de um alvo distante. Faça um **teste de conjuração** contra o alvo para sondar pensamentos profundos e escondidos. Se rolar com Medo, a critério do mestre, o alvo pode perceber que você está lendo a mente dele."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Graça","n":"Jamais Esquecido","t":"Talento","l":6,"c":2,"x":["Ao marcar 1 ou mais Pontos de Vida devido a um ataque, você pode **marcar 1 Ponto de Fadiga** para colocar um número de marcadores nesta carta igual ao número de PV marcados. Para cada marcador nesta carta, você recebe um bônus de +5 na rolagem de dano do próximo ataque que você acertar. Em seguida, zere todos os marcadores."],"ax":[[]],"ef":[],"tk":1},{"d":"Graça","n":"Partilhar o Fardo","t":"Feitiço","l":6,"c":0,"x":["Uma vez por descanso, absorva a Fadiga de uma criatura corpo a corpo voluntária. O alvo descreve quais conhecimentos ou emoções particulares são transferidos da mente dele para a sua. Transfira qualquer número de PF do alvo para você e em seguida receba 1 Ponto de Esperança para cada PF transferido."],"ax":[[{"k":"gh","n":1},{"k":"u","s":"D"}]],"ef":[],"tk":0},{"d":"Graça","n":"Carisma Infinito","t":"Talento","l":7,"c":1,"x":["Após fazer um teste para obter favores, mentir ou persuadir, você pode **gastar 1 Ponto de Esperança** para rolar novamente seu Dado de Esperança ou Medo."],"ax":[[]],"ef":[],"tk":0},{"d":"Graça","n":"Dom da Graça","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Graça, receba os seguintes benefícios:","• Você pode **marcar 1 PA** em vez de 1 PF;","• Quando for fazer com que um alvo marque PV, você pode forçá-lo a marcar um número equivalente de PF em vez disso."],"ax":[[],[],[]],"ef":[],"tk":0},{"d":"Graça","n":"Enfeitiçar em Massa","t":"Feitiço","l":8,"c":3,"x":["Faça um **teste de conjuração** contra todos os alvos distantes. Alvos atingidos ficam temporariamente *Enfeitiçados*. Enquanto um alvo estiver *Enfeitiçado*, a atenção dele se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. **Marque 1 Ponto de Fadiga** para forçar todos os alvos *Enfeitiçados* a marcarem 1 PF, encerrando este feitiço."],"ax":[[{"k":"f","n":1}]],"ef":[],"tk":0},{"d":"Graça","n":"Projeção Astral","t":"Feitiço","l":8,"c":0,"x":["Uma vez por descanso longo, **marque 1 Ponto de Fadiga** para projetar uma cópia de si mesmo que pode aparecer em qualquer lugar no qual você já tenha estado anteriormente.","Você pode ver e ouvir através da projeção e pode afetar o mundo como se você estivesse no lugar dela. Uma criatura que investigue a projeção pode discernir sua origem mágica. Esse efeito dura até seu próximo descanso ou até sua projeção sofrer qualquer dano."],"ax":[[{"k":"f","n":1},{"k":"u","s":"L"}],[]],"ef":[],"tk":0},{"d":"Graça","n":"Imitador","t":"Feitiço","l":9,"c":3,"x":["Uma vez por descanso longo, esta carta pode imitar as habilidades de outra carta de domínio de 8º nível ou menor na mão de outro jogador. **Gaste uma quantidade de Esperança igual à metade do nível da carta** para ter acesso à habilidade. A cópia permanece até seu próximo descanso ou até o outro jogador colocar a carta original na reserva."],"ax":[[{"k":"u","s":"L"}]],"ef":[],"tk":0},{"d":"Graça","n":"Mestre do Ofício","t":"Talento","l":9,"c":0,"x":["Receba um bônus permanente de +2 em duas de suas Experiências, ou +3 em apenas uma. Em seguida, coloque esta carta na sua reserva permanentemente."],"ax":[[]],"ef":[],"tk":0},{"d":"Graça","n":"Em Dobro","t":"Feitiço","l":10,"c":1,"x":["Quando um aliado próximo causa dano a um adversário, você pode fazer um **teste de conjuração** contra esse mesmo alvo. Em um sucesso, você causa o mesmo dano que seu aliado causou. Se você rolar um sucesso com Medo, coloque esta carta na reserva."],"ax":[[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Chuva de Lâminas","t":"Feitiço","l":1,"c":1,"x":["**Gaste 1 Ponto de Esperança** para fazer um **teste de conjuração** e arremessar lâminas mágicas contra todos os alvos muito próximos. Alvos atingidos sofrem **d8+2** de dano mágico com sua Proficiência.","Se um alvo atingido estiver *Vulnerável* ele sofre **1d8** de dano adicional."],"ax":[[{"k":"d","n":1,"die":8,"fl":2,"tp":"mágico","m":"P"},{"k":"h","n":1}],[{"k":"d","n":1,"die":8,"fl":0,"tp":"","m":null}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Delinquente","t":"Talento","l":1,"c":0,"x":["Você tem vantagem em testes para arrombar fechaduras não mágicas, desarmar armadilhas não mágicas ou roubar itens de um alvo (seja por meio da furtividade ou da força)."],"ax":[[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Disfarce Inquietante","t":"Feitiço","l":1,"c":0,"x":["Quando tem alguns minutos para se preparar, você pode **marcar 1 Ponto de Fadiga** para tomar a forma de qualquer humanoide que você possa ver com clareza em sua mente. Enquanto estiver disfarçado dessa forma, você tem vantagem em testes de Presença para evitar ser descoberto.","Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando fizer uma ação enquanto estiver disfarçado, gaste um marcador. Após a ação que consumiu o último marcador, o efeito termina."],"ax":[[],[]],"ef":[],"tk":1},{"d":"Meia-noite","n":"Espírito da Meia-Noite","t":"Feitiço","l":2,"c":1,"x":["**Gaste 1 Ponto de Esperança** para invocar um espírito de tamanho humanoide que pode se mover ou carregar coisas para você até seu próximo descanso. Você também pode mandá-lo atacar, um adversário. Ao fazer isso, faça um **teste de conjuração** contra um alvo muito distante. Em um sucesso, o espírito se move até ficar corpo a corpo ao alvo. Role um número de **d6** igual ao seu atributo de conjuração e cause o resultado deles como dano mágico ao alvo. O espírito então se dissipa. Você pode ter apenas um espírito por vez."],"ax":[[{"k":"h","n":1},{"k":"rd","die":6,"m":"C"}]],"ef":[],"tk":0},{"d":"Graça","n":"Notoriedade","t":"Talento","l":10,"c":0,"x":["As pessoas sabem quem você é e o que já fez; por isso, o tratam de forma diferente. Ao se aproveitar de sua notoriedade para conseguir o que quer, você pode **marcar 1 Ponto de Fadiga** antes do teste para receber um bônus de +10 no resultado. Onde quer que vá, você obtém comida e bebida grátis, e o preço das outras mercadorias que você compra diminui em uma bolsa de ouro (até o mínimo de um punhado).","Esta carta não conta para o limite de 5 cartas de domínio na sua mão e não pode ser colocada na reserva."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Sombra Traiçoeira","t":"Feitiço","l":2,"c":0,"x":["Faça um **teste de conjuração** contra todos os adversários muito próximos. Alvos atingidos ficam temporariamente *Imobilizados* pela própria sombra no lugar em que estão."],"ax":[[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Estrangulamento","t":"Talento","l":3,"c":1,"x":["Quando se posiciona atrás de uma criatura de tamanho similar ao seu, você pode **marcar 1 Ponto de Fadiga** para estrangulá-la, deixando-a temporariamente *Vulnerável*.","Quando uma criatura ataca um alvo *Vulnerável* dessa forma, ela causa **2d6** de dano adicional."],"ax":[[],[{"k":"d","n":2,"die":6,"fl":0,"tp":"","m":null}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Véu da Noite","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, crie uma cortina de escuridão entre dois pontos em alcance distante. Apenas você pode enxergar através dessa escuridão. Você é considerado *Escondido* para adversários no outro lado da cortina e tem vantagem em testes de ataque feitos através da escuridão. A cortina dura até você conjurar outro feitiço."],"ax":[[{"k":"c","dif":13}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Glifo do Ocaso","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para conjurar um glifo sombrio sobre ele. O glifo expõe os pontos fracos do alvo, reduzindo temporariamente sua Dificuldade em um valor igual ao seu Conhecimento (mínimo de 1)."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Mestre da Furtividade","t":"Talento","l":4,"c":0,"x":["Ao rolar com Medo enquanto tenta se mover por uma área perigosa sem ser percebido, você pode **marcar 1 PF** para rolar com Esperança em vez disso.","Se um aliado próximo também estiver tentando se mover sem ser percebido e rolar com Medo, você pode **marcar 1 PF** para mudar o resultado e fazê-lo rolar com Esperança."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Recuo Espectral","t":"Feitiço","l":5,"c":2,"x":["**Gaste 1 Ponto de Esperança** para ativar Recuo Espectral no local onde você está. **Gaste mais 1 Ponto de Esperança** a qualquer momento antes de seu próximo descanso para desaparecer da sua localização atual e reaparecer no local onde estava quando ativou Recuo Espectral. Depois que você reaparecer, este feitiço termina."],"ax":[[{"k":"h","n":1}]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Silêncio","t":"Feitiço","l":5,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para conjurar um efeito mágico supressor sobre o alvo. Esse efeito afeta tudo em alcance muito próximo do alvo e o acompanha quando ele se move.","O alvo, e tudo mais na área afetada, fica *Silenciado*. Enquanto estiver *Silenciado*, o alvo não pode fazer barulho ou conjurar feitiços. Essa condição dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrá-la, até você conjurar Silêncio novamente ou até você sofrer dano maior."],"ax":[[{"k":"h","n":1}],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Disfarce em Massa","t":"Feitiço","l":6,"c":0,"x":["Quando tem alguns minutos de silêncio para se concentrar, você pode **marcar 1 Ponto de Fadiga** para alterar a aparência de todas as criaturas Próximas voluntárias. As novas formas devem ter estrutura corporal e tamanho semelhantes e podem ser tanto algo ou alguém que você já tenha visto quanto criação sua. Uma criatura disfarçada dessa forma tem vantagem em testes de Presença para evitar ser descoberta.","Ative uma contagem regressiva (8). Ela diminui em virtude de uma consequência escolhida pelo mestre. Quando a consequência da contagem regressiva é ativada, o disfarce termina."],"ax":[[],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Sussurros Sombrios","t":"Feitiço","l":6,"c":0,"x":["Você pode se comunicar mentalmente com qualquer pessoa com a qual tenha tido contato físico. Uma vez que tenha aberto um canal de comunicação com o alvo, ele pode se comunicar com você da mesma forma. Além disso, você pode **marcar 1 Ponto de Fadiga** para fazer um **teste de conjuração** contra ele. Em um sucesso, você pode fazer uma das seguintes perguntas, que deve ser respondida pelo mestre:","• Onde a pessoa está? O que ela está fazendo? Do que ela tem medo? Com o que ela mais se preocupa?"],"ax":[[],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Dom da Meia-Noite","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Meia-noite, receba os seguintes benefícios:","• Uma vez por descanso, se você tiver 0 Ponto de Esperança e o mestre for receber Medo, em vez disso, você pode receber 1 Ponto de Esperança;","• Ao acertar um ataque, você pode **marcar 1 Ponto de Fadiga** para somar o resultado de seu Dado de Medo à rolagem de dano."],"ax":[[],[{"k":"gh","n":1},{"k":"u","s":"D"}],[]],"ef":[],"tk":0},{"d":"Meia-noite","n":"Esvanecer","t":"Feitiço","l":7,"c":1,"x":["Quando um ataque que causaria dano físico a você falha, você pode **gastar 1 Ponto de Esperança** para ficar","*Escondido* em um invólucro de sombras e se teleportar para um ponto próximo do atacante. Você permanece *Escondido* até o próximo teste que fizer."],"ax":[[],[]],"ef":[],"tk":0},{"d":
