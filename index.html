const clsGrad=(c,a=90)=>{const k=clsC(c);return k.length>1?`linear-gradient(${a}deg,${k[0]},${k[1]})`:k[0]||'#c9a227'};
const domChip=d=>`<span class="dchip" style="background:${domC(d)};color:${domT(d)}">${d}</span>`;
const hasCls=c=>S.cls==c||S.mc.some(m=>m.c==c);
function applyTheme(){const r=document.documentElement.style,k=(tab!='h'&&S&&C[S.cls])?clsC(S.cls):[];r.setProperty('--c1',k[0]||'#c9a227');r.setProperty('--c2',k[1]||k[0]||'#c9a227')}
function castIdx(){const idx=sub=>{const a=sub&&sub.a.find(x=>/Conjuração/.test(x.h));return a?AT.indexOf(a.p[0]):-1},main=idx(curSub()),m=S.mc[0],ms=m&&(DB.subs[m.c]||[]).find(x=>x.n==m.s),mci=idx(ms);if(S.castPick=='mc'&&mci>=0)return mci;return main>=0?main:mci}
let MCF={c:'',d:'',s:''};
const mcAvail=c=>(C[c]?C[c].d:[]).filter(x=>!D().doms.includes(x));
const secBlock=(a,cc,sn)=>{const key=['s',cc,sn,a.h].join(SEP),o=srcOf(key);return`<div style="margin:8px 0"><b class="t" style="font-size:11px">■ ${a.h}</b>${a.p.map((p,pi)=>(p.startsWith('• ')?`<p class="li">${md(p.slice(2))}</p>`:`<p style="margin:2px 0">${md(p)}</p>`)+actBar(o,key,pi)).join('')}${efPanel(o,key)}${o.tk?tokBar(o,key):''}</div>`};
function mcBlock(m,i,d){const g=DB.guide[m.c],key='f'+SEP+m.c,o=srcOf(key),subs=DB.subs[m.c]||[],sb=subs.find(x=>x.n==m.s),cap=Math.ceil(S.lvl/2),mci=(()=>{const a=sb&&sb.a.find(x=>/Conjuração/.test(x.h));return a?AT.indexOf(a.p[0]):-1})(),mainI=(()=>{const s=curSub(),a=s&&s.a.find(x=>/Conjuração/.test(x.h));return a?AT.indexOf(a.p[0]):-1})();
return`<div class="bx mcb" style="margin-top:24px;--g:${clsGrad(m.c)}"><h3>${E(m.c)} · ficha de multiclasse</h3><p class="tag">Ao optar por multiclasse, você coloca uma das cartas fundamentais da classe na sua mão e escolhe um domínio para expandir.</p>
<span class="lbl">Domínio expandido</span><div class="row">${(C[m.c]?C[m.c].d:[]).map(x=>{const own=D().doms.includes(x)&&x!=m.d,sel=x==m.d;return`<button class="btn ${sel?'':'x'}" ${own?'disabled':''} data-a="mcdom" data-v="${i}|${x}" style="${sel?'background:'+domC(x)+';color:'+domT(x):'border-color:'+domC(x)}${own?';opacity:.4':''}">${x}${own?' (já acessível)':''}</button>`}).join('')}</div>
<p class="tag">Ao subir de nível, você pode escolher cartas desse domínio de nível igual ou menor que a metade do seu (arredondando para cima): <b>nível máximo ${cap}</b>.</p>
<span class="lbl" style="margin-top:8px">Subclasse (carta fundamental)</span><select data-n="mc.${i}.s"><option value="">Escolha</option>${subs.map(s=>`<option ${s.n==m.s?'selected':''}>${s.n}</option>`).join('')}</select>${sb?sb.a.filter(a=>/Fundamental|Fundamentais/.test(a.h)).map(a=>secBlock(a,m.c,sb.n)).join(''):''}
${mci>=0&&mainI>=0&&mci!=mainI?`<span class="lbl" style="margin-top:8px">Atributo de conjuração em testes de conjuração</span><div class="row"><button class="btn ${S.castPick=='mc'?'x':'g'}" data-a="cast" data-v="main">Subclasse principal (${AT[mainI]})</button><button class="btn ${S.castPick=='mc'?'g':'x'}" data-a="cast" data-v="mc">Multiclasse (${AT[mci]})</button></div>`:''}
<div class="t" style="margin:16px 0 4px;font:800 13px Montserrat,sans-serif;text-transform:uppercase">Habilidade${g.feat.length>1?'s':''} de multiclasse</div>${g.feat.map((p,pi)=>(p.startsWith('• ')?`<p class="li">${md(p.slice(2))}</p>`:`<p style="margin:0 0 8px">${md(p)}</p>`)+actBar(o,key,pi)).join('')}${efPanel(o,key)}${o.tk?tokBar(o,key):''}${widgets(d,m.c)}
<span class="lbl" style="margin-top:12px">Anotações</span><textarea rows="4" data-n="mc.${i}.n">${E(m.n||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn x" data-a="mcrm" data-v="${i}">Remover multiclasse</button></div></div>`}
function mcHTML(d){const rules=`<p>A partir do nível 5, ao subir de nível você pode escolher a opção de multiclasse (aba Progresso): escolha uma classe adicional e um de seus domínios <b>ao qual você ainda não tem acesso</b>. Você recebe as habilidades iniciais da nova classe, escolhe uma carta fundamental de uma de suas subclasses e passa a poder escolher cartas do novo domínio de nível igual ou menor que a metade do seu. Você só pode ter uma multiclasse.</p>`;
const cl=Object.keys(C).filter(c=>c!=S.cls&&mcAvail(c).length).sort(),doms=MCF.c?mcAvail(MCF.c):[],ss=MCF.c?(DB.subs[MCF.c]||[]):[];
const add=S.mc.length?'':`<div class="bx" style="margin-top:20px"><h3>Adicionar multiclasse</h3><p class="tag">Use isto se você já fez a escolha em jogo (ou ao importar um personagem). Fora isso, a escolha acontece ao subir de nível.</p><div class="cols3"><div><span class="lbl">Classe</span><select data-mcf="c"><option value="">Escolha</option>${cl.map(c=>`<option ${c==MCF.c?'selected':''} value="${c}">${c}${isVoid(c)?' · Void':''}</option>`).join('')}</select></div><div><span class="lbl">Domínio</span><select data-mcf="d"><option value="">Escolha</option>${doms.map(x=>`<option ${x==MCF.d?'selected':''}>${x}</option>`).join('')}</select></div><div><span class="lbl">Subclasse</span><select data-mcf="s"><option value="">Escolha</option>${ss.map(x=>`<option ${x.n==MCF.s?'selected':''}>${x.n}</option>`).join('')}</select></div></div><div style="margin-top:10px"><button class="btn g" data-a="mcadd">Adicionar</button></div></div>`;
return`<div class="sheet in" style="padding:18px"><h2>Multiclasse</h2>${rules}${S.mc.map((m,i)=>mcBlock(m,i,d)).join('')}${add}</div>`}
document.addEventListener('change',e=>{const k=e.target.dataset.mcf;if(!k)return;MCF[k]=e.target.value;if(k=='c'){MCF.d='';MCF.s=''}render()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=='mcdom'){const[i,dm]=v.split('|');S.mc[+i].d=dm;render()}
else if(a=='cast'){S.castPick=v;render()}
else if(a=='mcrm')ask('Remover a multiclasse? Cartas do domínio adicional continuam na sua lista, mas deixam de ser acessíveis.',()=>{S.mc=[];S.castPick='main';render()});
else if(a=='mcadd'){if(!MCF.c||!MCF.d)return flash('Escolha a classe e o domínio.');if(D().doms.includes(MCF.d))return flash('Esse domínio você já possui.');S.mc.push({c:MCF.c,d:MCF.d,s:MCF.s});MCF={c:'',d:'',s:''};render()}});

initChars();render();drawer();
</script></body></html>
