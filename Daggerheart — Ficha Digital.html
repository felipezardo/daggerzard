.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

S.pr+=1+(p.pr||0);if([2,5,8].includes(L)){const n=document.getElementById('nx').value;const f=S.ex.findIndex(e=>!e.n&&!e.b);const idx=f>=0?f:S.ex.findIndex(e=>!e.n);S.ex[idx>=0?idx:0]={n,b:2}}

function dice(n){return Array.from({length:n},()=>1+Math.floor(Math.random()*12))}
function openRoll(label,bonus,kind,extra){const d=D(),xs=RM.xp.filter(i=>S.ex[i]&&S.ex[i].n);if(xs.length&&S.hope<xs.length){toast('Esperança insuficiente para as Experiências escolhidas.');return}
const xb=xs.reduce((n,i)=>n+S.ex[i].b,0),ov=document.getElementById('ov');
const h=1+Math.floor(Math.random()*12),f=1+Math.floor(Math.random()*12),av=RM.adv?1+Math.floor(Math.random()*6):0,tot=h+f+bonus+xb+RM.mod+RM.adv*av;
ov.innerHTML=`<div class="rs"><div class="t">${label}</div><div class="dc"><div class="d h roll" id="dh">?</div><div class="d f roll" id="df">?</div>${RM.adv?'<div class="d s roll" id="ds">?</div>':''}</div><div class="big" id="tt"></div><div class="out" id="oo"></div><p class="tag" id="dd"></p><button class="btn" data-ok="1" style="margin-top:12px">Fechar</button></div>`;ov.classList.add('o');
const sh=setInterval(()=>{['dh','df','ds'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=1+Math.floor(Math.random()*12)})},70);
setTimeout(()=>{clearInterval(sh);['dh','df','ds'].forEach(i=>document.getElementById(i)?.classList.remove('roll'));
document.getElementById('dh').textContent=h;document.getElementById('df').textContent=f;if(av)document.getElementById('ds').textContent=av;
const crit=h==f,hopeW=h>f;let o=crit?'Sucesso crítico!':hopeW?'Com Esperança':'Com Medo',tx=`${h} + ${f}${av?(RM.adv>0?' + ':' − ')+av:''} ${sg(bonus+xb+RM.mod)}`;
if(xs.length){S.hope-=xs.length}if(S.cls=='Mago'&&(h==S.pn||f==S.pn)){o+=' · Padrão Estranho (+1 Esperança)';S.hope=Math.min(D().hm,S.hope+1)}
if(kind=='atk'||kind=='chk'){if(crit||hopeW)S.hope=Math.min(D().hm,S.hope+1);if(crit&&S.st>0)S.st--;
if(RM.dif!==''){const ok=crit||tot>=+RM.dif;o+=ok?' · Sucesso':' · Falha'}}
document.getElementById('tt').textContent=tot;document.getElementById('oo').textContent=o;document.getElementById('dd').textContent=tx+(xs.length?' · Esperança −'+xs.length:'')+(crit||hopeW?' · +1 Esperança':'');
LOG.unshift(`<b>${label}</b>: ${tot} — ${o}<br><span class="tag">${tx}</span>`);RM.xp=[];render();drawer()},900)}


document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-p],[data-r],[data-atk],[data-dmg],[data-hit],[data-add],[data-mv],[data-rm],[data-lu],[data-lm],[data-lp],[data-lc],[data-ok],[data-adv],[data-quick],[data-clr],[data-rest],[data-new],[data-th],#fab');if(!t)return;const g=a=>t.dataset[a];
if(t.id=='fab'){drawer();document.getElementById('dr').classList.toggle('o');return}
if(g('ok')){document.getElementById('ov').classList.remove('o');lu=null;return}
if(g('t')){tab=g('t');render()}
else if(g('th')){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#17171a';r.dataset.theme=dk?'light':'dark'}
else if(g('p')){const k=g('p'),i=+g('i');S[k]=S[k]==i+1?i:i+1;render()}
else if(g('r')){const d=D(),i=+g('r');openRoll(AT[i],d.at[i],'chk')}
else if(g('atk')){const w=wf(S[g('atk')]),d=D();openRoll('Ataque · '+w[0],d.at[w[1]]+(/Confiável/.test(w[6]||'')?1:0),'atk')}
else if(g('dmg'))dmgRoll(g('dmg'));
else if(g('hit')){const v=+document.getElementById('dmgin').value,d=D();if(!(v>0))return;let m=v>=d.t2?3:v>=d.t1?2:1;if(document.getElementById('usear').checked&&S.ar<d.pa){S.ar++;m=Math.max(0,m-1)}S.pv=Math.min(12,S.pv+m);render();toast(`${v} de dano → ${m} PV marcado(s).`+(S.pv>=d.pv?' <b>Você está sem PV!</b>':''))}
else if(g('add')){const d=D(),n=document.getElementById('cn').value.trim(),dm=document.getElementById('cd').value,l=+document.getElementById('cl').value;if(!n)return;if(l<1||l>d.cap(dm))return toast(`Carta de ${dm} deve ter nível entre 1 e ${d.cap(dm)}.`);S.cards.push({n,d:dm,l,t:document.getElementById('ct').value,lo:S.cards.filter(c=>c.lo).length<5});render()}
else if(g('mv')){const c=S.cards[+g('mv')];if(!c.lo&&S.cards.filter(x=>x.lo).length>=5)return toast('Máximo de 5 cartas equipadas.');c.lo=!c.lo;render()}
else if(g('rm')){S.cards.splice(+g('rm'),1);render()}
else if(g('lu')){lu={p:{},pts:2};luModal()}
else if(g('lp')){const o=OP.find(x=>x[0]==g('lp')),t=tier(S.lvl+1);if(lu.pts<o[2]||cnt(o[0],t)+(lu.p[o[0]]||0)>=o[3])return;if(o[0]=='mc'&&(cnt('sub',t)>0||lu.p.sub))return;if(o[0]=='sub'&&(cnt('mc',t)>0||lu.p.mc))return;if(['pr','mc'].includes(o[0])&&Object.keys(lu.p).some(k=>lu.p[k]&&k!=o[0]))return;if(!['pr','mc'].includes(o[0])&&(lu.p.pr||lu.p.mc))return;lu.p[o[0]]=(lu.p[o[0]]||0)+1;lu.pts-=o[2];luModal()}
else if(g('lm')){const o=OP.find(x=>x[0]==g('lm'));if(lu.p[o[0]]>0){lu.p[o[0]]--;lu.pts+=o[2];luModal()}}
else if(g('lc'))luConfirm();
else if(g('adv')){RM.adv=+g('adv');drawer()}
else if(g('quick')){RM.mod=+document.getElementById('rmod').value;RM.dif=document.getElementById('rdif').value;openRoll('Teste livre',0,'chk')}
else if(g('clr')){LOG=[];drawer()}
else if(g('rest')){S.pv=0;S.st=0;S.ar=0;render();toast('Descanso longo: PV, PF e Armadura recuperados.')}
else if(g('new')){if(confirm('Apagar o personagem atual?')){S=fresh(S.cls);render()}}});

const DB={"cards":[{"d":"Arcano","n":"Caminhar na Parede","t":"Feitiço","l":1,"c":1,"x":["**Gaste 1 Ponto de Esperança**: uma criatura tocada por você pode escalar paredes e tetos como se estivesse caminhando em terra firme. Esse efeito dura até o fim da cena ou até você conjurar Caminhar na Parede novamente."]},{"d":"Arcano","n":"Caos Liberto","t":"Feitiço","l":1,"c":1,"x":["No início da sessão, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta.","Faça um **teste de conjuração** contra um alvo distante e gaste qualquer número de marcadores para canalizar energia bruta de seu interior e liberá-la contra ele. Em um sucesso, role uma quantidade de **d10** igual ao número de marcadores que gastou e cause o resultado deles como dano mágico ao alvo. **Marque 1 Ponto de Fadiga** para recarregar esta carta com marcadores (até uma quantidade igual ao seu atributo de conjuração).","No fim de cada sessão, marcadores não utilizados são perdidos."]},{"d":"Arcano","n":"Proteção Rúnica","t":"Feitiço","l":1,"c":0,"x":["Você tem um talismã pessoal que pode ser infundido com magia protetora e usado por você ou por um aliado. Descreva o que esse item é e por que ele é importante para você. O portador da proteção pode gastar 1 Ponto de Esperança para reduzir o dano sofrido em **1d8**.","Se tirar 8 nesse dado, o poder da Proteção Rúnica se encerra após reduzir dano neste turno. Ela pode ser recarregada sem custo no seu próximo descanso."]},{"d":"Arcano","n":"Incendiar","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo corpo a corpo. Em um sucesso, o alvo instantaneamente irrompe em chamas, sofre **1d20+3** de dano mágico e fica temporariamente *Em Chamas*.","Quando uma criatura *Em Chamas* age, ela sofre **2d6** de dano mágico adicional se ainda estiver *Em Chamas* no fim da ação dela."]},{"d":"Arcano","n":"Olho Flutuante","t":"Feitiço","l":2,"c":0,"x":["**Gaste 1 Ponto de Esperança** para criar um pequeno orbe flutuante que você pode mover para um ponto qualquer em alcance muito distante. Enquanto este feitiço estiver ativo, você pode ver pelo orbe como se estivesse onde ele está. Você pode escolher entre usar seus próprios sentidos ou os do orbe como quiser. Se o orbe sofrer dano ou sair do alcance, o feitiço termina.","• *10*"]},{"d":"Arcano","n":"Contramágica","t":"Feitiço","l":3,"c":2,"x":["Você pode interromper um efeito mágico em andamento fazendo um teste de reação com seu atributo de conjuração. Em um sucesso, o efeito termina, quaisquer consequências são evitadas e esta carta vai para sua reserva."]},{"d":"Arcano","n":"Voo","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, coloque um número de marcadores igual à sua Agilidade nesta carta (mínimo de 1). Ao fazer um teste enquanto estiver voando, gaste um marcador desta carta. Após terminar a ação que consumiu o último marcador, você desce para o solo diretamente abaixo de você."]},{"d":"Arcano","n":"Impacto Defensivo","t":"Feitiço","l":4,"c":2,"x":["Faça um **teste de conjuração** contra todos os alvos corpo a corpo. Alvos atingidos são empurrados para um ponto qualquer em alcance distante e sofrem **d8+3** de dano mágico usando seu atributo de conjuração."]},{"d":"Arcano","n":"Translocação","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração (12)**. Em um sucesso, **gaste 1 Ponto de Esperança** para se teleportar a um ponto que você possa ver em alcance distante. Se houver criaturas voluntárias Muito Próximas, **gaste 1 Ponto de Esperança adicional** para cada criatura que quiser levar consigo."]},{"d":"Arcano","n":"Corrente de Relâmpagos","t":"Feitiço","l":5,"c":1,"x":["**Marque 2 Pontos de Fadiga** para fazer um **teste de conjuração** e liberar relâmpagos em cadeia contra todos os alvos próximos. Alvos atingidos devem fazer um teste de reação com Dificuldade igual ao resultado de seu teste de conjuração. Se falharem, sofrem **2d8+4** de dano mágico. Adversários adicionais que não tenham sido alvo da Corrente de Relâmpagos e estejam próximos dos alvos que sofreram dano também devem fazer um teste de reação. Se falharem, sofrem **2d8+4** de dano mágico. A corrente continua até não haver mais adversários no alcance."]},{"d":"Arcano","n":"Premonição","t":"Feitiço","l":5,"c":2,"x":["Você pode canalizar energia arcana para ter visões do futuro. Uma vez por descanso longo, imediatamente após o mestre apresentar as consequências de um teste que você fez, você pode ignorar esse movimento e suas consequências como se elas não tivessem acontecido e fazer outro movimento no lugar."]},{"d":"Arcano","n":"Fenda Espacial","t":"Feitiço","l":6,"c":2,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, você faz uma marca arcana no solo onde está no momento. Na próxima vez que você conjurar Fenda Espacial, abre-se um portal que fornece passagem segura para o ponto exato onde a marca foi colocada. A fenda permanece aberta até você fechá-la ou até conjurar outro feitiço.","Você pode cancelar o feitiço a qualquer momento para conjurar Fenda Espacial novamente e marcar outro lugar."]},{"d":"Arcano","n":"Telecinese","t":"Feitiço","l":6,"c":0,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, você pode usar sua mente para movê-lo para um ponto qualquer em alcance distante relativo à posição inicial dele. Você também pode arremessá-lo como um ataque, fazendo um teste de conjuração adicional contra o alvo desse ataque. Em um sucesso, você causa **d12+4** de dano físico ao segundo alvo com sua Proficiência. Depois disso, o feitiço acaba."]},{"d":"Arcano","n":"Dom Arcano","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio Arcano, receba os seguintes benefícios:","• Bônus de +1 em testes de conjuração;","• Uma vez por descanso, você pode trocar os resultados dos Dados de Esperança e Medo um pelo outro."]},{"d":"Arcano","n":"Ocultação","t":"Feitiço","l":7,"c":2,"x":["Ao ter sucesso em um **teste de conjuração** para conjurar um feitiço diferente, você pode **gastar 1 Ponto de Esperança** para ficar *Oculto*. Enquanto estiver *Oculto*, quando um adversário se movimentar para um lugar de onde normalmente veria você, ele não pode vê-lo se você estiver parado. Ao entrar ou se movimentar dentro da linha de visão de um adversário, ou ao atacar, você deixa de estar *Oculto*."]},{"d":"Arcano","n":"Aura de Confusão","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, você cria uma camada ilusória sobre seu corpo, que torna difícil distinguir exatamente onde você está. **Marque um número qualquer de Pontos de Fadiga** e crie uma quantidade de camadas igual aos PF marcados. Quando um adversário ataca você, role um número de **d6** igual à quantidade de camadas que tem no momento. Se tirar 5 ou mais em qualquer dado, uma camada da aura é destruída e o ataque falha. Se todos os resultados forem 4 ou menos, você sofre o dano e o feitiço termina."]},{"d":"Arcano","n":"Reflexo Arcano","t":"Feitiço","l":8,"c":1,"x":["Quando for sofrer dano mágico, você pode **gastar qualquer quantidade de Pontos de Esperança** e rolar um número equivalente de **d6**. Se tirar 6 em qualquer um desses dados, o ataque é refletido e, em vez de causar dano a você, causa dano ao atacante."]},{"d":"Arcano","n":"Projeção Sensorial","t":"Feitiço","l":9,"c":0,"x":["Uma vez por descanso, faça um **teste de conjuração (15)**. Em um sucesso, você entra numa visão que lhe permite ver e ouvir claramente qualquer lugar onde já esteve anteriormente, como se estivesse lá no momento. Você pode se mover livremente dentro da visão, sem sofrer as restrições físicas de ter um corpo material. Este feitiço não pode ser detectado por meios mágicos ou mundanos. Você sai da visão ao sofrer dano ou ao conjurar outra magia."]},{"d":"Arcano","n":"Terremoto","t":"Feitiço","l":9,"c":2,"x":["Faça um teste de conjuração (16). Uma vez por descanso, em um sucesso, todos os alvos Muito distantes que não estiverem voando devem fazer um teste de reação (18). Quem falhar sofre **3d10+8** de dano físico e fica temporariamente *Vulnerável*. Quem passar sofre metade do dano.","Além disso, quando você tem sucesso no teste de conjuração, o terreno dentro do alcance muito distante tornase difícil e as estruturas dentro desse alcance podem ser danificadas ou desmoronar completamente."]},{"d":"Arcano","n":"Ajustar Realidade","t":"Feitiço","l":10,"c":1,"x":["Quando você ou um aliado voluntário faz uma rolagem, você pode **gastar 5 Pontos de Esperança** para mudar o resultado para um à sua escolha — ele deve ser plausível dentro das possibilidades fornecidas pelos dados."]},{"d":"Arcano","n":"Chuva Arcana","t":"Feitiço","l":10,"c":1,"x":["Faça um **teste de conjuração** contra todos os adversários distantes. **Marque uma quantidade qualquer de Pontos de Fadiga** para fazer chover fragmentos arcanos. Alvos atingidos sofrem **1d20+2** de dano mágico para cada PF marcado."]},{"d":"Lâmina","n":"Levante-Se","t":"Talento","l":1,"c":1,"x":["Ao sofrer dano grave, você pode **marcar 1 Ponto de Fadiga** para reduzir a gravidade em um limiar."]},{"d":"Lâmina","n":"Não o Suficiente","t":"Talento","l":1,"c":1,"x":["Ao rolar dados de dano, você pode rolar novamente quaisquer resultados 1 ou 2."]},{"d":"Lâmina","n":"Turbilhão","t":"Talento","l":1,"c":0,"x":["Quando acerta um ataque contra um alvo muito próximo, você pode **gastar 1 Ponto de Esperança** para usar este ataque contra todos os outros alvos muito próximos. Todos os adversários adicionais que você acertar ao usar este talento sofrem metade do dano."]},{"d":"Lâmina","n":"Ataque Imprudente","t":"Talento","l":2,"c":1,"x":["**Marque 1 Ponto de Fadiga** para receber vantagem em um teste de ataque."]},{"d":"Lâmina","n":"Fraternidade Marcial","t":"Talento","l":2,"c":1,"x":["Uma vez por descanso longo, ao elogiar ou perguntar algo que alguém faz bem, vocês recebem 3 Pontos de Esperança."]},{"d":"Lâmina","n":"Mexa-Se","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso, quando uma criatura corpo a corpo for causar dano a você, você pode evitar o ataque e sair com segurança do alcance do inimigo."]},{"d":"Lâmina","n":"Versatilidade","t":"Talento","l":3,"c":1,"x":["Em vez de usar o atributo requerido por uma arma equipada, você pode usar um atributo diferente. Ao causar dano, você pode **marcar 1 Ponto de Fadiga** para usar o valor máximo de um de seus dados de dano."]},{"d":"Lâmina","n":"Armadura Fortificada","t":"Talento","l":4,"c":0,"x":["Você recebe um bônus de +2 nos seus limiares de dano enquanto estiver usando armadura."]},{"d":"Lâmina","n":"Concentração Mortal","t":"Talento","l":4,"c":2,"x":["Uma vez por descanso, você pode se concentrar totalmente em um alvo à sua escolha, recebendo um bônus de +1 em sua Proficiência. Esse bônus dura até você derrotar o alvo, atacar outra criatura ou a batalha terminar."]},{"d":"Lâmina","n":"Vantagem do Campeão","t":"Talento","l":5,"c":1,"x":["Ao ter sucesso crítico em um ataque, você pode **gastar até 3 Pontos de Esperança** e escolher uma das opções a seguir para cada Ponto de Esperança gasto dessa forma:","• Você recupera 1 Ponto de Vida;","• Você recupera 1 Ponto de Armadura;","• O alvo deve marcar 1 PV adicional.","Você não pode escolher a mesma opção mais de uma vez."]},{"d":"Lâmina","n":"Vitalidade","t":"Talento","l":5,"c":0,"x":["Ao escolher esta carta, receba dois destes benefícios permanentemente:","• 1 PF adicional;","• 1 PV adicional;","• Bônus de +2 em seus limiares de dano.","Em seguida, coloque esta carta na sua reserva permanentemente."]},{"d":"Lâmina","n":"Calejado pela Batalha","t":"Talento","l":6,"c":2,"x":["Uma vez por descanso longo, quando for fazer um movimento de morte, você pode **gastar 1 Ponto de Esperança** para, em vez disso, recuperar 1 PV."]},{"d":"Lâmina","n":"Fúria","t":"Talento","l":6,"c":1,"x":["Antes de fazer um ataque, você pode **marcar 1 Ponto de Fadiga** para receber um bônus igual ao dobro de sua Força na rolagem de dano. Você pode ativar este talento duas vezes por ataque."]},{"d":"Lâmina","n":"Dom da Lâmina","t":"Talento","l":7,"c":1,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Lâmina, receba os seguintes benefícios:","• Bônus de +2 em testes de ataque;","• Bônus de +4 no seu limiar de dano grave."]},{"d":"Lâmina","n":"Golpe de Raspão","t":"Talento","l":7,"c":1,"x":["Quando erra um ataque, você pode **marcar 1 Ponto de Fadiga** para causar o dano da arma usando metade de sua Proficiência."]},{"d":"Lâmina","n":"Grito de Guerra","t":"Talento","l":8,"c":2,"x":["Uma vez por descanso longo, enquanto se lança rumo ao perigo, você pode emitir um grito de guerra que inspira seus aliados. Cada aliado capaz de ouvilo recupera 1 Ponto de Fadiga e ganha 1 Ponto de Esperança. Além disso, seus aliados fazem testes de ataque com vantagem até que você ou algum aliado role uma falha com Medo."]},{"d":"Lâmina","n":"Frenesi","t":"Talento","l":8,"c":3,"x":["Uma vez por descanso longo, você pode entrar *Em Frenesi* até que não haja mais adversários na sua linha de visão.","Enquanto estiver *Em Frenesi*, você não pode usar PA, ganha um bônus de +10 em rolagens de dano e um bônus de +8 no seu limiar de dano grave."]},{"d":"Lâmina","n":"Golpe da Morte","t":"Talento","l":9,"c":3,"x":["Uma vez por descanso longo, **gaste 1 Ponto de Esperança** para fazer um teste de ataque. O mestre informa contra quais alvos no alcance da arma o teste teria sucesso. Escolha um desses alvos e force- o a marcar 5 PV."]},{"d":"Lâmina","n":"Guerra e Glória","t":"Talento","l":9,"c":2,"x":["Em um sucesso crítico ao atacar com uma arma, receba 1 Ponto de Esperança adicional ou recupere 1 Ponto de Fadiga adicional.","Além disso, ao causar dano suficiente para derrotar um inimigo, receba 1 Ponto de Esperança ou recupere 1 PF."]},{"d":"Falange","n":"Intocável","t":"Talento","l":1,"c":1,"x":["Receba um bônus na Evasão igual à metade da sua Agilidade."]},{"d":"Falange","n":"Movimento Ligeiro","t":"Talento","l":1,"c":0,"x":["Uma vez por descanso, **marque 1 PF** para se deslocar para qualquer lugar em alcance distante sem precisar de um teste de Agilidade.","Se terminar esse movimento em alcance corpo a corpo de um adversário e imediatamente atacá-lo, você ganha um bônus de +1 no teste de ataque."]},{"d":"Falange","n":"Um Passo à Frente","t":"Talento","l":1,"c":1,"x":["Quando você é alvo de um ataque originado de um ponto fora de alcance corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para rolar **1d4** e receber um bônus igual ao resultado na sua Evasão contra este ataque."]},{"d":"Falange","n":"Aproximação Estratégica","t":"Talento","l":2,"c":1,"x":["Após um descanso longo, coloque um número de marcadores igual ao seu Conhecimento nesta carta (mínimo de 1). Na primeira vez que você se mover para ficar próximo de um adversário e atacá-lo, você pode gastar um marcador para escolher uma das opções abaixo:","• Você faz o ataque com vantagem;","• Você recupera 1 Ponto de Fadiga de um aliado cac ao adversário;","• Você soma **1d8** à rolagem de dano. Após um descanso longo, marcadores não utilizados são perdidos."]},{"d":"Lâmina","n":"Monstro de Batalha","t":"Talento","l":10,"c":0,"x":["Ao acertar um ataque contra um adversário, em vez de rolar o dano, você pode **marcar 4 Pontos de Fadiga** para forçar o alvo a marcar um número de PV igual ao número de PV que você tem marcados no momento."]},{"d":"Lâmina","n":"Massacrar","t":"Talento","l":10,"c":3,"x":["Ao acertar um ataque com sua arma, você nunca causa dano abaixo do limiar de dano maior do alvo (ele sempre marca no mínimo 2 Pontos de Vida).","Além disso, quando uma criatura no alcance da sua arma causa dano a um aliado com um ataque que não tem você como alvo, você pode **marcar 1 PF** para forçá-la a fazer um teste de reação (15). Se falhar, o alvo deve marcar 1 Ponto de Vida."]},{"d":"Falange","n":"Ferocidade","t":"Talento","l":2,"c":2,"x":["Ao fazer com que um adversário marque 1 ou mais Pontos de Vida, você pode **gastar 2 Pontos de Esperança** para aumentar sua Evasão em um número igual à quantidade de PV que ele marcou. Esse bônus dura até o término do próximo ataque feito contra você."]},{"d":"Falange","n":"Resistir","t":"Talento","l":3,"c":1,"x":["Ao marcar 1 Ponto de Armadura para reduzir o dano sofrido, você pode **marcar 1 Ponto de Fadiga** para marcar 1 Ponto de Armadura adicional."]},{"d":"Falange","n":"Táticas","t":"Talento","l":3,"c":1,"x":["Ao prestar ajuda a um aliado, você pode **gastar 1 Ponto de Esperança** para somar uma de suas Experiências à rolagem, junto ao seu dado de vantagem.","Ao fazer um teste em dupla, você pode usar **1d20** como seu Dado de Esperança."]},{"d":"Falange","n":"Impulso","t":"Talento","l":4,"c":1,"x":["**Marque 1 Ponto de Fadiga** para usar um aliado próximo voluntário como impulso para se lançar no ar e fazer um ataque aéreo contra um alvo distante.","Você tem vantagem no ataque, soma **1d10** à rolagem de dano e termina seu movimento corpo a corpo ao alvo."]},{"d":"Falange","n":"Redirecionar","t":"Talento","l":4,"c":1,"x":["Quando um ataque originado de um ponto além do alcance corpo a corpo falha contra você, role um número de **d6** igual à sua Proficiência. Se tirar 6 em qualquer dado, você pode **marcar 1 Ponto de Fadiga** para redirecionar o ataque, fazendo-o causar dano a um adversário muito próximo."]},{"d":"Falange","n":"Conhece Teu Inimigo","t":"Talento","l":5,"c":1,"x":["Enquanto estiver observando uma criatura, você pode fazer um **teste de Instinto** contra ela. Em um sucesso, **gaste 1 Ponto de Esperança** e pergunte ao mestre uma das seguintes informações a respeito dela:","• PV e PF restantes;","• Dificuldade e limiares de dano;","• Táticas e dados de dano padrão;","• Habilidades e Experiências.","Além disso, em um sucesso, você pode **marcar 1 PF** para fazer o mestre perder 1 Ponto de Medo."]},{"d":"Falange","n":"Golpe Pessoal","t":"Talento","l":5,"c":1,"x":["Você tem um golpe icônico de combate. Descreva-o e dê um nome a ele. Uma vez por descanso, ao utilizá-lo como parte de uma ação, você pode rolar **1d20** como seu Dado de Esperança. Em um sucesso, recupere 1 Ponto de Fadiga."]},{"d":"Falange","n":"Contra-Ataque Rápido","t":"Talento","l":6,"c":0,"x":["Quando um ataque originado de um ponto em alcance corpo a corpo falha contra você, você pode **marcar 1 Ponto** **de Fadiga** e aproveitar a oportunidade para causar o dano de uma de suas armas ativas ao atacante."]},{"d":"Falange","n":"Recuperação","t":"Talento","l":6,"c":1,"x":["Durante um descanso curto, você pode escolher um movimento de repouso de descanso longo. Você pode **gastar 1 Ponto de Esperança** para permitir que um aliado também faça isso."]},{"d":"Falange","n":"Dom da Falange","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Falange, receba os seguintes benefícios:","• Bônus de +1 na Agilidade;","• Uma vez por descanso, você pode **gastar 3 Pontos de Esperança** para fazer com que um ataque bem-sucedido contra você falhe."]},{"d":"Falange","n":"Acuidade Cruel","t":"Talento","l":7,"c":1,"x":["Ao acertar um ataque com uma arma, receba um bônus igual à sua Acuidade ou Agilidade na rolagem de dano."]},{"d":"Falange","n":"Amontoar","t":"Talento","l":8,"c":1,"x":["Faça um teste de Agilidade contra todos os alvos próximos. **Gaste 1 Ponto de Esperança** para mover os alvos que você acerta, bem como quaisquer aliados próximos voluntários, para outro ponto em alcance próximo."]},{"d":"Falange","n":"Golpe Debilitante","t":"Talento","l":8,"c":3,"x":["Ao acertar um ataque, você pode **marcar 1 PF** para fazer com que o próximo ataque bem-sucedido contra o mesmo alvo cause **2d12** de dano adicional."]},{"d":"Falange","n":"Quase Lá","t":"Talento","l":9,"c":1,"x":["Se tiver 2 PV ou menos desmarcados, você não sofre dano menor."]},{"d":"Falange","n":"Ataque Fragmentado","t":"Talento","l":9,"c":3,"x":["**Gaste 1 Ponto de Esperança** e faça um ataque contra todos os adversários no alcance de sua arma. Uma vez por descanso longo, em um sucesso contra qualquer um dos alvos, some todo o dano causado e em seguida o redistribua como quiser entre os alvos atingidos. Antes de causar dano a um alvo, role um dado de dano adicional e some o resultado dele ao dano que causar ao alvo."]},{"d":"Falange","n":"Passo Célere","t":"Talento","l":10,"c":2,"x":["Quando um ataque falha contra você, recupere 1 Ponto de Fadiga. Se não puder recuperar PF, receba 1 Ponto de Esperança."]},{"d":"Falange","n":"Trajeto Mortal","t":"Talento","l":10,"c":1,"x":["**Gaste 3 Pontos de Esperança** para percorrer o campo de batalha em linha reta até um ponto em alcance distante, fazendo um ataque contra todos os adversários no alcance da sua arma ao longo do caminho percorrido. Escolha a ordem na qual o dano é causado aos alvos atingidos. Para o primeiro alvo, role o dano de sua arma com +1 de bônus na Proficiência. Depois disso, remova um dado do teste de dano e cause o dano restante ao próximo alvo. Continue removendo um dado para cada alvo subsequente até que não tenha mais dados de dano ou adversários. Você não pode escolher o mesmo alvo mais de uma vez por ataque."]},{"d":"Códice","n":"Livro de Ava","t":"Grimório","l":1,"c":2,"x":["*Propelir:* faça um **teste de conjuração** contra um alvo corpo a corpo. Em um sucesso, ele é empurrado para um ponto em alcance distante e sofre **d10+2** de dano mágico com sua Proficiência.","*Armadura de Tava:* **gaste 1 Ponto de Esperança** para conceder um bônus de +1 na Armadura a um alvo que você possa tocar. Esse bônus dura até o próximo descanso do alvo ou até que você conjure Armadura de Tava novamente.","*Estaca de Gelo:* faça um **teste de conjuração (12)** para invocar um grande espinho de gelo em alcance distante. Se usá-lo como arma, em vez disso, faça o teste de conjuração contra a Dificuldade do alvo. Em um sucesso, você causa **d6** de dano físico usando sua Proficiência."]},{"d":"Códice","n":"Livro de Illiat","t":"Grimório","l":1,"c":2,"x":["*Sonolência:* faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, ele fica *Adormecido* até sofrer dano ou até o mestre gastar 1 Ponto de Medo no turno dele para encerrar a condição.","*Saraivada Arcana:* uma vez por descanso, **gaste qualquer quantidade de Pontos de Esperança** para atirar projéteis mágicos que acertam um alvo próximo à sua escolha. Role um número de **d6** igual à quantidade de Pontos de Esperança gasta e cause o resultado deles como dano mágico ao alvo.","*Telepatia:* **gaste 1 Ponto de Esperança** para criar uma linha de comunicação mental com um alvo que você possa ver. Essa conexão dura até seu próximo descanso ou até você conjurar Telepatia novamente."]},{"d":"Códice","n":"Livro de Tyfar","t":"Grimório","l":1,"c":2,"x":["*Chama Selvagem:* faça um **teste de conjuração** contra até três adversários corpo a corpo. Chamas irrompem de sua mão. Alvos atingidos sofrem **2d6** de dano mágico e marcam 1 Ponto de Fadiga.","*Mão Arcana:* você conjura uma mão mágica idêntica à sua em força e tamanho num ponto em alcance distante.","*Névoa Misteriosa:* faça um **teste de conjuração (13)** para conjurar uma névoa densa que fica em uma área estática dentro do alcance muito próximo. A neblina deixa essa área e tudo o que há nela fortemente obscurecido."]},{"d":"Códice","n":"Livro de Sitil","t":"Grimório","l":2,"c":2,"x":["*Ajustar Aparência:* você muda magicamente sua aparência e vestimentas para evitar ser reconhecido.","*Paralelos:* **gaste 2 Pontos de Esperança** para conjurar este feitiço sobre si mesmo ou sobre um aliado próximo. Na próxima vez que o alvo fizer um ataque, ele pode acertar um alvo adicional dentro do alcance contra o qual seu teste de ataque seria bem-sucedido. Você pode manter este feitiço ativo sobre uma única criatura por vez.","*Ilusão:* faça um **teste de conjuração (14)**. Em um sucesso, você cria uma ilusão visual temporária em um ponto em alcance próximo. Ela não pode ultrapassar seu tamanho e dura enquanto você olhar para ela. A ilusão não levanta suspeitas até um observador estar corpo a corpo dela."]},{"d":"Códice","n":"Livro de Vagras","t":"Grimório","l":2,"c":2,"x":["*Portal Arcano:* se não houver adversários corpo a corpo, faça um **teste de conjuração (13)**. Em um sucesso, **gaste 1 Ponto de Esperança** para criar um portal de onde você está para outro ponto que você possa ver em alcance distante. Ele se fecha depois que uma criatura passar por ele.","*Revelar:* faça um **teste de conjuração**. Se houver algo escondido por magia em alcance próximo, ela é revelada. *Tranca Rúnica:* faça um **teste de conjuração (15)** sobre um objeto que esteja tocando e que possa fechar (como um baú, cadeado, caixa ou fechadura). Uma vez por descanso, em um sucesso, você pode trancar o objeto de modo que ele só possa ser aberto por criaturas designadas por você. Este feitiço pode ser quebrado em uma hora por uma pessoa com acesso à magia."]},{"d":"Códice","n":"Livro de Korvax","t":"Grimório","l":3,"c":2,"x":["*Círculo Rúnico:* **marque 1 Ponto de Fadiga** para criar um círculo mágico temporário abaixo de onde você está. Todos os adversários que entrarem ou estiverem em alcance cac sofrem **2d12+4** de dano mágico e são empurrados para um ponto em alcance muito próximo.","*Lapso:* **gaste 1 Ponto de Esperança** para forçar um alvo corpo a corpo a fazer um teste de reação (15). Se falhar, ele esquece o último minuto de conversa com você.","*Levitação:* faça um **teste de conjuração** para suspender temporariamente no ar um alvo que você possa ver e movê-lo para um ponto em alcance próximo relativo à posição original dele."]},{"d":"Códice","n":"Livro de Norai","t":"Grimório","l":3,"c":2,"x":["*Amarração Mística:* faça um **teste de conjuração** contra um alvo distante. Em um sucesso, ele fica temporariamente *Imobilizado* e deve marcar 1 Ponto de Fadiga. Se tiver uma criatura que esteja voando como alvo, este feitiço faz com que ela aterrisse e fique temporariamente *Imobilizada*.","*Bola de Fogo:* faça um **teste de conjuração** contra um alvo muito distante. Em um sucesso, lance uma esfera de fogo que explode ao se chocar contra ele. O alvo e todas as criaturas Muito Próximas dele devem fazer um teste de reação (13). Alvos que falharem sofrem **d20+5** de dano mágico com sua Proficiência. Alvos bem-sucedidos sofrem metade do dano."]},{"d":"Códice","n":"Livro de Ecsota","t":"Grimório","l":4,"c":3,"x":["*Criar Construto:* **gaste 1 Ponto de Esperança** para escolher um grupo de objetos ao seu redor e, a partir deles, crie um construto animado que obedece comandos básicos. Faça um **teste de conjuração** para mandá-lo agir. Quando necessário, ele compartilha sua Evasão e atributos, e os ataques dele causam **2d10+3** de dano físico. Você pode manter apenas um construto por vez, e ele se desfaz ao sofrer qualquer quantidade de dano.","*Repudiar:* você pode interromper um efeito mágico em andamento. Faça um teste de conjuração usando seu atributo de conjuração. Se passar, uma vez por descanso, o efeito cessa e quaisquer consequências são evitadas."]},{"d":"Códice","n":"Livro de Grynn","t":"Grimório","l":4,"c":2,"x":["*Deflexão:* uma vez por descanso longo, **gaste 1 Ponto de Esperança** para negar o dano de um ataque que tenha você ou um aliado muito próximo como alvo.","*Muralha de Fogo:* faça um **teste de conjuração (15)**. Em um sucesso, crie uma muralha de fogo mágico entre dois pontos em alcance distante. Todas as criaturas no caminho dela devem escolher ficar em um dos lados, e tudo o que atravessá-la depois disso sofre **4d10+3** de dano mágico. *Tranca Temporal:* escolha um objeto distante como alvo. Esse objeto para no tempo e espaço exatamente onde está até o seu próximo descanso. Se uma criatura tentar movê-lo, faça um **teste de conjuração** contra ela para sustentar este feitiço."]},{"d":"Códice","n":"Muralha","t":"Feitiço","l":5,"c":2,"x":["Faça um **teste de conjuração (15)**. Em um sucesso, **gaste 1 Ponto de Esperança** uma vez por descanso para criar uma parede mágica temporária entre dois pontos em alcance distante. Ela pode ter até 15m de altura e se formar em qualquer ângulo. Criaturas ou objetos no caminho dela são desviados para um dos lados à sua escolha. A muralha perdura até seu próximo descanso ou até você conjurar Muralha novamente."]},{"d":"Códice","n":"Teleporte","t":"Feitiço","l":5,"c":2,"x":["Uma vez por descanso longo, você pode instantaneamente teleportar a si mesmo e qualquer número de alvos próximos voluntários para um lugar onde você já esteve anteriormente. Escolha uma das opções a seguir e faça um **teste de conjuração (16)**:","• Se conhece o lugar muito bem, receba +3 de bônus;","• Se visitou o lugar com alguma frequência, receba +1 de bônus;","• Se não visitou o lugar com frequência, você não ganha um modificador;","• Se visitou o lugar apenas uma vez, sofra uma penalidade de – 2.","Em um sucesso, você aparece no lugar pretendido. Se falhar, você aparece em um lugar diferente do pretendido. O grau da falha determina quão longe você aparece."]},{"d":"Códice","n":"Banir","t":"Feitiço","l":6,"c":0,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, role um número de **d20** igual ao seu atributo de conjuração. O alvo deve fazer um teste de reação com Dificuldade igual ao seu resultado mais alto. Em um sucesso, o alvo marca 1 Ponto de Fadiga, mas não é banido. Uma vez por descanso, se falhar, ele é banido deste reino.","Quando os personagens rolarem com Medo, a Dificuldade sofre uma penalidade de –1 e o alvo faz outro teste de reação. Em um sucesso, ele volta do banimento."]},{"d":"Códice","n":"Sigilo da Retaliação","t":"Feitiço","l":6,"c":2,"x":["Marque um adversário próximo com um Sigilo da Retaliação. O mestre ganha 1 Ponto de Medo. Quando o adversário marcado causar dano a você ou aos seus aliados, coloque **1d8** nesta carta. Você pode acumular um número de **d8** igual ao seu nível. Ao atacar o adversário marcado com sucesso, role os dados que estão nesta carta e some o total à sua rolagem de dano; em seguida, retire os dados. Este efeito termina quando o adversário marcado é derrotado ou quando você conjura Sigilo da Retaliação novamente."]},{"d":"Códice","n":"Dom do Códice","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Códice, receba os seguintes benefícios:","• Você pode **marcar 1 Ponto de Fadiga** para somar sua Proficiência a um teste de conjuração;","• Uma vez por descanso, substitua esta carta por qualquer carta em sua reserva sem pagar o custo de troca."]},{"d":"Códice","n":"Livro de Homet","t":"Grimório","l":7,"c":0,"x":["*Atravessar:* faça um **teste de conjuração (13)**. Uma vez por descanso, em um sucesso, você e todas as criaturas que o estejam tocando podem atravessar uma parede ou porta Próxima. O efeito termina quando todos estiverem do outro lado.","*Portal Planar:* faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, abra um portal para uma localidade que você já tenha visitado em outra dimensão ou plano de existência. Esse portal perdura até seu próximo descanso."]},{"d":"Códice","n":"Livro de Vyola","t":"Grimório","l":8,"c":2,"x":["*Clareza Compartilhada:* uma vez por descanso longo, **gaste 1 Ponto de Esperança** para escolher duas criaturas voluntárias. Quando uma delas for marcar PF, ela pode escolher qual das duas irá marcar. Este feitiço dura até o próximo descanso dos alvos.","*Sondar Memórias:* faça um **teste de conjuração** contra um alvo distante. Em um sucesso, espione a mente do alvo e faça uma pergunta ao mestre. O mestre descreve as memórias do alvo que estejam relacionadas à resposta."]},{"d":"Códice","n":"Refúgio Seguro","t":"Feitiço","l":8,"c":3,"x":["Quando tem alguns minutos de calma para se concentrar, você pode **gastar 2 Pontos de Esperança** para invocar seu Refúgio Seguro: um grande abrigo interdimensional onde você e seus aliados podem ficar. Ao fazer isso, uma porta mágica aparece em algum lugar em alcance próximo. Apenas criaturas designadas por você podem entrar. Após entrar, você pode deixar a entrada invisível. Qualquer pessoa no interior do refúgio pode sair a hora que quiser. Depois que você sair, a porta de entrada deve ser invocada novamente.","Ao fazer um descanso em seu Refúgio Seguro, você pode escolher um movimento de repouso adicional."]},{"d":"Pavor","n":"Golpe Debilitante","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em caso de sucesso:","• Se rolar com Esperança, cause **d6+1** de dano mágico com sua Proficiência. Se rolar com Medo, cause **d10+1** de dano mágico com sua Proficiência.","• O próximo ataque bem-sucedido do alvo causa metade do dano.","Em caso de falha, você deve gastar 1 Ponto de Esperança ou marcar 1 PF."]},{"d":"Códice","n":"Livro de Ronin","t":"Grimório","l":9,"c":4,"x":["*Enervação Eterna:* uma vez por descanso longo, faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, ele fica permanentemente *Vulnerável*. O alvo não pode se recuperar dessa condição por quaisquer meios.","*Transformação:* faça um **teste de conjuração (15)**. Em um sucesso, transforme-se em um objeto inanimado que não exceda o dobro de seu tamanho normal. Você pode permanecer nessa forma até sofrer dano."]},{"d":"Códice","n":"Onda Desintegradora","t":"Feitiço","l":9,"c":4,"x":["Faça um **teste de conjuração (18)**. Uma vez por descanso longo, em um sucesso, o mestre lhe informa quais adversários distantes têm Dificuldade 18 ou menor. **Marque 1 Ponto de Fadiga** para cada alvo que quiser atingir com este feitiço. O alvo morre e não pode voltar à vida por quaisquer meios."]},{"d":"Códice","n":"Livro de Yarrow","t":"Grimório","l":10,"c":2,"x":["*Imunidade Mágica:* **gaste 5 Pontos de Esperança** para ficar imune a dano mágico até seu próximo descanso. *Manipulação Temporal:* faça um **teste de conjuração (18)**. Em um sucesso, o tempo desacelera temporariamente até parar para todos que estiverem em alcance distante, com exceção de você. Ele volta ao normal na próxima vez que você fizer um teste que tenha outra criatura como alvo."]},{"d":"Códice","n":"União Transcendental","t":"Feitiço","l":10,"c":1,"x":["Uma vez por descanso longo, **gaste 5 Pontos de Esperança** para conjurar este feitiço sobre duas ou mais criaturas voluntárias. Até seu próximo descanso, quando uma criatura conectada por essa união for marcar Pontos de Vida ou Pontos de Fadiga, as criaturas conectadas podem escolher qual delas marcará."]},{"d":"Pavor","n":"Véu Umbral","t":"Feitiço","l":1,"c":1,"x":["Uma vez por descanso, você pode **marcar 1 PF** para se envolver em energia sombria. Ao fazer isso, coloque um número de marcadores nesta carta igual ao número de Pontos de Medo que o mestre tem no momento. Após ser alvo de um teste de ataque, você pode gastar qualquer número de marcadores para aplicar uma penalidade ao resultado igual a –1 para cada marcador gasto.","No fim da cena, marcadores não utilizados são perdidos."]},{"d":"Pavor","n":"Voz do Pavor","t":"Feitiço","l":1,"c":0,"x":["Você pode falar magicamente com uma criatura que você possa ver, atormentando-a com suas palavras. Faça um **teste de conjuração** contra ela. Em um sucesso, ela deve marcar 1 PF e congela de terror, ficando temporariamente *Imobilizada*."]},{"d":"Pavor","n":"Retribuição Sinistra","t":"Feitiço","l":2,"c":2,"x":["Quando um aliado próximo sofrer dano de um alvo que você possa ver, você pode fazer um teste de reação contra o alvo usando seu atributo de conjuração. Se acertar, **marque 1 PF** para causar **d6** de dano mágico com sua Proficiência."]},{"d":"Pavor","n":"Sorver Essência","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Uma vez por descanso longo, em um sucesso, o alvo sofre **d12+4** de dano mágico com sua Proficiência. Em um sucesso com Medo, sua Proficiência para esta rolagem de dano recebe +1. Você recupera um número de Pontos de Vida igual aos PV marcados pelo alvo deste ataque."]},{"d":"Pavor","n":"Aterrorizar","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, o alvo marca **1d4** PF e você pode fazê-lo fugir uma categoria de alcance para longe de você (como de muito próximo para próximo, de próximo para distante e assim por diante). Em um sucesso com Medo, o alvo também fica temporariamente *Vulnerável*."]},{"d":"Pavor","n":"Trauma Compartilhado","t":"Feitiço","l":3,"c":1,"x":["Você pode transferir o sofrimento de uma criatura para outra. Uma vez por descanso, marque qualquer número de PV de uma criatura voluntária em alcance corpo a corpo para recuperar uma quantidade equivalente de PV de outra criatura voluntária em alcance corpo a corpo."]},{"d":"Pavor","n":"Conjurar o Horror","t":"Feitiço","l":4,"c":2,"x":["**Marque 1 PF** para invocar uma criatura de outro mundo. Ela causa **d8+1** de dano mágico com seu atributo de conjuração a um alvo distante. Se o alvo marcar qualquer número de PV por este ataque, ele precisa passar num **teste de reação (12)** para se fortalecer contra o horror ou é obrigado a marcar a mesma quantidade de PF. Após fazer o ataque, a criatura desaparece."]},{"d":"Pavor","n":"Correntes de Aflição","t":"Feitiço","l":4,"c":2,"x":["**Marque 2 PF** para temporariamente *Acorrentar* um alvo próximo. Quando uma criatura *Acorrentada* causa dano, o alvo do ataque dela marca 1 PV a menos do que normalmente marcaria. Você não pode manter mais de uma criatura *Acorrentada* por vez."]},{"d":"Pavor","n":"Golpe Atroz","t":"Feitiço","l":5,"c":2,"x":["Quando um alvo marca qualquer número de PV por conta de um ataque que você fez, você pode **gastar 1 Ponto de Esperança** para drenar o poder dele. O mestre perde 1 Ponto de Medo."]},{"d":"Pavor","n":"Névoa Espectral","t":"Feitiço","l":5,"c":0,"x":["**Gaste 2 Pontos de Esperança** para conjurar uma névoa misteriosa que torna você e aliados próximos à sua escolha momentaneamente incorpóreos. Enquanto uma criatura estiver incorpórea, ela pode se mover através de objetos sólidos e é imune a dano físico. Ela se torna corpórea novamente após atravessar um objeto sólido ou fazer um teste. Do contrário, este efeito dura até o fim da cena."]},{"d":"Pavor","n":"Fogo Negro","t":"Feitiço","l":6,"c":2,"x":["**Gaste qualquer número de Pontos de Esperança** para atingir uma quantidade de adversários próximos equivalente aos pontos gastos. Cada alvo deve fazer um **teste de reação (15)**. Quem falhar sofre **d8+6** de dano mágico com seu atributo de conjuração conforme é envolto em fogo negro. Quem passar sofre metade do dano."]},{"d":"Pavor","n":"Susto Repentino","t":"Feitiço","l":6,"c":1,"x":["Ao causar dano mágico a um alvo, você pode **marcar 1 PF** para se teletransportar ao alcance corpo a corpo do alvo. Ao fazer isso, ele fica *Vulnerável* até marcar 1 ou mais PV."]},{"d":"Pavor","n":"Dom do Pavor","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Pavor, receba os seguintes benefícios:","• Ao obter um sucesso com Medo, você pode **marcar 2 PF** para impedir o mestre de receber 1 Ponto de Medo.","• Uma vez por descanso, ao fazer um teste, você pode receber um bônus igual ao número de Pontos de Medo que o mestre possui."]},{"d":"Pavor","n":"Muralha Faminta","t":"Feitiço","l":7,"c":2,"x":["Faça um **teste de conjuração (10)**. Em um sucesso, você pode **gastar 1 Ponto de Esperança** para criar uma muralha visível de energia necrótica entre dois pontos em alcance distante. A muralha dura até você marcar 1 PV ou conjurar esta magia novamente. Uma criatura que atravesse a muralha (ou que esteja dentro dela quando surgir) deve marcar 2 Pontos de Fadiga."]},{"d":"Pavor","n":"Carne Macabra","t":"Feitiço","l":8,"c":1,"x":["Receba +1 em seus limiares de dano para cada PF que você tem marcado.","Além disso, ao rolar com Medo, você pode **gastar 2 Pontos de Esperança** para recuperar 1 Ponto de Armadura."]},{"d":"Pavor","n":"Exército Sombrio","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (14)**. Uma vez por descanso longo, em um sucesso, você pode invocar ínferos ao seu redor e que se movem com você. Coloque 8 marcadores nesta carta. Ao causar dano a um alvo muito próximo, você pode gastar qualquer número de marcadores, adicionando **1d8** à rolagem de dano para cada marcador gasto dessa forma. Além disso, ao sofrer dano, você pode gastar qualquer número de marcadores, reduzindo o dano em **1d8** para cada marcador gasto dessa forma. Cada vez que você gasta um marcador, um ínfero age em seu benefício e então desaparece. No próximo descanso longo, marcadores não utilizados são perdidos."]},{"d":"Pavor","n":"Danação","t":"Feitiço","l":9,"c":2,"x":["Faça um teste de conjuração contra um alvo distante. Em um sucesso, **marque qualquer número de PF** para rolar um número de **d20** equivalente aos pontos marcados, causando dano mágico igual à soma dos resultados. Se este ataque derrotar o alvo, todos os adversários distantes dele devem marcar 1 Ponto de Fadiga."]},{"d":"Graça","n":"Dissimulação","t":"Talento","l":1,"c":0,"x":["**Gaste 1 Ponto de Esperança** para receber vantagem em um teste para enganar ou fazer alguém acreditar em uma mentira que você contar."]},{"d":"Graça","n":"Enfeitiçar","t":"Feitiço","l":1,"c":0,"x":["Faça um teste de conjuração contra um alvo próximo. Em um sucesso, ele fica temporariamente *Enfeitiçado*. Enquanto estiver *Enfeitiçado*, a atenção do alvo se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. Uma vez por descanso, você pode **marcar 1 Ponto de Fadiga** para forçar o alvo *Enfeitiçado* a marcar 1 PF também."]},{"d":"Graça","n":"Palavras Inspiradoras","t":"Talento","l":1,"c":1,"x":["Suas palavras são imbuídas de poder. Após um descanso longo, coloque um número de marcadores igual à sua Presença nesta carta. Ao falar com um aliado, você pode gastar um marcador desta carta para dar a ele um benefício dentre os seguintes:","• Seu aliado recupera 1 PF;","• Seu aliado recupera 1 PV;","• Seu aliado recebe 1 Ponto de Esperança.","Após um descanso longo, marcadores não utilizados são perdidos."]},{"d":"Pavor","n":"Saborear a Angústia","t":"Feitiço","l":9,"c":1,"x":["Quando um adversário próximo sofre dano grave, você pode recuperar 1 PF."]},{"d":"Pavor","n":"Avatar do Terror","t":"Feitiço","l":10,"c":2,"x":["**Marque 1 PF** para se transformar em uma criatura alimentada pelo medo. Enquanto estiver nessa forma, você recebe **+1d6** em suas rolagens de dano para cada Ponto de Medo que o mestre possui. Além disso, você recebe 1 Ponto de Esperança sempre que o mestre gasta 1 Ponto de Medo para pôr em foco um adversário muito próximo.","Antes de fazer qualquer teste, você deve gastar 1 Ponto de Esperança. Se não puder fazer isso, você retorna à sua forma normal."]},{"d":"Pavor","n":"Invocar o Tormento","t":"Feitiço","l":10,"c":2,"x":["Você causa o dobro de dano a alvos que estejam com todos os PF marcados. Além disso, quando um adversário próximo é derrotado com todos os PF marcados, você recebe 1 Ponto de Esperança."]},{"d":"Graça","n":"Insolência","t":"Talento","l":2,"c":2,"x":["Ao insultar ou provocar um alvo distante, faça um **teste de Presença** contra ele. Uma vez por descanso, em um sucesso, role um número de **d4** igual à sua Proficiência. O alvo deve marcar um número de Pontos de Fadiga igual ao maior resultado obtido."]},{"d":"Graça","n":"Não Minta para Mim","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, ele não pode mentir para você enquanto estiver em alcance próximo, porém não é obrigado a falar. Se você fizer uma pergunta e ele se recusar a responder, ele deve marcar 1 Ponto de Fadiga e o efeito termina. O alvo em geral não está ciente de que este feitiço foi conjurado sobre ele até que fale uma verdade contra sua vontade."]},{"d":"Graça","n":"Invisibilidade","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (10)**. Em um sucesso, **marque 1 Ponto de Fadiga** e deixe você ou um aliado corpo a corpo *Invisível*. Uma criatura *Invisível* só pode ser vista por meios mágicos e testes de ataque contra ela são feitos com desvantagem. Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando a criatura *Invisível* faz uma ação, gaste um marcador desta carta. Após o término da ação que consumiu o último marcador, o efeito termina.","Você pode manter apenas uma criatura sob efeito de Invisibilidade por vez."]},{"d":"Graça","n":"Lampejo Hipnótico","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra todos os adversários próximos na sua frente. Uma vez por descanso, em um sucesso, crie lampejos ilusórios de cores e luzes que deixam os alvos atingidos temporariamente *Atordoados* e os força a marcar 1 PF. Enquanto estiverem *Atordoados*, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem desta condição."]},{"d":"Graça","n":"Espionar","t":"Feitiço","l":4,"c":1,"x":["Escolha um alvo muito distante. Você pode ver e ouvir pelos olhos e ouvidos dele. Você pode escolher entre usar seus próprios sentidos ou os do alvo à vontade até seu próximo descanso ou até você conjurar outro feitiço."]},{"d":"Graça","n":"Palavras Tranquilizantes","t":"Talento","l":4,"c":1,"x":["Durante um descanso curto, ao passar um tempo amparando outro personagem por meio do movimento de repouso Tratar Ferimentos, recupere 1 Ponto de Vida adicional desse personagem. Ao fazer isso, você também recupera 2 Pontos de Vida."]},{"d":"Graça","n":"Palavras de Discórdia","t":"Feitiço","l":5,"c":1,"x":["Sussurre palavras de discórdia para um adversário corpo a corpo e faça um **teste de conjuração (13)**. Em um sucesso, o alvo deve marcar 1 Ponto de Fadiga e atacar outro adversário em vez de você ou seus aliados.","Após concluir o ataque, o alvo percebe o que aconteceu. Na próxima vez que conjurar Palavras de Discórdia sobre ele, você sofre uma penalidade de –5 no teste de conjuração."]},{"d":"Graça","n":"Sondar Pensamentos","t":"Feitiço","l":5,"c":2,"x":["Você pode espionar a mente dos outros. **Gaste 1 Ponto de Esperança** para ler pensamentos vagos e superficiais de um alvo distante. Faça um **teste de conjuração** contra o alvo para sondar pensamentos profundos e escondidos. Se rolar com Medo, a critério do mestre, o alvo pode perceber que você está lendo a mente dele."]},{"d":"Graça","n":"Jamais Esquecido","t":"Talento","l":6,"c":2,"x":["Ao marcar 1 ou mais Pontos de Vida devido a um ataque, você pode **marcar 1 Ponto de Fadiga** para colocar um número de marcadores nesta carta igual ao número de PV marcados. Para cada marcador nesta carta, você recebe um bônus de +5 na rolagem de dano do próximo ataque que você acertar. Em seguida, zere todos os marcadores."]},{"d":"Graça","n":"Partilhar o Fardo","t":"Feitiço","l":6,"c":0,"x":["Uma vez por descanso, absorva a Fadiga de uma criatura corpo a corpo voluntária. O alvo descreve quais conhecimentos ou emoções particulares são transferidos da mente dele para a sua. Transfira qualquer número de PF do alvo para você e em seguida receba 1 Ponto de Esperança para cada PF transferido."]},{"d":"Graça","n":"Carisma Infinito","t":"Talento","l":7,"c":1,"x":["Após fazer um teste para obter favores, mentir ou persuadir, você pode **gastar 1 Ponto de Esperança** para rolar novamente seu Dado de Esperança ou Medo."]},{"d":"Graça","n":"Dom da Graça","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Graça, receba os seguintes benefícios:","• Você pode **marcar 1 PA** em vez de 1 PF;","• Quando for fazer com que um alvo marque PV, você pode forçá-lo a marcar um número equivalente de PF em vez disso."]},{"d":"Graça","n":"Enfeitiçar em Massa","t":"Feitiço","l":8,"c":3,"x":["Faça um **teste de conjuração** contra todos os alvos distantes. Alvos atingidos ficam temporariamente *Enfeitiçados*. Enquanto um alvo estiver *Enfeitiçado*, a atenção dele se fixa em você. O campo de visão dele se estreita e todos os sons além da sua voz são abafados. **Marque 1 Ponto de Fadiga** para forçar todos os alvos *Enfeitiçados* a marcarem 1 PF, encerrando este feitiço."]},{"d":"Graça","n":"Projeção Astral","t":"Feitiço","l":8,"c":0,"x":["Uma vez por descanso longo, **marque 1 Ponto de Fadiga** para projetar uma cópia de si mesmo que pode aparecer em qualquer lugar no qual você já tenha estado anteriormente.","Você pode ver e ouvir através da projeção e pode afetar o mundo como se você estivesse no lugar dela. Uma criatura que investigue a projeção pode discernir sua origem mágica. Esse efeito dura até seu próximo descanso ou até sua projeção sofrer qualquer dano."]},{"d":"Graça","n":"Imitador","t":"Feitiço","l":9,"c":3,"x":["Uma vez por descanso longo, esta carta pode imitar as habilidades de outra carta de domínio de 8º nível ou menor na mão de outro jogador. **Gaste uma quantidade de Esperança igual à metade do nível da carta** para ter acesso à habilidade. A cópia permanece até seu próximo descanso ou até o outro jogador colocar a carta original na reserva."]},{"d":"Graça","n":"Mestre do Ofício","t":"Talento","l":9,"c":0,"x":["Receba um bônus permanente de +2 em duas de suas Experiências, ou +3 em apenas uma. Em seguida, coloque esta carta na sua reserva permanentemente."]},{"d":"Graça","n":"Em Dobro","t":"Feitiço","l":10,"c":1,"x":["Quando um aliado próximo causa dano a um adversário, você pode fazer um **teste de conjuração** contra esse mesmo alvo. Em um sucesso, você causa o mesmo dano que seu aliado causou. Se você rolar um sucesso com Medo, coloque esta carta na reserva."]},{"d":"Meia-noite","n":"Chuva de Lâminas","t":"Feitiço","l":1,"c":1,"x":["**Gaste 1 Ponto de Esperança** para fazer um **teste de conjuração** e arremessar lâminas mágicas contra todos os alvos muito próximos. Alvos atingidos sofrem **d8+2** de dano mágico com sua Proficiência.","Se um alvo atingido estiver *Vulnerável* ele sofre **1d8** de dano adicional."]},{"d":"Meia-noite","n":"Delinquente","t":"Talento","l":1,"c":0,"x":["Você tem vantagem em testes para arrombar fechaduras não mágicas, desarmar armadilhas não mágicas ou roubar itens de um alvo (seja por meio da furtividade ou da força)."]},{"d":"Meia-noite","n":"Disfarce Inquietante","t":"Feitiço","l":1,"c":0,"x":["Quando tem alguns minutos para se preparar, você pode **marcar 1 Ponto de Fadiga** para tomar a forma de qualquer humanoide que você possa ver com clareza em sua mente. Enquanto estiver disfarçado dessa forma, você tem vantagem em testes de Presença para evitar ser descoberto.","Coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Quando fizer uma ação enquanto estiver disfarçado, gaste um marcador. Após a ação que consumiu o último marcador, o efeito termina."]},{"d":"Meia-noite","n":"Espírito da Meia-Noite","t":"Feitiço","l":2,"c":1,"x":["**Gaste 1 Ponto de Esperança** para invocar um espírito de tamanho humanoide que pode se mover ou carregar coisas para você até seu próximo descanso. Você também pode mandá-lo atacar, um adversário. Ao fazer isso, faça um **teste de conjuração** contra um alvo muito distante. Em um sucesso, o espírito se move até ficar corpo a corpo ao alvo. Role um número de **d6** igual ao seu atributo de conjuração e cause o resultado deles como dano mágico ao alvo. O espírito então se dissipa. Você pode ter apenas um espírito por vez."]},{"d":"Graça","n":"Notoriedade","t":"Talento","l":10,"c":0,"x":["As pessoas sabem quem você é e o que já fez; por isso, o tratam de forma diferente. Ao se aproveitar de sua notoriedade para conseguir o que quer, você pode **marcar 1 Ponto de Fadiga** antes do teste para receber um bônus de +10 no resultado. Onde quer que vá, você obtém comida e bebida grátis, e o preço das outras mercadorias que você compra diminui em uma bolsa de ouro (até o mínimo de um punhado).","Esta carta não conta para o limite de 5 cartas de domínio na sua mão e não pode ser colocada na reserva."]},{"d":"Meia-noite","n":"Sombra Traiçoeira","t":"Feitiço","l":2,"c":0,"x":["Faça um **teste de conjuração** contra todos os adversários muito próximos. Alvos atingidos ficam temporariamente *Imobilizados* pela própria sombra no lugar em que estão."]},{"d":"Meia-noite","n":"Estrangulamento","t":"Talento","l":3,"c":1,"x":["Quando se posiciona atrás de uma criatura de tamanho similar ao seu, você pode **marcar 1 Ponto de Fadiga** para estrangulá-la, deixando-a temporariamente *Vulnerável*.","Quando uma criatura ataca um alvo *Vulnerável* dessa forma, ela causa **2d6** de dano adicional."]},{"d":"Meia-noite","n":"Véu da Noite","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, crie uma cortina de escuridão entre dois pontos em alcance distante. Apenas você pode enxergar através dessa escuridão. Você é considerado *Escondido* para adversários no outro lado da cortina e tem vantagem em testes de ataque feitos através da escuridão. A cortina dura até você conjurar outro feitiço."]},{"d":"Meia-noite","n":"Glifo do Ocaso","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração** contra um alvo muito próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para conjurar um glifo sombrio sobre ele. O glifo expõe os pontos fracos do alvo, reduzindo temporariamente sua Dificuldade em um valor igual ao seu Conhecimento (mínimo de 1)."]},{"d":"Meia-noite","n":"Mestre da Furtividade","t":"Talento","l":4,"c":0,"x":["Ao rolar com Medo enquanto tenta se mover por uma área perigosa sem ser percebido, você pode **marcar 1 PF** para rolar com Esperança em vez disso.","Se um aliado próximo também estiver tentando se mover sem ser percebido e rolar com Medo, você pode **marcar 1 PF** para mudar o resultado e fazê-lo rolar com Esperança."]},{"d":"Meia-noite","n":"Recuo Espectral","t":"Feitiço","l":5,"c":2,"x":["**Gaste 1 Ponto de Esperança** para ativar Recuo Espectral no local onde você está. **Gaste mais 1 Ponto de Esperança** a qualquer momento antes de seu próximo descanso para desaparecer da sua localização atual e reaparecer no local onde estava quando ativou Recuo Espectral. Depois que você reaparecer, este feitiço termina."]},{"d":"Meia-noite","n":"Silêncio","t":"Feitiço","l":5,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo. Em um sucesso, **gaste 1 Ponto de Esperança** para conjurar um efeito mágico supressor sobre o alvo. Esse efeito afeta tudo em alcance muito próximo do alvo e o acompanha quando ele se move.","O alvo, e tudo mais na área afetada, fica *Silenciado*. Enquanto estiver *Silenciado*, o alvo não pode fazer barulho ou conjurar feitiços. Essa condição dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrá-la, até você conjurar Silêncio novamente ou até você sofrer dano maior."]},{"d":"Meia-noite","n":"Disfarce em Massa","t":"Feitiço","l":6,"c":0,"x":["Quando tem alguns minutos de silêncio para se concentrar, você pode **marcar 1 Ponto de Fadiga** para alterar a aparência de todas as criaturas Próximas voluntárias. As novas formas devem ter estrutura corporal e tamanho semelhantes e podem ser tanto algo ou alguém que você já tenha visto quanto criação sua. Uma criatura disfarçada dessa forma tem vantagem em testes de Presença para evitar ser descoberta.","Ative uma contagem regressiva (8). Ela diminui em virtude de uma consequência escolhida pelo mestre. Quando a consequência da contagem regressiva é ativada, o disfarce termina."]},{"d":"Meia-noite","n":"Sussurros Sombrios","t":"Feitiço","l":6,"c":0,"x":["Você pode se comunicar mentalmente com qualquer pessoa com a qual tenha tido contato físico. Uma vez que tenha aberto um canal de comunicação com o alvo, ele pode se comunicar com você da mesma forma. Além disso, você pode **marcar 1 Ponto de Fadiga** para fazer um **teste de conjuração** contra ele. Em um sucesso, você pode fazer uma das seguintes perguntas, que deve ser respondida pelo mestre:","• Onde a pessoa está? O que ela está fazendo? Do que ela tem medo? Com o que ela mais se preocupa?"]},{"d":"Meia-noite","n":"Dom da Meia-Noite","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Meia-noite, receba os seguintes benefícios:","• Uma vez por descanso, se você tiver 0 Ponto de Esperança e o mestre for receber Medo, em vez disso, você pode receber 1 Ponto de Esperança;","• Ao acertar um ataque, você pode **marcar 1 Ponto de Fadiga** para somar o resultado de seu Dado de Medo à rolagem de dano."]},{"d":"Meia-noite","n":"Esvanecer","t":"Feitiço","l":7,"c":1,"x":["Quando um ataque que causaria dano físico a você falha, você pode **gastar 1 Ponto de Esperança** para ficar","*Escondido* em um invólucro de sombras e se teleportar para um ponto próximo do atacante. Você permanece *Escondido* até o próximo teste que fizer."]},{"d":"Meia-noite","n":"Caçador Sombrio","t":"Talento","l":8,"c":2,"x":["Suas capacidades são aprimoradas quando você age nas sombras. Enquanto estiver na penumbra ou na escuridão, você recebe um bônus de +1 na Evasão e tem vantagem em testes de ataque."]},{"d":"Meia-noite","n":"Carga Mágica","t":"Feitiço","l":8,"c":1,"x":["Ao sofrer dano mágico, coloque um número de marcadores nesta carta igual ao número de PV marcados. Você pode acumular um número de marcadores igual ao seu atributo de conjuração. Quando acertar um ataque contra um alvo, você pode gastar um número qualquer de marcadores e somar uma quantidade equivalente de **d6** à rolagem de dano."]},{"d":"Meia-noite","n":"Terror Noturno","t":"Feitiço","l":9,"c":2,"x":["Uma vez por descanso longo, escolha quaisquer alvos muito próximos. Eles passam a ver você como uma horrorosa visão de pesadelo. Os alvos devem ter sucesso em um teste de reação (16) ou ficam temporariamente *Horrorizados*. Enquanto estiverem *Horrorizados*, eles ficam *Vulneráveis*. Roube uma quantidade de Medo do mestre igual ao número de alvos *Horrorizados* (até o máximo de acúmulos de Medo do mestre). Role um número de **d6** igual à quantidade de Medo roubado e cause o resultado deles como dano a cada alvo *Horrorizado*. Em seguida, descarte todo o Medo que roubou."]},{"d":"Meia-noite","n":"Tributo do Anoitecer","t":"Talento","l":9,"c":1,"x":["Escolha um alvo distante. Quando você tem sucesso em um teste que não resulta em uma rolagem de dano contra ele, coloque um marcador nesta carta. Ao causar dano contra esse alvo, gaste qualquer quantidade de marcadores e some um número equivalente de **d12** rolagem de dano. Você pode manter o Tributo do Anoitecer apenas sobre uma criatura por vez.","Ao escolher um novo alvo ou fazer um descanso, marcadores não utilizados são perdidos."]},{"d":"Meia-noite","n":"Eclipse","t":"Feitiço","l":10,"c":2,"x":["Faça um **teste de conjuração (16)**. Uma vez por descanso longo, em um sucesso, faça com que toda a área em alcance distante caia em completa escuridão, na qual apenas você e seus aliados podem enxergar. Os testes de ataque contra você ou seus aliados têm desvantagem dentro dessa escuridão.","Além disso, quando você ou um aliado tem um sucesso com Esperança contra um adversário dentro dessa área, o alvo deve marcar 1 Ponto de Fadiga.","Este feitiço dura até o mestre gastar 1 Ponto de Medo no turno dele para encerrar o efeito ou até você sofrer dano grave."]},{"d":"Sabedoria","n":"Rastreador Talentoso","t":"Talento","l":1,"c":0,"x":["Ao rastrear uma criatura ou grupo de criaturas com base nos sinais da passagem delas, você pode **gastar qualquer quantidade de Pontos de Esperança** e fazer um número equivalente destas perguntas ao mestre:","• Para que direção ele(s) foi(foram)? Há quanto tempo a criatura ou grupo passou por aqui? O que a criatura ou grupo fazia neste lugar? Quantas criaturas havia?","Ao encontrar os alvos rastreados dessa forma, você recebe um bônus de +1 na Evasão contra elas."]},{"d":"Sabedoria","n":"Vinha Voraz","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, raízes e vinhas saem do chão, causando **1d8+1** de dano físico e *Imobilizando* o alvo temporariamente.","Além disso, em um sucesso, você pode **gastar 1 Ponto de Esperança** para temporariamente *Imobilizar* um adversário muito próximo do primeiro."]},{"d":"Sabedoria","n":"Voz da Natureza","t":"Talento","l":1,"c":0,"x":["Você fala o idioma do mundo natural. Quando quiser falar com as plantas e animais ao seu redor, faça um **teste de Instinto (12)**. Em um sucesso, essas plantas ou animais fornecem a informação que conhecem. Se rolar com Medo, o conhecimento fornecido pode ser limitado ou ter um custo.","Além disso, antes de fazer um teste de conjuração em um ambiente natural, você pode **gastar 1 Ponto de Esperança** para receber um bônus de +2 na rolagem."]},{"d":"Meia-noite","n":"Espectro das Trevas","t":"Feitiço","l":10,"c":1,"x":["**Marque 1 Ponto de Fadiga** para tornar-se *Incorpóreo*. Essa condição dura até você à fazer um teste tendo outra criatura como alvo. Enquanto estiver *Incorpóreo*, você é imune a dano físico e pode flutuar e atravessar objetos sólidos. Outras criaturas ainda podem vê-lo nessa forma."]},{"d":"Sabedoria","n":"Conjurar Enxame","t":"Feitiço","l":2,"c":1,"x":["*Besouros Blindados de Tekaira:* **marque 1 PF** para conjurar um enxame de besouros ao seu redor. Na próxima vez que sofrer dano, reduza a gravidade em um limiar. Você pode **gastar 1 Ponto de Esperança** para manter os besouros conjurados após sofrer dano.","*Vaga-Lumes:* faça um **teste de conjuração** contra todos os adversários próximos. **Gaste 1 Ponto de Esperança** para causar **2d8+3** de dano mágico aos alvos atingidos."]},{"d":"Sabedoria","n":"Familiar da Natureza","t":"Feitiço","l":2,"c":1,"x":["**Gaste 1 Ponto de Esperança** para invocar um pequeno espírito da natureza ou criatura da floresta. Esse familiar fica ao seu lado até seu próximo descanso, até você conjurar Familiar da Natureza novamente ou até que ele seja alvo de um ataque. Ao **gastar 1 Ponto de Esperança adicional**, você pode invocar um familiar voador. Você pode se comunicar com ele, fazer um teste de conjuração para mandá-lo executar tarefas simples e **marcar 1 PF** para enxergar pelos olhos dele.","Ao causar dano a um adversário corpo a corpo ao seu familiar, some **1d6** à rolagem de dano."]},{"d":"Sabedoria","n":"Projétil Corrosivo","t":"Feitiço","l":3,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, cause **d6+4** de dano mágico usando sua Proficiência. Além disso, **marque 2 ou mais Pontos de Fadiga** para deixá-lo permanentemente *Corroído*. Um alvo *Corroído* sofre uma penalidade de –1 na Dificuldade para cada 2 Pontos de Fadiga que você gastou. Essa condição é cumulativa."]},{"d":"Sabedoria","n":"Tronco Descomunal","t":"Feitiço","l":3,"c":1,"x":["Uma vez por descanso, você pode conjurar um tronco espesso, retorcido e fácil de escalar em um ponto em alcance próximo. A altura dele pode ser equivalente ao alcance distante.","**Marque 1 Ponto de Fadiga** para usar este feitiço como um ataque. Faça um **teste de conjuração** contra um adversário ou grupo de adversários próximo. O tronco irrompe, lançando os alvos no ar e derrubando-os, causando **d8** de dano físico usando sua Proficiência."]},{"d":"Sabedoria","n":"Campo Curativo","t":"Feitiço","l":4,"c":2,"x":["Uma vez por descanso longo, você pode conjurar um campo de plantas curativas ao seu redor. Toda a área em alcance próximo irrompe em vida e natureza vibrante, permitindo que você e todos os aliados nessa área recuperem 1 Ponto de Vida.","**Gaste 2 Pontos de Esperança** para curar 2 Pontos de Vida em vez de 1."]},{"d":"Sabedoria","n":"Constrição Mortal","t":"Feitiço","l":4,"c":1,"x":["Faça um **teste de conjuração** contra um alvo próximo e escolha uma das seguintes opções:","• Você puxa o alvo para um ponto corpo a corpo ou puxa a si mesmo para um ponto corpo a corpo a ele;","• Você constringe o alvo e o força a marcar 2 Pontos de Fadiga;","• Todos os adversários entre você e o alvo devem ter sucesso em um teste de reação (13) ou são atingidos por vinhas e sofrem **3d6+2** de dano fís.","Em um sucesso, vinhas saem de suas mãos, causando o efeito escolhido e *Imobilizando* o alvo temporariamente."]},{"d":"Sabedoria","n":"Fortaleza Selvagem","t":"Feitiço","l":5,"c":1,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, **gaste 2 Pontos de Esperança** para fazer crescer uma barricada natural em formato de domo na qual você e um aliado podem buscar cobertura. Uma criatura dentro do domo não pode atacar nem ser alvo de ataques. Ataques feitos contra o domo acertam automaticamente. O domo tem 3 PV (coloque marcadores nesta carta para representá-los) e tem 15/30 como seus limiares de dano."]},{"d":"Sabedoria","n":"Pele de Espinhos","t":"Feitiço","l":5,"c":1,"x":["Uma vez por descanso, **gaste 1 Ponto de Esperança** para fazer com que espinhos brotem de todo o seu corpo. Ao fazer isso, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Ao sofrer dano, você pode gastar qualquer quantidade de marcadores e rolar um número equivalente de **d6**. Reduza o dano sofrido em um número igual à soma dos resultados. Se estiver corpo a corpo ao atacante, cause a mesma quantidade de dano a ele. Após um descanso, marcadores não utilizados são perdidos."]},{"d":"Sabedoria","n":"Coletor","t":"Talento","l":6,"c":1,"x":["Como um movimento de repouso adicional que você pode escolher, role **1d6** para descobrir o que você coleta. Colabore com o mestre para descrever esse item e adicione-o ao seu inventário como um consumível. Seu grupo pode carregar no máximo cinco consumíveis coletados por vez. 1. Um alimento único (recupera 2 Pontos de Fadiga); 2. Uma bela relíquia (receba 2 Pontos de Esperança); 3. Uma runa arcana (+2 em um teste de conjuração); 4. Um frasco curativo (recupera 2 PV); 5. Um talismã da sorte (role qualquer dado novamente); 6. Escolha uma das opções acima."]},{"d":"Sabedoria","n":"Conjurar Montarias","t":"Feitiço","l":6,"c":0,"x":["**Gaste qualquer quantidade de Pontos de Esperança** para conjurar um número equivalente de montarias (como cavalos, camelos ou elefantes) que você e seus aliados podem usar até seu próximo descanso longo ou até que as montarias sofram dano. As montarias dobram sua velocidade de viagem por terra e, quando em perigo, permitem que você se mova para um ponto em alcance distante sem precisar de teste. Criaturas sobre as montarias sofrem uma penalidade de –2 em testes de ataque e ganham +2 de bônus nas rolagens de dano."]},{"d":"Sabedoria","n":"Aspecto Selvagem","t":"Feitiço","l":7,"c":2,"x":["Uma vez por descanso longo, **marque 1 Ponto de Fadiga** para canalizar a natureza ao seu redor e aprimorar a si mesmo. Descreva como sua aparência muda e, em seguida, coloque **1d6** nesta carta, com o 1 virado para cima.","Enquanto o Dado de Aspecto Selvagem estiver ativo, você soma seu valor a todos seus testes. Após somar seu valor a um teste, aumente o valor do dado em 1. Se o valor do dado for ultrapassar 6, ou se você fizer um descanso, essa forma termina e você deve **marcar 1 Ponto de Fadiga adicional**."]},{"d":"Sabedoria","n":"Dom da Sabedoria","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio da Sabedoria, receba os seguintes benefícios:","• Enquanto estiver em um ambiente natural, você ganha um bônus de +2 em testes de conjuração;","• Uma vez por descanso, você pode dobrar sua Agilidade ou Instinto ao fazer um teste que use esse atributo. Você deve fazer isso antes de rolar os dados."]},{"d":"Sabedoria","n":"Barreira Revigorante","t":"Feitiço","l":8,"c":1,"x":["Faça um **teste de conjuração (15)**. Uma vez por descanso, em um sucesso, crie uma barreira temporária de energia protetora que fica Muito Próxima de você. Você e todos os aliados que estão dentro da barreira quando este feitiço é conjurado recuperam **1d4** PV. Enquanto a barreira estiver de pé, você e todos os aliados no interior dela têm resistência a dano físico oriundo do lado de fora.","Quando você se move, a barreira se move com você."]},{"d":"Sabedoria","n":"Espíritos da Floresta","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração (13)**. Em um sucesso, **gaste qualquer quantidade de Pontos de Esperança** para criar um número equivalente de espíritos da floresta. Todos surgem em pontos à sua escolha em alcance distante e fornecem os seguintes benefícios:","• Seus aliados recebem um bônus de +3 em testes de ataque contra adversários cac a um espírito;","• Se um aliado marcar 1 Ponto de Armadura enquanto estiver cac a um dos espíritos, ele pode marcar 1 Ponto de Armadura adicional.","Após conceder um benefício ou sofrer qualquer dano, um espírito desaparece."]},{"d":"Sabedoria","n":"Santuário Selvagem","t":"Talento","l":9,"c":2,"x":["Após um descanso longo, coloque uma quantidade de marcadores nesta carta igual ao número de cartas do domínio da Sabedoria na sua mão e reserva.","Quando fizer um teste de conjuração, você pode gastar qualquer número de marcadores após o teste para receber um bônus de +1 por marcador.","Ao ter sucesso crítico em um teste de conjuração para um feitiço do domínio da Sabedoria, receba um marcador.","Após o próximo descanso longo, marcadores não utilizados são perdidos."]},{"d":"Esplendor","n":"Raio Luminoso","t":"Feitiço","l":1,"c":1,"x":["Faça um **teste de conjuração** contra um alvo distante. Em um sucesso, **gaste 1 Ponto de Esperança** para lançar um raio de luz radiante contra ele, causando **d8+2** de dano mágico usando sua Proficiência. O alvo fica temporariamente *Vulnerável* e emite uma luz intensa até se recuperar dessa condição."]},{"d":"Esplendor","n":"Toque Reparador","t":"Feitiço","l":1,"c":1,"x":["Você toca uma criatura e canaliza magia curativa para fechar seus ferimentos. Quando pode passar alguns minutos se concentrando em quem está ajudando, **gaste 2 Pontos de Esperança** para recuperar 1 PV ou PF do alvo.","Uma vez por descanso longo, ao passar esse momento curativo descobrindo algo novo sobre a criatura ou revelando algo sobre si mesmo a ela, você pode fazê-la recuperar 2 Pontos de Vida ou Pontos de Fadiga, em vez de 1."]},{"d":"Sabedoria","n":"Soberania Vegetal","t":"Feitiço","l":9,"c":1,"x":["Faça um **teste de conjuração (18)**. Uma vez por descanso longo, em um sucesso, você remodela o mundo natural, alterando a flora em qualquer ponto em alcance distante. Por exemplo, você pode fazer árvores brotarem instantaneamente, criar um caminho através de vegetação densa ou erguer uma muralha de raízes."]},{"d":"Sabedoria","n":"Força da Natureza","t":"Feitiço","l":10,"c":2,"x":["**Marque 1 Ponto de Fadiga** para se transformar em um grande espírito da natureza, recebendo os seguintes benefícios:","• Ao ter sucesso em um teste de ataque ou conjuração, receba +10 de bônus na rolagem de dano;","• Ao causar dano suficiente para derrotar uma criatura Próxima, você a absorve e recupera 1 PA;","• Você não pode ser *Imobilizado*.","Antes de fazer um teste, você deve **gastar 1 Ponto de Esperança**. Se não puder fazer isso, volta à forma normal."]},{"d":"Sabedoria","n":"Tempestade","t":"Feitiço","l":10,"c":2,"x":["Escolha um dos tipos de tempestade abaixo e faça um **teste de conjuração** contra todos os alvos distantes. Alvos atingidos sofrem os efeitos até o mestre gastar 1 Ponto de Medo no turno dele para encerrar este feitiço.","• *Nevasca*: causa **2d20+8** de dano mágico e deixa os alvos temporariamente *Vulneráveis.*","• *Furacão*: causa **3d10+10** de dano mágico. Escolha uma direção para a qual o vento sopra. Alvos não podem se mover contra o vento.","• *Tempestade de Areia*: cause **5d6+9** de dano mágico.","• Ataques oriundos de um ponto além do alcance corpo a corpo têm desvantagem."]},{"d":"Esplendor","n":"Validação","t":"Talento","l":1,"c":0,"x":["Uma vez por descanso, após o teste de um aliado, mas antes das consequências ocorrerem, você pode auxiliá-lo com palavras de apoio. Ao fazer isso, seu aliado pode rolar os dados novamente."]},{"d":"Esplendor","n":"Mãos Curativas","t":"Feitiço","l":2,"c":1,"x":["Faça um **teste de conjuração (13)** tendo como alvo uma criatura corpo a corpo que não seja você. Em um sucesso, **marque 1 Ponto de Fadiga** para recuperar 2 Pontos de Vida ou Pontos de Fadiga do alvo. Se falhar, **marque 1 Ponto de Fadiga** para recuperar 1 PV ou PF do alvo. Você não pode curar o mesmo alvo novamente até seu próximo descanso longo."]},{"d":"Esplendor","n":"Últimas Palavras","t":"Feitiço","l":2,"c":1,"x":["Você pode conceder um momento de vida a um cadáver para conversar com ele. Faça um **teste de conjuração (13)**. Em um sucesso com Esperança, o cadáver responde até três perguntas. Em um sucesso com Medo, o cadáver responde uma pergunta. O cadáver responde com sinceridade, mas não pode fornecer informações que desconhecia enquanto estava vivo. Se falhar, ou após o cadáver terminar de responder às suas perguntas, ele se desfaz em pó."]},{"d":"Esplendor","n":"Novo Fôlego","t":"Talento","l":3,"c":2,"x":["Uma vez por descanso, ao acertar um ataque contra um adversário, você pode recuperar 1 Ponto de Vida ou 3 Pontos de Fadiga. Em um sucesso com Esperança, você também recupera 1 PV ou 3 PF de um aliado próximo."]},{"d":"Esplendor","n":"Voz da Razão","t":"Talento","l":3,"c":1,"x":["Você fala com poder e autoridade sem igual. Você tem vantagem em testes para acalmar situações violentas ou convencer alguém a seguir sua ordem. Além disso, você demonstra mais firmeza sob pressão. Quando todos seus Pontos de Fadiga estiverem marcados, você ganha um bônus de +1 na Proficiência para rolagens de dano."]},{"d":"Esplendor","n":"Adivinhação","t":"Feitiço","l":4,"c":1,"x":["Uma vez por descanso longo, **gaste 3 Pontos de Esperança** para se comunicar com as forças do além e fazer uma única pergunta sobre algum e
