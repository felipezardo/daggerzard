vento, lugar, pessoa ou situação no futuro próximo que possa ser respondida com “sim” ou “não”. O tempo presente desaparece por um momento e a resposta surge magicamente diante de você."]},{"d":"Esplendor","n":"Sigilo da Vida","t":"Feitiço","l":4,"c":1,"x":["**Gaste 3 Pontos de Esperança** e escolha um aliado próximo. Ele é marcado por um brilhante sigilo de proteção. Quando esse aliado for fazer um movimento de morte, ele recupera 1 PV em vez disso.","Este efeito termina quando salva o alvo de um movimento de morte, quando você conjura Sigilo da Vida sobre outro alvo ou quando faz um descanso longo."]},{"d":"Esplendor","n":"Moldar Material","t":"Feitiço","l":5,"c":1,"x":["**Gaste 1 Ponto de Esperança** para moldar parte de um material natural que esteja tocando (como gelo, madeira ou pedra) à sua vontade. A área do material não pode ser maior que você. Por exemplo, você pode criar uma ferramenta rudimentar ou criar uma porta.","Você só pode afetar o material próximo do ponto que você está tocando."]},{"d":"Esplendor","n":"Punição","t":"Feitiço","l":5,"c":2,"x":["Uma vez por descanso, **gaste 3 Pontos de Esperança** para carregar sua Punição. Ao acertar seu próximo ataque com uma arma, dobre o resultado da rolagem de dano. Independentemente do tipo de dano da arma, este ataque causa dano mágico."]},{"d":"Esplendor","n":"Restauração","t":"Feitiço","l":6,"c":2,"x":["Após um descanso longo, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Toque uma criatura e gaste qualquer quantidade de marcadores. Para cada marcador gasto, recupere 2 Pontos de Vida ou Pontos de Fadiga do alvo. Você também pode gastar um marcador desta carta para tocar uma criatura e recuperá-la da condição *Vulnerável* ou curar uma doença física ou mágica (o mestre pode exigir o gasto de mais marcadores, dependendo da potência da doença).","Após um descanso longo, marcadores não utilizados são perdidos."]},{"d":"Esplendor","n":"Zona de Proteção","t":"Feitiço","l":6,"c":2,"x":["Faça um **teste de conjuração (16)**. Uma vez por descanso longo, em um sucesso, escolha um ponto em alcance distante e crie uma zona de proteção visível para todos os aliados muito próximos do ponto de origem. Ao fazer isso, coloque **1d6** nesta carta, com o 1 virado para cima. Quando um aliado na zona de proteção sofre dano, reduza esse dano pelo valor do dado. Em seguida, aumente o valor do dado em um. Se o valor do dado for ultrapassar 6, este efeito termina."]},{"d":"Esplendor","n":"Dom do Esplendor","t":"Talento","l":7,"c":2,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Esplendor, receba os seguintes benefícios:","• Um bônus de +3 no seu limiar de dano grave;","• Uma vez por descanso longo, quando o dano sofrido exigir que marque PV, você pode, em vez disso, marcar uma quantidade equivalente de PF ou gastar uma quantidade equivalente de Esperança."]},{"d":"Esplendor","n":"Golpe Curativo","t":"Feitiço","l":7,"c":1,"x":["Ao causar dano a um adversário, você pode **gastar 2 Pontos de Esperança** para recuperar 1 PV de um aliado próximo."]},{"d":"Esplendor","n":"Aura Defensora","t":"Feitiço","l":8,"c":2,"x":["**Marque 1 Ponto de Fadiga** para conjurar uma aura protetora sobre um alvo muito próximo. Quando o alvo marca 1 Ponto de Armadura, ele reduz a gravidade do ataque em um limiar adicional. Se este feitiço fizer uma criatura que sofreria dano não marcar Pontos de Vida, o efeito termina. Você pode manter a Aura Defensora apenas sobre uma criatura por vez."]},{"d":"Esplendor","n":"Fulgor Atordoante","t":"Feitiço","l":8,"c":2,"x":["Faça um **teste de conjuração** para disparar raios solares contra todos os adversários distantes à sua frente. Em um sucesso, **gaste qualquer quantidade de Pontos de Esperança** e force um número equivalente de alvos atingidos a fazer um teste de reação (14).","Alvos bem-sucedidos sofrem **3d20+3** de dano mágico. Alvos que falharem sofrem **4d20+5** de dano mágico e ficam temporariamente *Atordoados*. Enquanto estiverem *Atordoados*, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem dessa condição."]},{"d":"Esplendor","n":"Aura Esmagadora","t":"Feitiço","l":9,"c":2,"x":["Faça um **teste de conjuração (15)** para fortalecer sua aura com magia. Em um sucesso, **gaste 2 Pontos de Esperança** para tornar sua Presença igual ao seu atributo de conjuração até seu próximo descanso longo.","Enquanto este feitiço estiver ativo, seus adversários devem marcar 1 Ponto de Fadiga ao selecionarem você como alvo de um ataque."]},{"d":"Valor","n":"Armadura Corporal","t":"Talento","l":1,"c":0,"x":["Enquanto não equipar uma armadura, você tem Armadura base igual a 3 + sua Força e usa estes limiares de dano base:","• *1º patamar*: 9/19;","• *2º patamar*: 11/24;","• *3º patamar*: 13/31;","• *4º patamar*: 15/38."]},{"d":"Valor","n":"Imposição","t":"Talento","l":1,"c":0,"x":["Ataque um alvo corpo a corpo com sua arma principal. Em um sucesso, você causa dano e o empurra para um ponto em alcance próximo. Em um sucesso com Esperança, acrescente **1 d6** à rolagem de dano.","Além disso, **gaste 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável*"]},{"d":"Valor","n":"Sou Seu Escudo","t":"Talento","l":1,"c":1,"x":["Quando um aliado muito próximo for sofrer dano, você pode **marcar 1 Ponto de Fadiga** para prostrar-se no caminho e virar o alvo do ataque no lugar dele. Ao sofrer dano desse ataque, você pode marcar um número qualquer de Pontos de Armadura."]},{"d":"Esplendor","n":"Feixe de Remissão","t":"Feitiço","l":9,"c":2,"x":["Faça um **teste de conjuração (16)**. Em um sucesso, **marque uma quantidade qualquer de PF** para escolher uma linha de aliados em alcance distante como alvo. Você pode recuperar um número de Pontos de Vida, divididos como você quiser entre os alvos, igual à quantidade de PF que marcou."]},{"d":"Esplendor","n":"Ressurreição","t":"Feitiço","l":10,"c":2,"x":["Faça um **teste de conjuração (20)**. Em um sucesso, faça com que uma criatura morta há no máximo 100 anos volte à vida com todas as suas capacidades. Em seguida, role **1d6**. Se tirar 5 ou menos, coloque esta carta na reserva permanentemente.","Se falhar, você não pode conjurar Ressurreição novamente por uma semana."]},{"d":"Esplendor","n":"Revigorar","t":"Feitiço","l":10,"c":3,"x":["Após você ou um aliado próximo usar uma habilidade com limite de uso (como uma vez por descanso ou uma vez por sessão), você pode **gastar uma quantidade qualquer de Pontos de Esperança** e rolar um número equivalente de **d6**. Se tirar 6 em qualquer dado, a habilidade pode ser usada novamente."]},{"d":"Valor","n":"Força Esmagadora","t":"Talento","l":2,"c":1,"x":["Você usa toda sua força física em um combate. Ao acertar um ataque usando uma arma com alcance corpo a corpo, receba um bônus igual à sua Força na rolagem de dano."]},{"d":"Valor","n":"Presença Corajosa","t":"Talento","l":2,"c":0,"x":["Ao fazer um teste de Presença, você pode **gastar 1 Ponto de Esperança** para somar sua Força à rolagem. Além disso, uma vez por descanso, quando for sofrer uma condição, você pode descrever como sua Presença. Corajosa ajuda na situação e impede que você sofra a condição."]},{"d":"Valor","n":"Inspiração Crítica","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso, quando você obtém um sucesso crítico em um ataque, todos os aliados muito próximos podem recuperar 1 PF ou receber 1 Ponto de Esperança."]},{"d":"Valor","n":"Palavras de Conforto","t":"Talento","l":3,"c":1,"x":["Uma vez por descanso longo, quando você consola ou inspira um aliado que falhou em um teste, vocês dois podem recuperar 2 Pontos de Fadiga cada."]},{"d":"Valor","n":"Bastião","t":"Talento","l":4,"c":2,"x":["Quando um aliado próximo falhar em um teste, você pode **gastar 2 Pontos de Esperança** para permitir que ele role novamente o Dado de Medo ou de Esperança."]},{"d":"Valor","n":"Incitar","t":"Talento","l":4,"c":1,"x":["Descreva como você provoca um alvo próximo. Em seguida, faça um **teste de Presença** contra ele. Em um sucesso, o alvo deve marcar 1 PF e, na próxima vez que o mestre colocá-lo em foco, ele deve atacar você com desvantagem."]},{"d":"Valor","n":"Armeiro","t":"Talento","l":5,"c":1,"x":["Você recebe um bônus de +1 na Armadura enquanto estiver usando armadura. Ao escolher Reparar Armadura como movimento de repouso durante um descanso, seus aliados também recuperam 1 Ponto de Armadura."]},{"d":"Valor","n":"Golpe Inspirador","t":"Talento","l":5,"c":1,"x":["Uma vez por descanso, ao ter sucesso crítico em um ataque, você e todos os aliados que possam vê-lo ou ouvi-lo podem recuperar 1 Ponto de Vida ou **1d4** Pontos de Fadiga."]},{"d":"Valor","n":"Altivez","t":"Talento","l":6,"c":2,"x":["Receba um bônus igual à sua Proficiência no seu limiar grave. Ao marcar 1 ou mais PV devido a um ataque, recupere 1 Ponto de Fadiga."]},{"d":"Valor","n":"Inevitável","t":"Talento","l":6,"c":1,"x":["Ao falhar em um teste, seu próximo teste é feito com vantagem."]},{"d":"Valor","n":"Desprezar Fraqueza","t":"Talento","l":7,"c":1,"x":["Quando sofrer dano, você pode **marcar 1 Ponto de Fadiga** para reduzir a gravidade do dano em um limiar. Ao fazer isso, role **1d6**. Se tirar 3 ou menos, coloque esta carta na reserva."]},{"d":"Valor","n":"Dom do Valor","t":"Talento","l":7,"c":1,"x":["Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Valor, receba os seguintes benefícios:","• Bônus de +1 na Armadura;","• Ao marcar 1 ou mais Pontos de Vida sem marcar Pontos de Armadura, recupere 1 PA."]},{"d":"Valor","n":"Abalo Sísmico","t":"Talento","l":8,"c":2,"x":["**Gaste 2 Pontos de Esperança** para golpear o solo abaixo de você. Faça um **teste de Força** contra todos os alvos próximos. Alvos atingidos são empurrados para um ponto em alcance distante e devem fazer um teste de reação (17). Quem falhar, sofre **4d10+8** de dano. Quem passar sofre metade do dano."]},{"d":"Valor","n":"Testar os Limites","t":"Talento","l":8,"c":1,"x":["Uma vez por descanso longo, **marque 3 Pontos de Fadiga** para testar os limites de seu corpo. Você recebe um bônus de +2 em todos os atributos até seu próximo descanso."]},{"d":"Valor","n":"Líder Exemplar","t":"Talento","l":9,"c":3,"x":["Ao causar dano a um adversário, você pode **marcar 1 PF** e descrever como encoraja seus aliados. O próximo personagem que atacar esse adversário pode recuperar 1 Ponto de Fadiga ou receber 1 Ponto de Esperança."]},{"d":"Valor","n":"Manter Posição","t":"Talento","l":9,"c":1,"x":["Descreva a posição defensiva que você assume e **gaste 1 Ponto de Esperança**. Se um adversário se mover para alcance muito próximo, ele é puxado para o alcance corpo a corpo e fica *Imobilizado*.","Esta condição dura até você se mover ou rolar uma falha com Medo, ou até o mestre gastar 2 Pontos de Medo no turno dele para encerrá-la."]},{"d":"Valor","n":"Defesa Irredutível","t":"Talento","l":10,"c":1,"x":["Quando for marcar 1 Ponto de Armadura, role uma quantidade de **d6** igual à sua Proficiência. Se algum tirar 6, reduza a gravidade em um limiar sem marcar 1 Ponto de Armadura."]},{"d":"Valor","n":"Invencível","t":"Talento","l":10,"c":4,"x":["Ao marcar seu último Ponto de Vida, em vez de fazer um movimento de morte, você pode recuperar **1d6** Pontos de Vida. Em seguida, esta carta vai para sua reserva."]}],"subs":{"Bardo":[{"n":"Beletrista","desc":"*Seja um beletrista para cativar multidões com as palavras.*","a":[{"h":"Atributo de Conjuração","p":["Presença"]},{"h":"Habilidades Fundamentais","p":["*Discurso Inspirador:* uma vez por descanso longo, você pode fazer um discurso emocionante e inspirador. Todos os aliados até o alcance distante recuperam 2 Pontos de Fadiga.","*Alma de Poeta:* após fazer um teste para impressionar, persuadir ou ofender alguém, você pode **gastar 1 Ponto de Esperança** para somar **1d4** à rolagem."]},{"h":"Habilidade de Especialização","p":["*Eloquente:* suas palavras comoventes elevam o moral. Uma vez por sessão, ao encorajar um aliado, você pode fazer um dos seguintes:","• Ajudá-lo sem gastar Esperança;","• Dar um movimento de repouso adicional para ele usar em seu próximo descanso;","• Permitir que ele encontre uma ferramenta ou objeto mundano de que necessite."]},{"h":"Habilidade de Maestria","p":["*Poesia Épica:* seu Dado de Inspiração aumenta para **d10**. Além disso, ao prestar ajuda, você pode descrever o momento como se estivesse contando o heroísmo dele em uma história. Ao fazer isso, role **1d10** como seu dado de vantagem."]}]},{"n":"Trovador","desc":"*Seja um trovador para tecer canções que fortalecem seus* *aliados.*","a":[{"h":"Atributo de Conjuração","p":["Presença"]},{"h":"Habilidade Fundamental","p":["*Artista Talentoso:* descreva como você se apresenta para as pessoas. Você pode cantar ou tocar cada canção uma vez por descanso longo:","• *Canção Comovente:* você e todos os aliados próximos recebem 1 Ponto de Esperança.","• *Canção Épica:* deixe um alvo próximo temporariamente *Vulnerável*.","• *Canção Relaxante:* você e todos os aliados próximos recuperam 1 Ponto de Vida."]},{"h":"Habilidade de Especialização","p":["*Maestro:* suas canções inspiram coragem naqueles que as ouvem. Ao conceder um Dado de Inspiração a um aliado, ele pode receber 1 Ponto de Esperança ou recuperar 1 PF."]},{"h":"Habilidade de Maestria","p":["*Virtuoso:* você está entre os maiores de sua arte e sua perícia não tem precedentes. Cada canção de Artista Talentoso pode ser apresentada duas vezes por descanso longo, em vez de uma."]}]}],"Druida":[{"n":"Protetor dos Elementos","desc":"*Seja um protetor dos elementos para incorporar as forças* *primordiais da natureza.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"]},{"h":"Habilidade Fundamental","p":["• *Encarnação Elemental:* **marque 1 Ponto de Fadiga** para *Canalizar* um dos seguintes elementos até sofrer dano grave ou até seu próximo descanso:","*Água:* quando você causa dano a um adversário corpo a corpo, todos os outros adversários muito próximos devem marcar 1 Ponto de Fadiga.","*Ar:* você pode pairar para receber vantagem em testes de Agilidade.","*Fogo:* quando um adversário corpo a corpo causa dano a você, ele sofre **1d10** pontos de dano mágico. *Terra:* você recebe um bônus igual à sua Proficiência em todos os seus limiares de dano."]},{"h":"Habilidade de Especialização","p":["*Aura Elemental:* uma vez por descanso, enquanto estiver *Canalizando*, você pode manifestar uma aura correspondente ao seu elemento. Ela afeta alvos próximos até o fim da sua *Canalização*.","• *Água:* quando um adversário causa dano a você, você pode **marcar 1 Ponto de Fadiga** para movê-lo para qualquer ponto muito próximo de onde ele está.","• *Ar:* quando você ou um aliado sofre dano de um ataque oriundo de fora do alcance próximo, reduza esse dano em **– 1d8**.","• *Fogo:* quando um adversário marca 1 ou mais Pontos de Vida, ele também deve marcar 1 Ponto de Fadiga.","• *Terra:* seus aliados recebem um bônus de +1 em Força."]},{"h":"Habilidade de Maestria","p":["*Soberania Elemental:* você incorpora ainda mais seu elemento. Enquanto estiver *Canalizando*, você recebe o seguinte benefício:","• *Água:* quando um ataque contra você é bem-sucedido, você pode **marcar 1 Ponto de Fadiga** para deixar o atacante temporariamente *Vulnerável.*","• *Ar:* você recebe um bônus de +1 na Evasão e pode voar.","• *Fogo:* você recebe um bônus de +1 em sua Proficiência para ataques e feitiços que causam dano.","• *Terra:* quando for marcar Pontos de Vida, role **1d6** para cada Ponto de Vida a ser marcado. A cada 6 que você rolar, reduza o número de PV marcados em –1."]}]},{"n":"Protetor da Renovação","desc":"*Seja um protetor da renovação para curar o grupo com* *poderosos efeitos mágicos.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"]},{"h":"Habilidades Fundamentais","p":["*Serenidade da Natureza:* uma vez por descanso longo, você pode criar um espaço de serenidade natural em alcance próximo. Ao gastar alguns minutos descansando no espaço, recupere PF do grupo (distribuído entre você e seus aliados à sua escolha) em um número igual ao seu Instinto.","*Regeneração:* toque uma criatura e **gaste 3 Pontos de Esperança**. Ela recupera **1d4** Pontos de Vida."]},{"h":"Habilidades de Especialização","p":["*Presença Curativa:* você pode usar sua Regeneração em criaturas Muito Próximas.","• *Proteção Druídica:* uma vez por descanso longo, **gaste 2 Pontos de Esperança** para recuperar 2 PV de **1d4** aliados próximos."]},{"h":"Habilidade de Maestria","p":["*Defensor:* sua transformação animal incorpora um espírito curativo protetor. Quando você está em Forma de Fera e um aliado próximo marca 2 ou mais Pontos de Vida, você pode **marcar 1 Ponto de Fadiga** para reduzir o número de PV marcados por esse aliado em –1."]}]}],"Guardião":[{"n":"Baluarte","desc":"*Seja um baluarte para continuar lutando mesmo após sofrer* *golpes poderosos.*","a":[{"h":"Habilidades Fundamentais","p":["*Resoluto:* você recebe um bônus permanente de +1 em seus limiares de dano.","*Vontade de Ferro:* ao sofrer dano físico, você pode **marcar 1 Ponto de Armadura adicional** para reduzir a gravidade."]},{"h":"Habilidades de Especialização","p":["*Irrefreável:* você recebe um bônus permanente de +2 em seus limiares de dano.","*Irmãos de Armas:* quando um aliado muito próximo sofrer dano físico, você pode **marcar 1 Ponto de Armadura** para reduzir a gravidade em um limiar."]},{"h":"Habilidades de Maestria","p":["*Impávido:* você recebe um bônus permanente de +3 em seus limiares de dano.","*Protetor Leal:* quando um aliado próximo tiver 2 PV ou menos e for sofrer dano, você pode **marcar 1 Ponto de Fadiga** para tomar sua frente e sofrer o dano em seu lugar."]}]},{"n":"Vingador","desc":"*Seja um vingador para subjugar as ameaças contra você ou* *seus aliados.*","a":[{"h":"Habilidades Fundamentais","p":["*Vem Tranquilo:* receba 1 Ponto de Fadiga adicional.","*Revanche:* quando um adversário corpo a corpo acerta um ataque contra você, você pode **marcar 2 Pontos de Fadiga** para forçá-lo a marcar 1 Ponto de Vida."]},{"h":"Habilidade de Especialização","p":["*Represália:* quando um adversário causar dano a um aliado corpo a corpo, você recebe um bônus de +1 na sua Proficiência no próximo ataque que acertar contra ele."]},{"h":"Habilidade de Maestria","p":["*Nêmesis:* **gaste 2 Pontos de Esperança** para *Priorizar* um adversário até seu próximo descanso. Ao atacar um adversário *Priorizado*, você pode trocar os resultados dos Dados de Esperança e Medo um pelo outro. Você só pode *Priorizar* um adversário por vez."]}]}],"Patrulheiro":[{"n":"Rastreador","desc":"*Seja um rastreador para caçar suas presas e atacar com força* *letal.*","a":[{"h":"Atributo de Conjuração","p":["Agilidade"]},{"h":"Habilidades Fundamentais","p":["*Predador Implacável:* quando fizer uma rolagem de dano, você pode **marcar 1 Ponto de Fadiga** para receber um bônus de +1 na Proficiência. Além disso, quando você causa dano grave a um adversário, ele deve marcar 1 Ponto de Fadiga.","*Avante:* quando estiver viajando para um lugar que já visitou, ou se possuir um objeto que já esteve nesse lugar, você pode identificar o caminho mais curto e direto até esse destino."]},{"h":"Habilidade de Especialização","p":["*Predador Veloz:* quando um adversário *Marcado* ataca você, você recebe um bônus de +2 na Evasão contra esse ataque."]},{"h":"Habilidade de Maestria","p":["*Predador Apex:* antes de fazer um teste de ataque contra um adversário *Marcado*, você pode **gastar 1 Ponto de Esperança**. Em um sucesso, o mestre perde 1 Ponto de Medo."]}]},{"n":"Treinador","desc":"*Seja um treinador para formar um laço profundo com um* *animal.*","a":[{"h":"Atributo de Conjuração","p":["Agilidade"]},{"h":"Habilidade Fundamental","p":["*Companheiro Animal:* você tem um companheiro animal à sua escolha (e a critério do mestre). Ele estará ao seu lado a não ser que você ordene o contrário. Use a ficha de companheiro animal. Quando você subir de nível, escolha também uma das opções de aumento de nível na ficha do seu companheiro."]},{"h":"Habilidades de Especialização","p":["*Treinamento Especializado:* escolha uma opção de aumento de nível adicional para seu companheiro animal.","*Unidos na Batalha:* se um adversário está em alcance corpo a corpo de seu companheiro animal e ataca você, você recebe +2 de bônus na Evasão contra esse ataque."]},{"h":"Habilidades de Maestria","p":["• *Treinamento Avançado:* escolha duas opções de aumento de nível adicionais para seu companheiro animal.","*Amigo Leal:* uma vez por descanso longo, quando um ataque faria você marcar seu último PV ou seu companheiro marcar o último PF e vocês dois estiverem próximos um do outro, se ficarem em alcance corpo a corpo, você pode sofrer o dano no lugar dele ou ele pode sofrer o dano no seu lugar."]}]}],"Ladino":[{"n":"Gatuno","desc":"*Seja um gatuno para manipular as sombras e se esgueirar* *pelo ambiente.*","a":[{"h":"Atributo de Conjuração","p":["Acuidade"]},{"h":"Habilidade Fundamental","p":["*Passo Sombrio:* você pode se movimentar de uma sombra para outra. Ao entrar em uma área de escuridão ou na sombra de outra criatura ou objeto, você pode **marcar 1 PF** para desaparecer de onde está e reaparecer dentro de outra sombra distante. Ao reaparecer, considera-se que você está *Oculto*."]},{"h":"Habilidades de Especialização","p":["*Nuvem de Escuridão:* faça um **teste de conjuração (15)**. Se bem-sucedido, você cria uma nuvem de escuridão temporária que cobre toda a área Próxima. Criaturas no interior da nuvem não podem enxergar o lado de fora, e vice-versa. Considera- se que você está *Oculto* para qualquer adversário cuja linha de visão esteja bloqueada pela nuvem.","*Adrenalina:* enquanto estiver *Vulnerável*, some seu nível às suas rolagens de dano."]},{"h":"Habilidades de Maestria","p":["*Sombra Fugaz:* você recebe um bônus permanente de +1 na Evasão. Além disso, pode usar Passo Sombrio para se mover até uma sombra muito distante.","*Desaparecimento:* **marque 1 Ponto de Fadiga** para ficar *Oculto* a qualquer momento. Enquanto estiver *Oculto* devido a esta habilidade, você se recupera automaticamente da condição *Imobilizado*, se estiver com ela. Você permanece *Oculto* desta forma até rolar com Medo ou até seu próximo descanso."]}]},{"n":"Mafioso","desc":"*Seja um mafioso para ter uma rede de contatos onde quer* *que vá.*","a":[{"h":"Atributo de Conjuração","p":["Acuidade"]},{"h":"Habilidade Fundamental","p":["*Conexões:* quando chega a uma cidade ou lugar importante, você conhece alguém lá. Dê um nome a essa conexão, anote como ela pode ser útil e escolha um fato da lista a seguir:","• A conexão me deve um favor, mas econtrá-la será difícil;","• A conexão vai pedir algo em troca;","• A conexão sempre está em apuros;","• Costumávamos ser parceiros. É uma longa história;","• Nossa separação não foi das melhores."]},{"h":"Habilidade de Especialização","p":["• *Contatos:* uma vez por sessão, você pode convocar brevemente um contato escuso. Escolha um dos benefícios abaixo e descreva o que fez seu contato vir ajudá-lo:","Ele fornece 1 punhado de ouro, uma ferramenta única ou um objeto mundano necessário para a situação; A ajuda dele fornece um bônus de +3 no resultado de seu Dado de Medo ou Esperança no seu próximo teste; Na próxima vez que você causar dano, ele dispara das sombras, somando **+2d8** à sua rolagem de dano."]},{"h":"Habilidade de Maestria","p":["*Reforços Confiáveis:* você pode usar Contatos três vezes por sessão. As seguintes opções são adicionadas à lista de benefícios que você pode escolher quando a usa:","• Quando você marca 1 Ponto de Vida ou mais, ele pode correr em sua defesa, reduzindo o número de PV marcados em –1;","• Quando você faz um teste de Presença em uma conversa, ele pode ajudar, permitindo que você use **1d20** como seu Dado de Esperança."]}]}],"Serafim":[{"n":"Portador Divino","desc":"*Seja um portador divino para dominar o campo de batalha* *com uma arma lendária.*","a":[{"h":"Atributo de Conjuração","p":["Força"]},{"h":"Habilidades Fundamentais","p":["*Arma Espiritual:* se você tem equipada uma arma com alcance corpo a corpo ou muito próximo, ela pode voar da sua mão para atacar um adversário próximo e então retornar para você. Você pode **marcar 1 PF** para escolher um adversário adicional dentro do alcance como alvo, usando o mesmo teste de ataque.","*Toque Piedoso:* uma vez por descanso longo, toque uma criatura para que ela recupere 2 PV ou 2 PF."]},{"h":"Habilidade de Especialização","p":["*Devoção:* ao rolar seus Dados de Oração, você pode rolar um dado adicional e descartar o menor resultado. Além disso, você pode usar seu Toque Piedoso duas vezes por descanso longo em vez de uma."]},{"h":"Habilidade de Maestria","p":["*Ressonância Sagrada:* ao rolar o dano de sua Arma Espiritual, se dois ou mais dados resultarem no mesmo número, dobre o valor de cada dado com resultado igual. Por exemplo, se você tirar dois 5, eles contam como dois 10."]}]},{"n":"Sentinela Alada","desc":"*Seja uma sentinela alada para levantar voo e desferir golpes* *aéreos devastadores.*","a":[{"h":"Atributo de Conjuração","p":["Força"]},{"h":"Habilidade Fundamental","p":["*Asas de Luz:* você pode voar e, enquanto estiver voando, pode:","• **Marcar 1 Ponto de Fadiga** para erguer e carregar uma criatura voluntária aproximadamente do seu tamanho ou menor;","• **Gastar 1 Ponto de Esperança** para causar **1d8** de dano adicional em um ataque bem-sucedido."]},{"h":"Habilidade de Especialização","p":["*Visagem Etérea:* sua feição sobrenatural causa admiração e temor. Enquanto estiver voando, você tem vantagem em testes de Presença. Quando tem um sucesso com Esperança em testes de Presença, em vez de você receber Esperança, você faz o mestre perder 1 Ponto de Medo."]},{"h":"Habilidades de Maestria","p":["*Ascensão:* você recebe um bônus permanente de +4 no seu limiar de dano grave.","*Poder dos Deuses:* enquanto estiver voando, você causa **1d12** em vez de 1d8 de dano adicional com suas Asas de Luz."]}]}],"Feiticeiro":[{"n":"Elementalista","desc":"*Seja um elementalista para canalizar magia bruta e moldá-la* *na forma de um elemento específico.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"]},{"h":"Habilidade Fundamental","p":["*Elementalismo:* escolha um dos seguintes elementos na criação de personagem: água, ar, fogo, relâmpago, terra.","Você pode moldar esse elemento para causar efeitos inofensivos. Além disso, ao **gastar 1 Ponto de Esperança** e descrever como seu controle sobre esse elemento ajuda em um teste que você esteja prestes a fazer, você recebe um bônus de +2 nesse teste ou um bônus de +3 na rolagem de dano."]},{"h":"Habilidade de Especialização","p":["• *Evasão Natural:* você pode convocar seu elemento para se proteger. Quando sofre um ataque, você pode **marcar 1 Ponto** **de Fadiga** e descrever como usa seu elemento para se defender. Ao fazer isso, role **1d6** e some o resultado à sua Evasão contra esse ataque."]},{"h":"Habilidade de Maestria","p":["*Transcendência:* uma vez por descanso longo, você pode se transformar em uma manifestação física de seu elemento. Ao fazer isso, descreva sua transformação e escolha dois dos benefícios abaixo para receber até seu próximo descanso:","• Bônus de +4 no seu limiar grave;","• Bônus de +1 em um atributo à sua escolha;","• Bônus de +1 em sua Proficiência;","• Bônus de +2 na sua Evasão."]}]},{"n":"Primordialista","desc":"*Seja um primordialista para estender a versatilidade de seus* *feitiços de maneiras poderosas.*","a":[{"h":"Atributo de Conjuração","p":["Instinto"]},{"h":"Habilidade Fundamental","p":["*Manipular Magia:* sua herança primordial permite que você altere a própria essência da magia. Após conjurar um feitiço ou atacar com uma arma que causa dano mágico, você pode **marcar 1 Ponto de Fadiga** para fazer um dos seguintes:","• Estender o alcance do ataque ou feitiço em um passo (por exemplo, de muito próximo para próximo);","• Receber um bônus de +2 no resultado do teste;","• Dobrar um dado de dano à sua escolha;","• Acertar um alvo adicional dentro do alcance."]},{"h":"Habilidade de Especialização","p":["*Auxílio Encantado:* você pode aprimorar a magia alheia com sua essência. Ao ajudar um aliado com um teste de conjuração, você pode rolar **1d8** como seu dado de vantagem. Uma vez por descanso longo, após um aliado fazer um teste de conjuração com sua ajuda, você pode trocar os resultados dos Dados de Dualidade um pelo outro."]},{"h":"Habilidade de Maestria","p":["*Carga Arcana:* você pode reunir energia mágica para aprimorar suas capacidades. Ao sofrer dano mágico, você fica *Carregado*; você também pode **gastar 2 Pontos de Esperança** para ficar *Carregado*. Enquanto estiver *Carregado*, ao acertar um ataque que causa dano mágico, você pode zerar sua *Carga* receber um bônus de +10 em sua rolagem de dano ou um bônus de +3 na Dificuldade de um teste de reação que o feitiço exija do alvo. Você deixa de estar *Carregado* em seu próximo descanso longo."]}]}],"Guerreiro":[{"n":"Escolhido da Bravura","desc":"*Seja um escolhido da bravura para se alimentar da força dos* *inimigos.*","a":[{"h":"Habilidades Fundamentais","p":["*Coragem:* ao falhar com Medo, receba 1 Ponto de Esperança.","*Ritual de Batalha:* uma vez por descanso longo, antes de fazer algo muito perigoso ou enfrentar um oponente claramente superior a você, descreva sua preparação para isso. Então, recupere 2 Pontos de Fadiga e receba 2 Pontos de Esperança."]},{"h":"Habilidade de Especialização","p":["*Enfrentar o Desafio:* você se mantém vigilante frente ao perigo crescente. Enquanto tiver 2 PV ou menos desmarcados, você pode usar **1d20** como seu Dado de Esperança."]},{"h":"Habilidade de Maestria","p":["*Camaradagem:* sua bravura inspira seus aliados. Você pode iniciar um teste em dupla adicional por sessão. Além disso, um aliado só precisa gastar 2 Pontos de Esperança para iniciar um teste em dupla com você."]}]},{"n":"Escolhido da Matança","desc":"*Seja um escolhido da matança para derrubar os adversários* *com uma força imensa.*","a":[{"h":"Habilidade Fundamental","p":["*Matança:* a o rolar com Esperança, você pode colocar **1d6** nesta carta em vez de receber 1 Ponto de Esperança. Dados nesta carta são seus Dados de Matança; você pode possuir um número máximo desses dados igual à sua Proficiência. Ao fazer um teste de ataque ou uma rolagem de dano, você pode gastar um número qualquer de Dados de Matança e somar seus resultados à rolagem. No fim de cada sessão, Dados de Matança não utilizados são perdidos; você ganha 1 Ponto de Esperança por dado perdido desta forma."]},{"h":"Habilidade de Especialização","p":["*Especialista em Armas:* você pode empunhar várias armas. Quando acerta um ataque, você pode **gastar 1 Ponto de Esperança** para somar um dos dados de dano da sua arma secundária à rolagem de dano. Além disso, uma vez por descanso longo, role novamente quaisquer 1 que rolar nos seus Dados de Matança."]},{"h":"Habilidade de Maestria","p":["*Preparação Marcial:* você pode treinar seu grupo durante descansos. Você, e cada aliado que fizer este movimento de descanso, recebe **1d6** como Dado de Matança. Um personagem com um Dado de Matança pode gastá-lo para somar seu resultado a um teste de ataque ou rolagem de dano."]}]}],"Mago":[{"n":"Discípulo do Conhecimento","desc":"*Seja um discípulo do conhecimento para ter uma profunda* *compreensão do mundo ao seu redor.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"]},{"h":"Habilidades Fundamentais","p":["• *Promissor:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Adepto:* quando usar uma Experiência, você pode **marcar 1 PF** em vez de gastar 1 Ponto de Esperança. Se o fizer, dobre seu modificador de Experiência para essa rolagem."]},{"h":"Habilidades de Especialização","p":["*Talentoso:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Troca Perfeita:* uma vez por descanso, quando troca uma carta de domínio de sua reserva, você pode reduzir o custo de troca em –1."]},{"h":"Habilidades de Maestria","p":["*Brilhante:* pegue uma carta de domínio adicional, do seu nível ou inferior, de um domínio ao qual você tenha acesso.","*Bem Vivido:* ao usar uma Experiência, role **1d6**. Se tirar 5 ou mais, você pode usá-la sem gastar Pontos de Esperança."]}]},{"n":"Discípulo da Guerra","desc":"*Seja um discípulo da guerra para usar seu treinamento mágico* *de forma agressiva.*","a":[{"h":"Atributo de Conjuração","p":["Conhecimento"]},{"h":"Habilidades Fundamentais","p":["*Mago de Batalha:* você estudou para se tornar uma força insuperável no campo de batalha. Receba 1 Ponto de Vida adicional.","*Encare o Medo:* ao ter sucesso com Medo em um teste de ataque, você causa **1d10** de dano mágico adicional."]},{"h":"Habilidades de Especialização","p":["*Conjurar Escudo:* você consegue manter uma barreira mágica protetora. Enquanto tiver ao menos 2 Pontos de Esperança,","**ANCESTRALIDADES**","*Ancestralidades representam a ascendência de seu* *personagem e afetam sua aparência física.*","*Esta seção descreve as ancestralidades de Daggerheart e as* *características físicas compartilhadas* *pelos membros de cada uma. Isso posto, você sempre pode* *decidir que seu personagem tem* *características físicas fora do “padrão” ou da “média” da sua* *ancestralidade. Procure inspiração* *nas ilustrações e explore a diversidade das ancestralidades* *ao criar seu personagem.*","Esta seção fornece um panorama das formas físicas variadas das criaturas de Daggerheart. Ao longo do jogo, você encontrará membros de todas as ancestralidades e terá a oportunidade de aprender suas nuances e qualidades exclusivas. Você também perceberá que o termo “pessoa”, no mundo de Daggerheart, é usado para se referir a membros de qualquer ancestralidade, visto que indivíduos de todas elas têm aspectos físicos, personalidades e culturas únicas.","Algumas ancestralidades são descritas com o termo “humanoide”. Isso não significa que elas tenham relação com os “humanos”, a ancestralidade mais reconhecível em","• some sua Proficiência à sua Evasão.","• *Movido por Medo:* o dano mágico adicional de Encare o Medo aumenta para **2d10**."]},{"h":"Habilidades de Maestria","p":["*Triunfo do Caos:* ao ter sucesso em um ataque, você pode **marcar 1 Ponto de Fadiga** após a rolagem de dano para forçar o alvo a marcar 1 PV adicional.","*Não Tenha Medo:* o dano mágico adicional de Encare o Medo aumenta para **3d10**."]}]}]},"forms":[{"n":"Animal Doméstico","t":1,"ex":"(Cão, coelho, gato etc.)","ab":["*Companhia:* ao ajudar um aliado, você pode rolar **1d8** como seu dado de vantagem.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Instinto +1 | Evasão +2","atk":"Corpo a corpo (Instinto) d6 de dano fís.","adv":"Vantagem ao escalar, localizar, proteger"},{"n":"Aracnídeo Espreitador","t":1,"ex":"(Aranha-lobo, tarântula etc.)","ab":["*Lança-teia:* você pode criar uma poderosa teia, útil em explorações e em batalhas. Ela é forte o bastante para suportar uma criatura. Você pode *Imobilizar* temporariamente um alvo próximo se passar em um teste de Acuidade contra ele.","*Picada Peçonhenta:* quando acerta um ataque contra um alvo corpo a corpo, você o deixa temporariamente *Envenenado*. Uma criatura *Envenenada* sofre **1d10** de dano físico direto cada vez que age."],"st":"Acuidade +1 | Evasão +2","atk":"Cac (Acuidade) d6+1 de dano fís.","adv":"Vantagem ao atacar, escalar, mover-se furtivamente"},{"n":"Explorador Ágil","t":1,"ex":"(Camundongo, doninha, raposa etc.)","ab":["*Ágil:* seu movimento é silencioso e você pode **gastar 1 Ponto** **de Esperança** para se mover até um ponto distante sem precisar fazer um teste.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Agilidade +1 | Evasão +2","atk":"Corpo a corpo (Agilidade) d4 de dano fís.","adv":"Vantagem em enganar, localizar, mover-se furtivamente"},{"n":"Explorador Aquático","t":1,"ex":"(Enguia, peixe, polvo etc.)","ab":["*Aquático:* você pode respirar e se movimentar naturalmente embaixo d’água.","*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera."],"st":"Agilidade +1 | Evasão +2","atk":"Corpo a corpo (Agilidade) d4 de dano fís.","adv":"Vantagem ao mover-se furtivamente, nadar, orientar-se"},{"n":"Predador de Bando","t":1,"ex":"(Coiote, hiena, lobo etc.)","ab":["*Caça em Bando:* quando você acerta um ataque contra um alvo atingido por um aliado imediatamente antes de você, seu dano aumenta em **+1d8**.","*Golpe Debilitante:* quando você acerta um ataque contra um alvo corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para torná-lo temporariamente *Vulnerável*."],"st":"Força +2 | Evasão +1","atk":"Corpo a corpo (Força) d8+2 de dano fís.","adv":"Vantagem ao atacar, correr, rastrear"},{"n":"Ruminante Arisco","t":1,"ex":"(Cabra, cervo, gazela etc.)","ab":["*Frágil:* ao sofrer dano maior ou superior, você sai da Forma de Fera.","*Presa Arisca:* quando sofre um ataque, você pode **marcar 1** **Ponto de Fadiga** para rolar **1d4** e somar o resultado à sua Evasão contra esse ataque."],"st":"Agilidade +1 | Evasão +3","atk":"Corpo a corpo (Agilidade) d6 de dano fís.","adv":"Vantagem ao correr, mover-se furtivamente, saltar"},{"n":"Carapaça Vigilante","t":2,"ex":"(Pangolim, tartaruga, tatu etc.)","ab":["*Canhão Ricochete:* **marque 1 Ponto de Fadiga** para que um aliado arremesse você contra um adversário. Para fazer isso, o aliado faz um teste de ataque usando Agilidade ou Força (à escolha dele) contra um alvo próximo. Em um sucesso, o adversário sofre **d12+2** de dano físico usando a Proficiência de seu aliado. Você pode **gastar 1 Ponto de Esperança** para escolher outro adversário muito próximo do primeiro como alvo. O segundo alvo sofre metade do dano causado ao primeiro.","*Carapaça Reforçada:* seu exterior sólido concede resistência a dano físico. Além disso, você pode **marcar 1 Ponto de** **Armadura** para se recolher em sua carapaça. Enquanto estiver dentro dela, o dano físico que você sofre é reduzido em um número igual à sua Armadura (após aplicar a resistência), mas você não pode realizar outras ações."],"st":"Força +1 | Evasão +1","atk":"Corpo a corpo (Força) d8+2 de dano fís.","adv":"Vantagem ao cavar, localizar, proteger"},{"n":"Fera Alada","t":2,"ex":"(Coruja, corvo, gavião etc.)","ab":["*Ossos Ocos:* você sofre uma penalidade de –2 nos seus limiares de dano.","*Visão Aérea:* você pode voar à vontade. Uma vez por descanso, e enquanto estiver no ar, você pode perguntar ao mestre algo sobre a paisagem abaixo sem precisar de teste. Na primeira vez em que um personagem fizer um teste para agir em relação a essa informação, ele o faz com vantagem."],"st":"Acuidade +1 | Evasão +3","atk":"Cac (Acuidade) d4+2 de dano fís.","adv":"Vantagem ao enganar, intimidar, localizar"},{"n":"Fera Poderosa","t":2,"ex":"(Alce, touro, urso etc.)","ab":["*Ataque Violento:* quando tira 1 em um dado de dano, você pode rolar **1d10** e somar o resultado à rolagem de dano. Além disso, antes de fazer um teste de ataque, você pode **marcar 1** **Ponto de Fadiga** para receber um bônus de +1 em sua Proficiência para esse ataque.","*Couro Espesso:* você recebe +2 de bônus nos seus limiares de dano."],"st":"Força +3 | Evasão +1","atk":"Corpo a corpo (Força) d10+4 de dano fís.","adv":"Vantagem ao intimidar, orientar-se, proteger"},{"n":"Predador Furtivo","t":2,"ex":"(Guepardo, leão, onça etc.)","ab":["*Abate:* **marque 1 Ponto de Fadiga** para se mover até ficar corpo a corpo a um alvo e fazer um teste de ataque contra ele. Em um sucesso, você recebe +2 em sua Proficiência para esse ataque e o alvo deve marcar 1 Ponto de Fadiga.","*Disparada:* **gaste 1 Ponto de Esperança** para se mover até um ponto em alcance distante sem precisar fazer um teste."],"st":"Instinto +1 | Evasão +3","atk":"Cac (Instinto) d8+6 de dano fís.","adv":"Vantagem ao atacar, escalar, mover-se furtivamente"},{"n":"Serpente Traiçoeira","t":2,"ex":"(Cascavel, naja, víbora etc.)","ab":["*Bote Peçonhento:* faça um ataque contra qualquer número de alvos muito próximos. Em um sucesso, o alvo fica temporariamente *Envenenado*. Uma criatura *Envenenada* sofre **1d10** de dano físico direto a cada vez que age.","*Silvo de alerta:* **marque 1 Ponto de Fadiga** para forçar qualquer número de alvos corpo a corpo a se afastarem até ficarem muito próximos."],"st":"Acuidade +1 | Evasão +2","atk":"muito próximo (Acuidade) d8+4 de dano fís.","adv":"Vantagem ao deslizar, enganar, escalar"},{"n":"Trotador Robusto","t":2,"ex":"(Camelo, cavalo, zebra etc.)","ab":["*Atropelar:* **marque 1 Ponto de Fadiga** para se mover até um ponto em alcance próximo em linha reta e atacar todos os alvos corpo a corpo à linha. Alvos atingidos sofrem **d8+1** de dano físico usando sua Proficiência e ficam temporariamente *Vulneráveis.*","*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta."],"st":"Agilidade +1 | Evasão +2","atk":"Cac (Agilidade) d8+1 de dano fís.","adv":"Vantagem ao correr, orientar-se, saltar"},{"n":"Fera Lendária","t":3,"ex":"(Aprimoradamento de 1º patamar)","ab":["*Evoluído:* escolha uma Forma de Fera de 1º patamar e torne- se uma versão maior e mais poderosa dela. Enquanto estiver nessa forma, você mantém todos os atributos e habilidades da forma original e recebe os seguintes bônus: Bônus de +6 em rolagens de dano; Bônus de +1 no atributo da forma; Bônus de +2 na Evasão."],"st":"","atk":"","adv":""},{"n":"Grande Fera Alada","t":3,"ex":"(Águia-gigante, falcão etc.)","ab":["*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta.","*Visão Aérea:* você pode voar à vontade. Uma vez por descanso, e enquanto estiver no ar, você pode perguntar ao mestre algo sobre a paisagem abaixo sem precisar de teste. Na primeira vez em que um personagem fizer um teste para agir em relação a essa informação, ele o faz com vantagem."],"st":"Acuidade +2 | Evasão +3","atk":"Cac (Acuidade) d8+6 de dano fís.","adv":"Vantagem ao distrair, enganar, localizar"},{"n":"Grande Predador","t":3,"ex":"(Lobo-atroz, tigre-dentes-de-sabre, velociraptor etc.)","ab":["*Ataque Voraz:* quando acerta um ataque em um alvo, você pode **gastar 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável* e receber um bônus de +1 em Proficiência nesse ataque.","*Besta de Carga:* você pode carregar até dois aliados voluntários com você enquanto se movimenta."],"st":"Força +2 | Evasão +2","atk":"Corpo a corpo (Força) d12+8 de dano fís.","adv":"Vantagem ao atacar, correr, mover-se furtivamente"},{"n":"Híbrido Lendário","t":3,"ex":"(Esfinge, grifo etc.)","ab":["*Habilidades Híbridas:* **marque 1 Ponto de Fadiga adicional** para se transformar nesta criatura. Escolha duas opções quaisquer de Forma de Fera de 1º a 2º patamar. Escolha um total de quatro vantagens e duas habilidades dessas opções."],"st":"Força +2 | Evasão +3","atk":"Corpo a corpo (Força) d10+8 de dano fís.","adv":""},{"n":"Lagarto Poderoso","t":3,"ex":"(Crocodilo, jacaré, monstro-de-gila etc.)","ab":["*Armadura Física:* você recebe um bônus de +3 em seus limiares de dano.","*Golpe Súbito:* quando acerta um ataque contra um alvo corpo a corpo, você pode **gastar 1 Ponto de Esperança** para segurá-lo com a mandíbula, deixando-o temporariamente *Imobilizado* e *Vulnerável*."],"st":"Instinto +2 | Evasão +1","atk":"Corpo a corpo (Instinto) d10+7 de dano fís.","adv":"Vantagem ao atacar, mover-se furtivamente, rastrear"},{"n":"Predador Aquático","t":3,"ex":"(Golfinho, orca, tubarão etc.)","ab":["*Aquático:* você pode respirar e se movimentar naturalmente embaixo d’água.","*Ataque Voraz:* quando acerta um ataque em um alvo, você pode **gastar 1 Ponto de Esperança** para deixá-lo temporariamente *Vulnerável* e receber um bônus de +1 em Proficiência nesse ataque."],"st":"Agilidade +2 | Evasão +4","atk":"Cac (Agilidade) d10+6 de dano fís.","adv":"Vantagem ao atacar, nadar, rastrear"},{"n":"Caçador Aéreo Mítico","t":4,"ex":"(Dragão, pterodáctilo, roca, serpe etc.)","ab":["*Ave de Rapina Mortal:* você pode voar à vontade e se mover até um ponto em alcance distante como parte da sua ação. Quando ataca um alvo após se mover em linha reta até ficar corpo a corpo a ele a partir de próximo ou maior, você pode rolar novamente todos os dados de dano com um resultado menor que sua Proficiência.","*Besta de Carga:* você pode carregar até três aliados voluntários com você enquanto se movimenta."],"st":"Acuidade +3 | Evasão +4","atk":"Cac (Acuidade) d10+11 de dano fís.","adv":"Vantagem ao atacar, enganar, localizar, orientar-se"},{"n":"Fera Aquática Épica","t":4,"ex":"(Baleia, lula-gigante etc.)","ab":["*Mestre do Oceano:* você pode respirar e se movimentar naturalmente debaixo d’água. Quando acerta um ataque contra um alvo corpo a corpo, você pode deixá-lo temporariamente *Imobilizado*.","*Robusto:* quando for marcar Ponto de Armadura, role **1d6**. Em um resultado 5 ou mais, reduza a gravidade em um limiar sem marcar PA."],"st":"Agilidade +3 | Evasão +3","atk":"Cac (Agilidade) d10+10 de dano fís.","adv":"Vantagem ao intimidar, localizar, proteger, rastrear"},{"n":"Fera Massiva","t":4,"ex":"(Elefante, mamute, rinoceronte etc.)","ab":["*Besta de Carga:* você pode carregar até quatro aliados voluntários com você enquanto se movimenta.","*Demolir:* **gaste 1 Ponto de Esperança** para se mover até um ponto distante em linha reta e atacar todos os alvos corpo a corpo à linha. Alvos atingidos sofrem **d8+10** de dano físico usando sua Proficiência e ficam temporariamente *Vulneráveis*.","*Impávido:* você recebe um bônus de +2 em seus limiares de dano."],"st":"Força +3 | Evasão +1","atk":"Corpo a corpo (Força) d12+12 de dano fís.","adv":"Vantagem ao correr, intimidar, localizar, proteger"},{"n":"Fera Mítica","t":4,"ex":"(Aprimoramento de 1º ou 2º patamar)","ab":["*Evoluído:* escolha uma Forma de Fera de 1º ou 2° patamar e torne-se uma versão maior e mais poderosa dela. Enquanto estiver nessa forma, você mantém os atributos e habilidades da forma original e recebe os seguintes bônus: Bônus de +9 rolagens de dano; Bônus de +2 no atributo da forma; Bônus de +3 na Evasão; Seu dado de dano aumenta em um passo (d6 para d8, d8 para d10 etc.)."],"st":"","atk":"","adv":""},{"n":"Híbrido Mítico","t":4,"ex":"(Cocatriz, mantícora, quimera etc.)","ab":["*Habilidades Híbridas:* **marque 2 Ponto de Fadiga adicionais** para se transformar nesta criatura. Escolha duas opções quaisquer de Forma de Fera de 1º a 3º patamar. Escolha um total de cinco vantagens e três habilidades dessas opções."],"st":"Força +3 | Evasão +2","atk":"Corpo a corpo (Força) d12+10 de dano fís.","adv":""},{"n":"Lagarto Terrível","t":4,"ex":"(Braquiossauro, tiranossauro etc.)","ab":["*Disparada Massiva:* você pode se mover até um ponto em alcance distante sem precisar fazer uma teste. Você ignora terreno difícil (a critério do mestre) devido ao seu tamanho.","*Golpes Devastadores:* quando causa dano grave em um alvo corpo a corpo, você pode **marcar 1 Ponto de Fadiga** para forçá-lo a marcar 1 PV adicional."],"st":"Força +3 | Evasão +2","atk":"Corpo a corpo (Força) d12+10 de dano fís.","adv":"Vantagem ao atacar, enganar, intimidar, rastrear"}],"rules":["**Evasão:** enquanto estiver transformado, você soma o bônus de Evasão da criatura à sua Evasão normal. Por exemplo, se sua Evasão é 8 e sua Forma de Fera diz “Evasão +2”, sua Evasão nessa forma se torna 10.","**Vantagens:** sua forma faz com que você seja melhor em determinadas ações. Ao fazer um teste ou teste de reação relacionado a um dos verbos listados no grupo criatura, você faz o teste com vantagem. Por exemplo, um Explorador Ágil tem vantagem em testes feitos para se mover furtivamente, localizar objetos e criaturas e atividades relacionadas.","**Habilidades:** cada forma tem habilidades exclusivas. Por if(S.cls=='Ladino'&&S.sn){const sr=Array.from({length:tier(S.lvl)},()=>rnd(6)),sv=sr.reduce((a,b)=>a+b,0);t+=sv;parts.push('Furtivo '+sr.join('+'));S.sn=0}
showDmg(label,t,parts.join(' · '))}
function showDmg(label,t,txt){const ov=document.getElementById('ov');ov.innerHTML=`<div class="rs"><div class="t">Dano · ${E(label)}</div><div class="dc"><div class="d f roll" id="dx">?</div></div><div class="big" id="dt"></div><p class="tag" id="dn"></p><button class="btn" data-ok="1">Fechar</button></div>`;ov.classList.add('o');
const sh=setInterval(()=>{const e=document.getElementById('dx');if(e)e.textContent=rnd(20)},70);
setTimeout(()=>{clearInterval(sh);const x=document.getElementById('dx');if(!x)return;x.classList.remove('roll');x.textContent='✓';document.getElementById('dt').textContent=t;document.getElementById('dn').textContent=txt;LOG.unshift(`<b>Dano ${E(label)}</b>: ${t}<br><span class="tag">${E(txt)}</span>`);render();drawer()},800)}
/* ---------- ações ---------- */
function sp(path,v){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++){o[k[i]]??={};o=o[k[i]]}o[k[k.length-1]]=v}
function tgD(on){const d=document.getElementById('dr');d.classList.toggle('o',on);document.getElementById('fab').textContent=d.classList.contains('o')?'FECHAR':'ROLAR'}
document.getElementById('fab').addEventListener('click',e=>{e.stopImmediatePropagation();drawer();tgD()},true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'){tgD(false);document.getElementById('ov').classList.remove('o')}});
document.addEventListener('change',e=>{const t=e.target,p=t.dataset.n;if(p===undefined)return;sp(p,t.type=='number'?+t.value:t.value);render()});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.cf;if(!k)return;CF[k]=t.value;drawCat()});
document.addEventListener('change',e=>{const k=e.target.dataset.cf;if(k){CF[k]=e.target.value;drawCat()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,d=D();
if(a=='dc')tgD(false);
else if(a=='pk')openPick(v);
else if(a=='pf'){PK.f=v;showPick()}
else if(a=='ps'){const[k,n]=v.split('|');if(k=='arm')S.arm=n;else if(k[0]=='i')S.iw[+k[2]]=n;else{S[k]=n;if(k=='w1'&&wf(n)?.[5]==2)S.w2=''}document.getElementById('ov').classList.remove('o');render()}
else if(a=='eqw'){const[i,s]=v.split('|'),key='w'+s,tmp=S.iw[+i];S.iw[+i]=S[key];S[key]=tmp;if(wf(S.w1)?.[5]==2)S.w2='';render()}
else if(a=='insp'){const mx=S.lvl>=5?8:6,r=rnd(mx);LOG.unshift(`<b>Dado de Inspiração (d${mx})</b>: ${r}`);toast(`Dado de Inspiração d${mx}: <b style="font-size:30px">${r}</b>`);drawer()}
else if(a=='det'){const mx=S.lvl>=5?6:4;S.det=Math.max(1,Math.min(mx,S.det+ +v));render()}
else if(a=='dton'){S.dton=S.dton?0:1;S.det=1;render()}
else if(a=='sn'){S.sn=S.sn?0:1;render()}
else if(a=='pray'){const n=Math.max(0,Math.min(6,d.cast>=0?d.at[d.cast]:0));S.pd=Array.from({length:n},()=>rnd(4));render()}
else if(a=='pspend'){S.pd.splice(+v,1);render()}
else if(a=='sugat'){S.at=[...C[S.cls].a];render()}
else if(a=='addinv'){const g=DB.guide[S.cls];S.inv=S.inv+'\n'+g.inv.map(x=>x.replace(/\*/g,'')).join('\n');render()}
else if(a=='chip'){const[l,o]=v.split('|'),s=S.g.d[l]||[];S.g.d[l]=s.includes(o)?s.filter(x=>x!=o):[...s,o];render()}
else if(a=='acq'){const c=DB.cards[+v];if(S.pend<=0&&!confirm('Você não tem escolhas de carta pendentes. Adicionar mesmo assim?'))return;S.cards.push({...c,lo:S.cards.filter(x=>x.lo).length<5});if(S.pend>0)S.pend--;render()}
else if(a=='mvp'){const c=S.cards[+v];if(S.cards.filter(x=>x.lo).length>=5)return toast('Máximo de 5 cartas equipadas.');if(S.st+c.c>d.st)return toast('Fadiga insuficiente para pagar o custo de troca.');S.st+=c.c;c.lo=true;render()}
else if(a=='addc'){const n=document.getElementById('cn').value.trim();if(!n)return;S.cards.push({n,d:document.getElementById('cd').value,l:+document.getElementById('cl').value||1,t:'Personalizada',c:null,x:[document.getElementById('ct').value],lo:S.cards.filter(x=>x.lo).length<5});render()}
else if(a=='fm'){const[n,how]=v.split('|');if(how=='pf'){if(S.st>=d.st)return toast('Você não tem PF livre para marcar.');S.st++}else{if(S.hope<3)return toast('Esperança insuficiente.');S.hope-=3}S.form=n;render()}
else if(a=='fexit'){S.form='';render()}
else if(a=='fatk'){openRoll('Ataque · '+d.fm.n,d.fi>=0?d.at[d.fi]:0,'atk')}
else if(a=='cpf'){S.comp.pf=S.comp.pf==+v+1?+v:+v+1;render()}
else if(a=='ctr'){const[k,i]=v.split('|');S.comp.tr[k]=(S.comp.tr[k]||0)==+i+1?+i:+i+1;render()}
else if(a=='clink'){openRoll('Elo com o companheiro',d.cast>=0?d.at[d.cast]:0,'chk')}
else if(a=='cdmg'){const n=S.pr,r=Array.from({length:n},()=>rnd(S.comp.die));showDmg('Companheiro '+(S.comp.n||''),r.reduce((x,y)=>x+y,0),`${n}d${S.comp.die}: ${r.join('+')}`)}
else if(a=='qd'){const r=rnd(+v);LOG.unshift(`<b>d${v}</b>: ${r}`);drawer()}});
/* ---------- correções no fluxo de nível ---------- */
mig();render();drawer();
</script></body></html>
